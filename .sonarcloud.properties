# SonarCloud automatic analysis settings (docs/DOCUMENTATION.md, AGENTS.md
# "Code quality rules"). Keep in sync with the local Sonar-parity gates.

# Generated code, build outputs and dependencies are not ours to analyse.
# The migrations are PostgreSQL: Sonar analyses .sql files with its Oracle
# PL/SQL analyzer, whose rules (e.g. duplicated seed literals, EXISTS) do not
# apply, and applied migrations are immutable anyway.
sonar.exclusions=gen/**,api/openapi/**,**/node_modules/**,cmd/goeland-server/goeland-front/dist/**,pkg/core/module/db/migrations/**

# Declare the tests as tests so production-code rules (e.g. cognitive
# complexity on linear scenario tests) are not applied to them.
sonar.tests=.
sonar.test.inclusions=**/*_test.go,scripts/*_test.sh
