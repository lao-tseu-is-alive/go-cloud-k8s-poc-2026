            $ref: '#/definitions/v1FinalizeDocumentResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          description: id is the document UUID; a locked or deleted document is rejected.
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/DocumentServiceFinalizeDocumentBody'
      tags:
        - DocumentService
  /api/documents/{id}/integrity:
    get:
      summary: |-
        Non-mutating, NON-PROBATIVE stored-hash comparison: checks the caller's
