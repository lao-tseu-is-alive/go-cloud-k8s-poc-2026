  /api/relationships:
    post:
      summary: |-
        Create a typed, validated relationship (enforces kind compatibility + uniqueness of the active link).
        Requires goeland:write; writes a RELATIONSHIP_LINKED audit event. Fails with
        NOT_FOUND (unknown subject or type), FAILED_PRECONDITION (kind mismatch or a
        soft-deleted subject; locked subjects may still be linked) or ALREADY_EXISTS
        (an open edge of the same type already links the two subjects).
      operationId: LinkSubjects
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1LinkSubjectsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: body
          description: LinkSubjectsRequest creates a typed edge between two existing subjects.
          in: body
          required: true
          schema:
            $ref: '#/definitions/v1LinkSubjectsRequest'
      tags:
        - CoreService
  /api/relationships/{relationshipId}:
    delete:
      summary: |-
        Soft-delete an existing relationship (non-destructive) and write an audit event.
        Requires goeland:write; writes a RELATIONSHIP_UNLINKED audit event.
      operationId: UnlinkSubjects
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1UnlinkSubjectsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: relationshipId
          description: relationship_id is the active edge to unlink; NOT_FOUND when unknown or already unlinked.
          in: path
          required: true
          type: string
        - name: reason
          description: reason is the justification recorded on the audit event (at most 2000 characters).
          in: query
          required: false
          type: string
      tags:
        - CoreService
  /api/relationships/{relationshipId}/end:
    post:
      summary: |-
        End an open relationship in the business sense by setting its valid_to; the
        edge stays listed as history and a new open edge of the same type may then be
        created. Distinct from UnlinkSubjects, which removes a mistaken edge.
        Requires goeland:write; writes a RELATIONSHIP_ENDED audit event.
      operationId: EndRelationship
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1EndRelationshipResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: relationshipId
          description: |-
            relationship_id is the open edge to end; NOT_FOUND when unknown or unlinked,
            FAILED_PRECONDITION when it already has an end of validity.
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/CoreServiceEndRelationshipBody'
      tags:
        - CoreService
  /api/subjects:
    post:
      summary: |-
        Create a canonical subject identity + its record_metadata in one transaction.
        Every other create (Document, Case, Thing, Actor) calls this first.
        Requires goeland:write; writes a SUBJECT_CREATED audit event.
