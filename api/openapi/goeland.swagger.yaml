          $ref: '#/definitions/v1AuditEvent'
        description: events are the audit events of this page, newest first.
      nextPageToken:
        type: string
        description: next_page_token fetches the next page; empty on the last page.
      totalSize:
        type: integer
        format: int32
        description: total_size is the number of matching events across all pages.
    description: ListAuditEventsResponse is one page of audit events.
  v1ListCaseCirculationsResponse:
    type: object
    properties:
      circulations:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1Circulation'
        description: circulations are the case circulations, newest first.
    description: ListCaseCirculationsResponse returns the circulations with their recipients.
  v1ListCaseTasksResponse:
    type: object
    properties:
      tasks:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1Task'
        description: tasks are the tasks of this page.
      nextPageToken:
        type: string
        description: next_page_token fetches the next page; empty on the last page.
      totalSize:
        type: integer
        format: int32
        description: total_size is the number of matching tasks across all pages.
      openCount:
        type: integer
        format: int32
        description: |-
          open_count is the number of open or in-progress tasks of the case,
