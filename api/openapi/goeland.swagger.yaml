  v1ListCaseTypesResponse:
    type: object
    properties:
      caseTypes:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1CaseType'
        description: case_types are the matching types.
    description: ListCaseTypesResponse returns the matching case types, ordered by code.
  v1ListDocumentTypesResponse:
    type: object
    properties:
      documentTypes:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1DocumentType'
        description: document_types are the matching types.
    description: ListDocumentTypesResponse returns the matching catalogue entries.
  v1ListDocumentVersionsResponse:
    type: object
    properties:
      versions:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1DocumentVersion'
        description: versions are the versions with their content, newest first.
    description: ListDocumentVersionsResponse returns every version, newest first.
  v1ListGrantsResponse:
    type: object
    properties:
      grants:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1AccessGrant'
        description: grants are the grants.
    description: ListGrantsResponse returns the grants, current first, by level.
  v1ListGroupsResponse:
    type: object
    properties:
      groups:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1SecurityGroup'
        description: groups are the matching groups.
    description: ListGroupsResponse returns the groups.
  v1ListMyTasksResponse:
    type: object
    properties:
      tasks:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1Task'
        description: tasks are the tasks of this page.
      nextPageToken:
        type: string
        description: next_page_token fetches the next page; empty on the last page.
      totalSize:
        type: integer
        format: int32
        description: total_size is the number of matching tasks across all pages.
    description: ListMyTasksResponse is one page of the caller's tasks.
  v1ListOrgUnitTypesResponse:
    type: object
    properties:
      orgUnitTypes:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1OrgUnitType'
        description: org_unit_types are the matching types.
