  v1ListOrganizationCategoriesResponse:
    type: object
    properties:
      categories:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1OrganizationCategory'
        description: categories are the matching categories, ordered by label.
    description: ListOrganizationCategoriesResponse returns the matching categories.
  v1ListReferenceChangesResponse:
    type: object
    properties:
      changes:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1ReferenceChange'
        description: changes are the log entries, newest first.
      nextPageToken:
        type: string
        description: next_page_token fetches the next page; empty on the last page.
      totalSize:
        type: integer
        format: int32
        description: total_size is the number of matching entries across all pages.
    description: ListReferenceChangesResponse is a page of the reference change log.
  v1ListRelationshipTypesResponse:
    type: object
    properties:
      relationshipTypes:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1RelationshipType'
        description: relationship_types are the matching types.
    description: ListRelationshipTypesResponse returns the matching catalogue entries.
  v1ListRelationshipsResponse:
    type: object
    properties:
      relationships:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1SubjectRelationship'
        description: relationships are the edges of this page, hydrated with subjects and types.
      nextPageToken:
        type: string
        description: next_page_token fetches the next page; empty on the last page.
      totalSize:
        type: integer
        format: int32
        description: total_size is the number of matching edges across all pages.
      totalSizeCapped:
        type: boolean
        description: |-
          total_size_capped reports that total_size is a lower bound: counting stops
