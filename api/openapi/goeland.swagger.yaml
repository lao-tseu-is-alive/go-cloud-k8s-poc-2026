      label:
        type: string
        description: label is the required human label (1-200 characters).
      description:
        type: string
        description: description documents the business meaning (at most 2000 characters).
      reason:
        type: string
        description: reason is the justification recorded in the reference change log (at most 2000 characters).
    description: |-
      CreateThingTypeRequest adds a generic thing type (administrators only);
      parcel and building types are seeded.
    required:
      - code
      - label
  v1CreateThingTypeResponse:
    type: object
    properties:
