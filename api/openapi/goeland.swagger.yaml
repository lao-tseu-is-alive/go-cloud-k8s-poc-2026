            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          description: id is the document UUID.
          in: path
          required: true
          type: string
        - name: expectedSha256
          description: expected_sha256 is the caller's hex digest; empty never verifies.
          in: query
          required: false
          type: string
      tags:
        - DocumentService
