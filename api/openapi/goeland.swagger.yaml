        - TaskService
  /api/tasks/mine:
    get:
      summary: |-
        List the caller's tasks (and optionally their units') across cases,
        earliest deadline first. Requires goeland:read.
      operationId: ListMyTasks
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListMyTasksResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: statuses
          description: |-
            statuses restricts the result; empty means OPEN and IN_PROGRESS.

             - TASK_STATUS_UNSPECIFIED: TASK_STATUS_UNSPECIFIED is the zero value; never stored, "any status" in filters.
             - TASK_STATUS_OPEN: TASK_STATUS_OPEN is a task to do.
             - TASK_STATUS_IN_PROGRESS: TASK_STATUS_IN_PROGRESS is a task being worked on.
             - TASK_STATUS_DONE: TASK_STATUS_DONE is a completed task.
             - TASK_STATUS_CANCELLED: TASK_STATUS_CANCELLED is a task that will not be done (with a reason).
          in: query
          required: false
          type: array
          items:
            type: string
            enum:
              - TASK_STATUS_UNSPECIFIED
              - TASK_STATUS_OPEN
              - TASK_STATUS_IN_PROGRESS
              - TASK_STATUS_DONE
              - TASK_STATUS_CANCELLED
          collectionFormat: multi
        - name: includeUnits
          description: |-
            include_units also returns tasks assigned to the caller's org units
            (USER_MEMBER_OF_ORG_UNIT relationships).
          in: query
          required: false
          type: boolean
        - name: pageSize
          description: page_size is the page length; 0 means the default (25), at most 200.
          in: query
          required: false
          type: integer
          format: int32
        - name: pageToken
          description: page_token is the next_page_token of the previous page; empty for the first page.
          in: query
          required: false
          type: string
      tags:
        - TaskService
  /api/tasks/{id}:
    get:
      summary: Retrieve a task with its assignment history. Requires goeland:read.
      operationId: GetTask
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1GetTaskResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          description: id is the task UUID.
          in: path
          required: true
          type: string
      tags:
        - TaskService
    patch:
      summary: Replace the content of an open or in-progress task. Requires goeland:write; writes TASK_UPDATED.
      operationId: UpdateTask
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1UpdateTaskResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          description: id is the task UUID.
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/TaskServiceUpdateTaskBody'
      tags:
        - TaskService
  /api/tasks/{id}/assign:
    post:
      summary: |-
        (Re)assign or unassign an open or in-progress task; the change is kept in
        the history. Requires goeland:write; writes TASK_ASSIGNED.
      operationId: AssignTask
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1AssignTaskResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          description: id is the task UUID.
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/TaskServiceAssignTaskBody'
      tags:
        - TaskService
  /api/tasks/{id}/cancel:
    post:
      summary: |-
        Cancel an open or in-progress task with a required reason; records a
        SYSTEM timeline entry. Requires goeland:write; writes TASK_CANCELLED.
      operationId: CancelTask
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1CancelTaskResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          description: id is the task UUID.
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/TaskServiceCancelTaskBody'
      tags:
        - TaskService
  /api/tasks/{id}/complete:
    post:
      summary: |-
        Complete an open or in-progress task, with an optional note; records a
        SYSTEM timeline entry. Requires goeland:write; writes TASK_COMPLETED.
      operationId: CompleteTask
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1CompleteTaskResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          description: id is the task UUID.
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/TaskServiceCompleteTaskBody'
      tags:
        - TaskService
  /api/tasks/{id}/reopen:
    post:
      summary: |-
        Reopen a done or cancelled task with a required reason (→ OPEN).
        Requires goeland:write; writes TASK_REOPENED.
      operationId: ReopenTask
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ReopenTaskResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          description: id is the task UUID.
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/TaskServiceReopenTaskBody'
      tags:
        - TaskService
  /api/tasks/{id}/start:
    post:
      summary: Start an open task (OPEN → IN_PROGRESS). Requires goeland:write; writes TASK_STARTED.
      operationId: StartTask
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1StartTaskResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          description: id is the task UUID.
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/TaskServiceStartTaskBody'
      tags:
        - TaskService
  /api/thing-types:
    get:
      summary: List the thing type catalogue. Requires goeland:read.
      operationId: ListThingTypes
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListThingTypesResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: onlyActive
          description: only_active restricts the list to types offered for new things.
          in: query
          required: false
          type: boolean
      tags:
        - ThingService
    post:
      summary: Add a generic thing type. Requires goeland:admin; logs REFERENCE_CREATED.
      operationId: CreateThingType
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1CreateThingTypeResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: body
          description: |-
            CreateThingTypeRequest adds a generic thing type (administrators only);
            parcel and building types are seeded.
          in: body
          required: true
          schema:
            $ref: '#/definitions/v1CreateThingTypeRequest'
      tags:
        - ThingService
  /api/thing-types/{code}:
    patch:
      summary: Change a thing type. Requires goeland:admin; logs REFERENCE_UPDATED.
      operationId: UpdateThingType
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1UpdateThingTypeResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: code
          description: code selects the entry to update.
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/ThingServiceUpdateThingTypeBody'
      tags:
        - ThingService
  /api/things:
    post:
      summary: |-
        Register a thing (identity + governance + detail block + geometry) atomically.
        Requires goeland:write; writes a THING_CREATED audit event. Fails with
        INVALID_ARGUMENT (bad geometry or detail block) or ALREADY_EXISTS (parcel
        number, EGRID or EGID taken).
      operationId: CreateThing
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1CreateThingResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: body
          description: |-
            CreateThingRequest registers a thing. The specialization block must match the
            type's specialization (INVALID_ARGUMENT otherwise).
          in: body
          required: true
          schema:
            $ref: '#/definitions/v1CreateThingRequest'
      tags:
        - ThingService
  /api/things/search:
    get:
      summary: Search things by text, type and LV95 extent. Requires goeland:read.
      operationId: SearchThings
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1SearchThingsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: query
          description: |-
            query is plain text matched accent-insensitively against name, description
            and external reference, or exactly against a parcel number, EGRID or EGID
            (at most 200 characters); empty matches every thing.
          in: query
          required: false
          type: string
        - name: thingTypeCode
          description: thing_type_code restricts results to one type; empty means any.
          in: query
          required: false
          type: string
        - name: bbox
          description: |-
            bbox restricts results to things whose geometry intersects the LV95
            extent "e_min,n_min,e_max,n_max" (EPSG:2056); empty means anywhere.
          in: query
          required: false
          type: string
        - name: includeDeleted
          description: include_deleted also returns soft-deleted things.
          in: query
          required: false
          type: boolean
        - name: pageSize
          description: page_size is the page length; 0 means the default (25), at most 200.
          in: query
          required: false
          type: integer
          format: int32
        - name: pageToken
          description: page_token is the next_page_token of the previous page; empty for the first page.
          in: query
          required: false
          type: string
      tags:
        - ThingService
  /api/things/{id}:
    get:
      summary: Get a thing with optional relationships + audit. Requires goeland:read.
      operationId: GetThing
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1GetThingResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          description: id is the thing (subject_ref) UUID.
          in: path
          required: true
          type: string
        - name: includeRelationships
          description: include_relationships also returns the relationships in both directions.
          in: query
          required: false
          type: boolean
        - name: includeAudit
          description: include_audit also returns the 20 most recent audit events.
          in: query
          required: false
          type: boolean
      tags:
        - ThingService
    delete:
      summary: Soft-delete a thing (non-destructive). Requires goeland:write; writes THING_DELETED.
      operationId: DeleteThing
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1DeleteThingResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          description: id is the thing UUID; an already deleted thing is rejected, a locked one is not.
          in: path
          required: true
          type: string
        - name: reason
          description: reason is the justification recorded on the audit event (at most 2000 characters).
          in: query
          required: false
          type: string
      tags:
        - ThingService
    patch:
      summary: |-
        Update the editable fields of a thing. Requires goeland:write; writes a
        THING_UPDATED audit event; FAILED_PRECONDITION for a locked or deleted thing.
      operationId: UpdateThing
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1UpdateThingResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          description: id is the thing UUID.
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/ThingServiceUpdateThingBody'
      tags:
        - ThingService
  /api/timeline-entries/{entryId}/documents:
    post:
      summary: |-
        Cite a document in a draft. Requires goeland:write; writes
        TIMELINE_DOCUMENT_LINKED; ALREADY_EXISTS when the document is already cited.
      operationId: LinkTimelineDocument
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1LinkTimelineDocumentResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: entryId
          description: entry_id is the draft entry UUID.
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/TimelineServiceLinkTimelineDocumentBody'
      tags:
        - TimelineService
  /api/timeline-entries/{entryId}/documents/{documentId}:
    delete:
      summary: |-
        Remove a document from a draft. Requires goeland:write; writes
        TIMELINE_DOCUMENT_UNLINKED; NOT_FOUND when the document is not cited.
      operationId: UnlinkTimelineDocument
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1UnlinkTimelineDocumentResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: entryId
          description: entry_id is the draft entry UUID.
          in: path
          required: true
          type: string
        - name: documentId
          description: document_id is the cited document to remove.
          in: path
          required: true
          type: string
        - name: reason
          description: reason is the justification recorded on the audit event (at most 2000 characters).
          in: query
          required: false
          type: string
      tags:
        - TimelineService
  /api/timeline-entries/{id}:
    get:
      summary: |-
        Retrieve one entry with its documents.
        Requires goeland:read; NOT_FOUND when the entry does not exist.
      operationId: GetTimelineEntry
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1GetTimelineEntryResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          description: id is the entry UUID.
          in: path
          required: true
          type: string
      tags:
        - TimelineService
    patch:
      summary: |-
        Replace the content of a draft.
        Requires goeland:write; writes TIMELINE_ENTRY_UPDATED.
      operationId: UpdateTimelineEntry
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1UpdateTimelineEntryResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          description: id is the draft entry UUID.
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/TimelineServiceUpdateTimelineEntryBody'
      tags:
        - TimelineService
  /api/timeline-entries/{id}/lock:
    post:
      summary: |-
        Lock a draft as is: it becomes immutable without endorsement and the
        current document versions are pinned. Requires goeland:write; writes TIMELINE_ENTRY_LOCKED.
      operationId: LockTimelineEntry
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1LockTimelineEntryResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          description: id is the draft entry UUID.
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/TimelineServiceLockTimelineEntryBody'
      tags:
        - TimelineService
  /api/timeline-entries/{id}/validate:
    post:
      summary: |-
        Validate a draft: it becomes immutable and the current version of each
        cited document is pinned. Requires goeland:write; writes TIMELINE_ENTRY_VALIDATED.
      operationId: ValidateTimelineEntry
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ValidateTimelineEntryResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          description: id is the draft entry UUID.
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/TimelineServiceValidateTimelineEntryBody'
      tags:
        - TimelineService
  /api/timeline-entries/{id}/withdraw:
    post:
      summary: |-
        Withdraw a draft (kept, hidden by default).
        Requires goeland:write; writes TIMELINE_ENTRY_WITHDRAWN.
      operationId: WithdrawTimelineEntry
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1WithdrawTimelineEntryResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          description: id is the draft entry UUID.
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/TimelineServiceWithdrawTimelineEntryBody'
      tags:
        - TimelineService
  /api/users/search:
    get:
      summary: Find internal users by name or e-mail. Requires goeland:read.
      operationId: SearchUsers
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1SearchUsersResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: query
          description: |-
            query is matched by substring against the name (accent-insensitive) and
            the e-mail address; empty lists users by name.
          in: query
          required: false
          type: string
        - name: pageSize
          description: page_size is the maximum number of users; 0 means the default (25), at most 200.
          in: query
          required: false
          type: integer
          format: int32
      tags:
        - CoreService
  /api/users/{userId}/roles:
    get:
      summary: List a user's role assignments, optionally with the revoked ones. Requires goeland:read.
      operationId: ListUserRoles
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListUserRolesResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: userId
          description: user_id is the internal user (User.id).
          in: path
          required: true
          type: string
        - name: includeRevoked
          description: include_revoked also returns revoked assignments (history).
          in: query
          required: false
          type: boolean
      tags:
        - CoreService
    post:
      summary: |-
        Grant an application role to a user, audited on the user's subject.
        Requires goeland:admin.
      operationId: GrantUserRole
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1GrantUserRoleResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: userId
          description: user_id is the internal user (User.id); it must have signed in once.
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/CoreServiceGrantUserRoleBody'
      tags:
        - CoreService
  /api/users/{userId}/roles/{roleCode}/revoke:
    post:
      summary: |-
        Revoke an application role (kept as history, audited); refused for the
        last administrator. Requires goeland:admin.
      operationId: RevokeUserRole
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1RevokeUserRoleResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: userId
          description: user_id is the internal user (User.id).
          in: path
          required: true
          type: string
        - name: roleCode
          description: role_code is the role to revoke.
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/CoreServiceRevokeUserRoleBody'
      tags:
        - CoreService
  /api/users:batchGet:
    get:
      summary: |-
        Resolve operator ids (created_by, actor_user_id, ...) to users, e.g.
        /api/users:batchGet?userIds=1&userIds=2. Requires goeland:read.
      operationId: BatchGetUsers
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1BatchGetUsersResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: userIds
          description: user_ids are the operator ids to resolve (1 to 200, each 1-100 characters).
          in: query
          required: false
          type: array
          items:
            type: string
          collectionFormat: multi
      tags:
        - CoreService
definitions:
  AccessServiceAddGroupMemberBody:
    type: object
    properties:
      userId:
        type: string
        description: user_id is the user (User.id); it must have signed in once.
    description: AddGroupMemberRequest adds an internal user to a live group (MANAGE on it).
  AccessServiceArchiveGroupBody:
    type: object
    properties:
      reason:
        type: string
        description: reason explains the archiving.
    description: ArchiveGroupRequest archives a group (FULL_CONTROL on it); its grants stop applying.
  AccessServiceRemoveGroupMemberBody:
    type: object
    properties:
      reason:
        type: string
        description: reason explains the removal.
    description: |-
      RemoveGroupMemberRequest removes a member (MANAGE on the group); the
      membership is ended, kept as history.
  AccessServiceRevokeGrantBody:
    type: object
    properties:
      reason:
        type: string
        description: reason explains the revocation; it is audited.
    description: RevokeGrantRequest revokes a current grant (FULL_CONTROL on its subject).
  AccessServiceSetGrantBody:
    type: object
    properties:
      granteeKind:
        $ref: '#/definitions/v1GranteeKind'
        description: grantee_kind is who the grant is given to.
      granteeId:
        type: string
        description: grantee_id is the user id, or the group or org unit subject id.
      level:
        $ref: '#/definitions/v1Permission'
        description: level is the level to give (READ to FULL_CONTROL).
      reason:
        type: string
        description: reason explains the grant; it is audited.
    description: |-
      SetGrantRequest gives or changes the grant of a grantee on a subject
      (FULL_CONTROL on the subject); a changed level replaces the current grant,
      kept as history.
  AccessServiceUpdateGroupBody:
    type: object
    properties:
      name:
        type: string
        description: name is the new name.
      description:
        type: string
        description: description is the new description.
      reason:
        type: string
        description: reason explains the change.
    description: UpdateGroupRequest renames or redescribes a live group (MANAGE on it).
  ActorServiceUpdateActorBody:
    type: object
    properties:
      displayName:
        type: string
        description: |-
          display_name is the new name (1-200 characters). Validation currently
          requires it on every update, so it is always applied.
      isActive:
        type: boolean
        description: is_active activates or deactivates the actor when present.
      publicationCode:
        type: integer
        format: int32
        description: publication_code replaces the publication code when present.
      person:
        $ref: '#/definitions/v1PersonDetails'
        description: person replaces the PERSON fields.
      organization:
        $ref: '#/definitions/v1OrganizationDetails'
        description: organization replaces the ORGANIZATION fields.
      replaceContacts:
        type: boolean
        description: |-
          replace_contacts, when true, makes contacts the new full set; when false,
          contacts is ignored and the existing ones are kept.
      contacts:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1ActorContact'
        description: contacts is the new contact set, used only with replace_contacts.
      reason:
        type: string
        description: reason is the justification recorded on the audit event (at most 2000 characters).
      replaceAddresses:
        type: boolean
        description: |-
          replace_addresses, when true, makes addresses the new full set (previous
          links are ended, not deleted); when false, addresses is ignored.
      addresses:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1ActorAddress'
        description: addresses is the new address set (at most 20), used only with replace_addresses.
    description: |-
      UpdateActorRequest updates mutable fields. Blocked if the record is locked.
      contacts, when provided, replace the full set (managed as a whole for simplicity).
  ActorServiceUpdateOrganizationCategoryBody:
    type: object
    properties:
      label:
        type: string
        description: label replaces the label when present (1-200 characters).
      isActive:
        type: boolean
        description: |-
          is_active activates or deactivates the entry when present; an inactive
          entry stays valid for existing data but is no longer offered.
      reason:
        type: string
        description: reason is the justification recorded in the reference change log (at most 2000 characters).
    description: |-
      UpdateOrganizationCategoryRequest changes a organization category (administrators only); absent fields
      are kept. Entries are never deleted: deactivate them with is_active = false.
  CaseServiceSetCaseTypeDefaultGrantsBody:
    type: object
    properties:
      grants:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1CaseTypeDefaultGrant'
        description: grants is the whole new template (empty clears it; at most 50 lines, one per grantee).
      reason:
        type: string
        description: reason is the justification recorded in the reference change log (at most 2000 characters).
    description: SetCaseTypeDefaultGrantsRequest replaces the default grants of a case type.
  CaseServiceTransitionCaseBody:
    type: object
    properties:
      targetStatus:
        $ref: '#/definitions/v1CaseStatus'
        description: target_status is the requested status; UNSPECIFIED is rejected.
      reason:
        type: string
        description: reason is the justification (at most 2000 characters); required to close or reopen.
    description: |-
      TransitionCaseRequest moves a case to another status. Allowed transitions:
      OPEN → IN_PROGRESS | SUSPENDED | CLOSED; IN_PROGRESS → OPEN | SUSPENDED |
      CLOSED; SUSPENDED → OPEN | IN_PROGRESS | CLOSED; CLOSED → OPEN (reopen).
      Closing and reopening require a reason. Anything else is FAILED_PRECONDITION.
  CaseServiceUpdateCaseBody:
    type: object
    properties:
      title:
        type: string
        description: title is the new required title (1-500 characters).
      description:
        type: string
        description: description replaces the description (at most 4000 characters).
      metadata:
        type: object
        description: metadata replaces the whole extension map.
      reason:
        type: string
        description: reason is the justification recorded on the audit event (at most 2000 characters).
    description: |-
      UpdateCaseRequest replaces the editable metadata of a case (no partial merge).
      A closed, locked or deleted case is rejected.
  CaseServiceUpdateCaseTypeBody:
    type: object
    properties:
      label:
        type: string
        description: label replaces the label when present (1-200 characters).
      description:
        type: string
        description: description replaces the description when present (at most 2000 characters).
      businessRefNamespace:
        type: string
        description: |-
          business_ref_namespace replaces the allocation namespace when present
          (affects future cases only; empty stops allocation).
      isActive:
        type: boolean
        description: |-
          is_active activates or deactivates the entry when present; an inactive
          entry stays valid for existing data but is no longer offered.
      reason:
        type: string
        description: reason is the justification recorded in the reference change log (at most 2000 characters).
      defaultConfidentialityLevel:
        type: integer
        format: int32
        description: |-
          default_confidentiality_level replaces the minimum confidentiality of
          future cases when present (0-5).
    description: |-
      UpdateCaseTypeRequest changes a case type (administrators only); absent fields
      are kept. Entries are never deleted: deactivate them with is_active = false.
  CirculationServiceCancelCirculationBody:
    type: object
    properties:
      reason:
        type: string
        description: reason is the required justification (1-2000 characters).
    description: CancelCirculationRequest stops an open circulation.
    required:
      - reason
  CirculationServiceCreateCirculationBody:
    type: object
    properties:
      title:
        type: string
        description: title names the circulation (1-500 characters).
      message:
        type: string
        description: message is the request sent to the recipients (at most 4000 characters).
      dueAt:
        type: string
        format: date-time
        description: due_at is the optional deadline of the answers (also the recipients' task deadline).
      recipients:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1CirculationRecipientInput'
        description: recipients are 1 to 50 distinct users or units.
    description: CreateCirculationRequest sends an open case to recipients.
    required:
      - title
  CirculationServiceRespondToCirculationBody:
    type: object
    properties:
      response:
        $ref: '#/definitions/v1CirculationResponse'
        description: response is the answer.
      text:
        type: string
        description: text details the answer (at most 4000 characters); required for COMMENT and NEED_MORE_INFO.
    description: RespondToCirculationRequest records the answer of a recipient whose step is open.
  CoreServiceAssignBusinessRefBody:
    type: object
    properties:
      businessRef:
        $ref: '#/definitions/v1BusinessRefRequest'
        description: business_ref is the explicit or allocated reference to assign.
      reason:
        type: string
        description: reason is the justification recorded on the audit event (at most 2000 characters).
    description: AssignBusinessRefRequest gives an existing subject its business reference.
  CoreServiceEndRelationshipBody:
    type: object
    properties:
      validTo:
        type: string
        format: date-time
        description: |-
          valid_to is the business end of validity; the server time when absent. It
          may lie in the future (a scheduled end) but not before valid_from
          (INVALID_ARGUMENT).
      reason:
        type: string
        description: reason is the justification recorded on the audit event (at most 2000 characters).
    description: |-
      EndRelationshipRequest records that an open edge ended in the business sense
      ("the mandate ended"), keeping it in the graph as history. Use UnlinkSubjects
      instead when the edge was a mistake.
  CoreServiceGrantUserRoleBody:
    type: object
    properties:
      roleCode:
        type: string
        description: role_code is the role to grant.
      reason:
        type: string
        description: reason explains the grant; it is audited.
    description: GrantUserRoleRequest grants a role to a user (administrators only).
  CoreServiceRevokeUserRoleBody:
    type: object
    properties:
      reason:
        type: string
        description: reason explains the revocation; it is audited.
    description: |-
      RevokeUserRoleRequest revokes a role held by a user (administrators only);
      the last administrator cannot be revoked.
  CoreServiceUpdateRelationshipTypeBody:
    type: object
    properties:
      label:
        type: string
        description: label replaces the label when present (1-200 characters).
      inverseLabel:
        type: string
        description: inverse_label replaces the inverse label when present (at most 200 characters).
      description:
        type: string
        description: description replaces the description when present (at most 2000 characters).
      isActive:
        type: boolean
        description: |-
          is_active activates or deactivates the entry when present; an inactive
          entry stays valid for existing data but is no longer offered.
      reason:
        type: string
        description: reason is the justification recorded in the reference change log (at most 2000 characters).
    description: |-
      UpdateRelationshipTypeRequest changes a relationship type (administrators only); absent fields
      are kept. Entries are never deleted: deactivate them with is_active = false.
  DocumentServiceAddDocumentVersionBody:
    type: object
    properties:
      contentBlobId:
        type: string
        description: |-
          content_blob_id is the content from POST /api/documents/upload; empty for a
          metadata-only version. It may repeat an earlier version's content.
      isFinal:
        type: boolean
        description: is_final creates the version already final.
      isRecord:
        type: boolean
        description: is_record declares the version a record, which also makes it final.
      pageCount:
        type: integer
        format: int32
        description: page_count is the number of pages.
      metadata:
        type: object
        description: metadata holds secondary data about the version.
      reason:
        type: string
        description: reason is the justification recorded on the audit event (at most 2000 characters).
    description: AddDocumentVersionRequest appends a new current version to a document.
  DocumentServiceFinalizeDocumentBody:
    type: object
    properties:
      reason:
        type: string
        description: reason is the justification recorded on the audit event (at most 2000 characters).
      alsoLockGovernance:
        type: boolean
        description: also_lock_governance also sets record_metadata.is_locked, making the document immutable.
    description: FinalizeDocumentRequest marks a document final and optionally locks its governance record (immutable).
  DocumentServiceLinkDocumentBody:
    type: object
    properties:
      targetSubjectId:
        type: string
        description: target_subject_id is the subject the edge points to.
      relationshipTypeCode:
        type: string
        description: |-
          relationship_type_code selects a type whose source kind is DOCUMENT, e.g.
          DOCUMENT_AUTHORED_BY_ACTOR or DOCUMENT_SENT_TO_ACTOR.
      roleDetail:
        type: string
        description: role_detail optionally qualifies the relation (at most 500 characters).
    description: |-
      LinkDocumentRequest links a document to another subject (delegates to CoreService.LinkSubjects
      with document-specific validation + audit context).
    required:
      - relationshipTypeCode
  DocumentServiceUpdateDocumentMetadataBody:
    type: object
    properties:
      title:
        type: string
        description: title is the new required title (1-500 characters).
      description:
        type: string
        description: description replaces the description (at most 4000 characters).
      officialDate:
        type: string
        description: official_date replaces the legal date (YYYY-MM-DD); empty clears it.
      language:
        type: string
        description: language replaces the content language.
      metadata:
        type: object
        description: metadata replaces the whole extension map.
      reason:
        type: string
        description: reason is the justification recorded on the audit event (at most 2000 characters).
    description: |-
      UpdateDocumentMetadataRequest updates only mutable metadata. Blocked if the record is locked.
      Every field replaces the stored value (no partial merge).
  DocumentServiceUpdateDocumentTypeBody:
    type: object
    properties:
      label:
        type: string
        description: label replaces the label when present (1-200 characters).
      description:
        type: string
        description: description replaces the description when present (at most 2000 characters).
      category:
        type: string
        description: category replaces the category when present (at most 100 characters).
      isActive:
        type: boolean
        description: |-
          is_active activates or deactivates the entry when present; an inactive
          entry stays valid for existing data but is no longer offered.
      reason:
        type: string
        description: reason is the justification recorded in the reference change log (at most 2000 characters).
    description: |-
      UpdateDocumentTypeRequest changes a document type (administrators only); absent fields
      are kept. Entries are never deleted: deactivate them with is_active = false.
  OrgUnitServiceDissolveOrgUnitBody:
    type: object
    properties:
      reason:
        type: string
        description: reason is the required justification (1-2000 characters).
    description: DissolveOrgUnitRequest dissolves a unit (administrators only); it stays as history.
    required:
      - reason
  OrgUnitServiceUpdateOrgUnitBody:
    type: object
    properties:
      orgUnitTypeCode:
        type: string
        description: |-
          org_unit_type_code is the code of an active unit type (the current type
          stays valid even when deactivated).
      label:
        type: string
        description: label replaces the unit name (1-200 characters), unique among live siblings.
      description:
        type: string
        description: description replaces the mission (at most 2000 characters).
      email:
        type: string
        description: email replaces the functional mailbox; empty removes it.
      parentId:
        type: string
        description: |-
          parent_id moves the unit under another live unit (never under itself or
          one of its descendants); empty makes it a root.
      reason:
        type: string
        description: reason is the justification recorded on the audit event (at most 2000 characters).
      abbreviation:
        type: string
        description: abbreviation replaces the unit sigle (at most 50 characters); empty removes it.
    description: |-
      UpdateOrgUnitRequest replaces the editable fields of a live unit
      (administrators only); the external reference is immutable.
    required:
      - orgUnitTypeCode
      - label
  OrgUnitServiceUpdateOrgUnitTypeBody:
    type: object
    properties:
      label:
        type: string
        description: label replaces the label when present (1-200 characters).
      description:
        type: string
        description: description replaces the description when present (at most 2000 characters).
      isActive:
        type: boolean
        description: is_active activates or deactivates the entry when present.
      reason:
        type: string
        description: reason is the justification recorded in the reference change log (at most 2000 characters).
    description: |-
      UpdateOrgUnitTypeRequest changes a unit type (administrators only); absent
      fields are kept. Entries are never deleted: deactivate them with is_active = false.
  TaskServiceAssignTaskBody:
    type: object
    properties:
      assigneeUserId:
        type: string
        description: assignee_user_id is an internal user (operator id); exclusive with assignee_org_unit_id.
      assigneeOrgUnitId:
        type: string
        description: assignee_org_unit_id is a live org unit; exclusive with assignee_user_id.
      reason:
        type: string
        description: reason is the justification kept in the assignment history (at most 2000 characters).
    description: |-
      AssignTaskRequest (re)assigns an open or in-progress task; both assignees
      empty unassigns it.
  TaskServiceCancelTaskBody:
    type: object
    properties:
      reason:
        type: string
        description: reason is the required justification (1-2000 characters).
    description: CancelTaskRequest cancels an open or in-progress task.
    required:
      - reason
  TaskServiceCompleteTaskBody:
    type: object
    properties:
      note:
        type: string
        description: |-
          note is the optional completion note (at most 4000 characters), also
          written in the timeline entry.
    description: CompleteTaskRequest completes an open or in-progress task.
  TaskServiceCreateTaskBody:
    type: object
    properties:
      taskTypeCode:
        type: string
        description: task_type_code is the code of an active task type.
      title:
        type: string
        description: title is the required title (1-500 characters).
      description:
        type: string
        description: description details the work (at most 4000 characters).
      dueAt:
        type: string
        format: date-time
        description: due_at is the optional deadline.
      assigneeUserId:
        type: string
        description: assignee_user_id assigns an internal user (an operator id); exclusive with assignee_org_unit_id.
      assigneeOrgUnitId:
        type: string
        description: assignee_org_unit_id assigns a live org unit; exclusive with assignee_user_id.
    description: CreateTaskRequest adds a manual task to an open case.
    required:
      - taskTypeCode
      - title
  TaskServiceReopenTaskBody:
    type: object
    properties:
      reason:
        type: string
        description: reason is the required justification (1-2000 characters).
    description: ReopenTaskRequest reopens a done or cancelled task.
    required:
      - reason
  TaskServiceStartTaskBody:
    type: object
    description: StartTaskRequest starts an open task.
  TaskServiceUpdateTaskBody:
    type: object
    properties:
      taskTypeCode:
        type: string
        description: |-
          task_type_code is the code of a task type (the current type stays valid
          even when deactivated; a new one must be active).
      title:
        type: string
        description: title replaces the title (1-500 characters).
      description:
        type: string
        description: description replaces the description (at most 4000 characters).
      dueAt:
        type: string
        format: date-time
        description: due_at replaces the deadline; absent removes it.
      reason:
        type: string
        description: reason is the justification recorded on the audit event (at most 2000 characters).
    description: |-
      UpdateTaskRequest replaces the content of an open or in-progress task; every
      field replaces the stored value (an absent due_at removes the deadline).
    required:
      - taskTypeCode
      - title
  TaskServiceUpdateTaskTypeBody:
    type: object
    properties:
      label:
        type: string
        description: label replaces the label when present (1-200 characters).
      description:
        type: string
        description: description replaces the description when present (at most 2000 characters).
      isActive:
        type: boolean
        description: is_active activates or deactivates the entry when present.
      reason:
        type: string
        description: reason is the justification recorded in the reference change log (at most 2000 characters).
    description: |-
      UpdateTaskTypeRequest changes a task type (administrators only); absent
      fields are kept. Entries are never deleted: deactivate them with is_active = false.
  ThingServiceUpdateThingBody:
    type: object
    properties:
      name:
        type: string
        description: name is the new name (1-300 characters).
      description:
        type: string
        description: description replaces the description (at most 4000 characters).
      externalRef:
        type: string
        description: external_ref replaces the source-system identifier (at most 200 characters).
      geometryGeojson:
        type: string
        description: |-
          geometry_geojson replaces the geometry (same rules as on create); empty
          removes it.
      parcel:
        $ref: '#/definitions/v1ParcelDetails'
        description: parcel replaces the parcel identifiers.
      building:
        $ref: '#/definitions/v1BuildingDetails'
        description: building replaces the building identifiers.
      metadata:
        type: object
        description: metadata replaces the secondary data.
      reason:
        type: string
        description: reason is the justification recorded on the audit event (at most 2000 characters).
    description: |-
      UpdateThingRequest replaces the editable fields of an unlocked, live thing;
      the type is fixed at creation.
    required:
      - name
  ThingServiceUpdateThingTypeBody:
    type: object
    properties:
      label:
        type: string
        description: label replaces the label when present (1-200 characters).
      description:
        type: string
        description: description replaces the description when present (at most 2000 characters).
      isActive:
        type: boolean
        description: is_active activates or deactivates the entry when present.
      reason:
        type: string
        description: reason is the justification recorded in the reference change log (at most 2000 characters).
    description: |-
      UpdateThingTypeRequest changes a thing type (administrators only); absent
      fields are kept, and the code and specialization never change.
  TimelineServiceCreateTimelineEntryBody:
    type: object
    properties:
      entryType:
        $ref: '#/definitions/v1TimelineEntryType'
        description: entry_type is the nature of the entry; SYSTEM and AI_PROPOSAL are rejected.
      title:
        type: string
        description: title is an optional headline (at most 500 characters).
      body:
        type: string
        description: body is the required content (1-20000 characters); surrounding whitespace is trimmed.
      visibility:
        $ref: '#/definitions/v1TimelineVisibility'
        description: visibility is the intended audience; UNSPECIFIED means CASE_PARTICIPANTS.
      occurredAt:
        type: string
        format: date-time
        description: |-
          occurred_at is the business date of the event; absent means now. It may
          not lie in the future.
      correctsEntryId:
        type: string
        description: |-
          corrects_entry_id is an immutable (validated or locked) entry of the same
          case that this entry corrects; it may be corrected only once.
      documentIds:
        type: array
        items:
          type: string
        description: |-
          document_ids are documents cited by the entry (at most 50); each one is
          also linked to the case (CASE_HAS_DOCUMENT) when it is not already.
    description: CreateTimelineEntryRequest adds a draft entry to an open (not closed) case.
    required:
      - body
  TimelineServiceLinkTimelineDocumentBody:
    type: object
    properties:
      documentId:
        type: string
        description: |-
          document_id is the document to cite; it is also linked to the case
          (CASE_HAS_DOCUMENT) when it is not already.
    description: LinkTimelineDocumentRequest cites a document in a draft entry.
  TimelineServiceLockTimelineEntryBody:
    type: object
    properties:
      reason:
        type: string
        description: reason is the justification recorded on the audit event (at most 2000 characters).
    description: LockTimelineEntryRequest freezes a draft as is, without endorsing it.
  TimelineServiceUpdateTimelineEntryBody:
    type: object
    properties:
      entryType:
        $ref: '#/definitions/v1TimelineEntryType'
        description: entry_type is the nature of the entry; SYSTEM and AI_PROPOSAL are rejected.
      title:
        type: string
        description: title replaces the headline (at most 500 characters).
      body:
        type: string
        description: body replaces the content (1-20000 characters).
      visibility:
        $ref: '#/definitions/v1TimelineVisibility'
        description: visibility replaces the audience; UNSPECIFIED means CASE_PARTICIPANTS.
      occurredAt:
        type: string
        format: date-time
        description: occurred_at replaces the business date when present; never in the future.
      reason:
        type: string
        description: reason is the justification recorded on the audit event (at most 2000 characters).
    description: |-
      UpdateTimelineEntryRequest replaces the content of a draft. Every field
      replaces the stored value, except occurred_at which is kept when absent.
    required:
      - body
  TimelineServiceValidateTimelineEntryBody:
    type: object
    properties:
      reason:
        type: string
        description: reason is the justification recorded on the audit event (at most 2000 characters).
    description: ValidateTimelineEntryRequest endorses a draft, making it immutable.
  TimelineServiceWithdrawTimelineEntryBody:
    type: object
    properties:
      reason:
        type: string
        description: reason is the required justification (1-2000 characters).
    description: WithdrawTimelineEntryRequest sets a draft aside (non-destructive).
    required:
      - reason
  protobufAny:
    type: object
    properties:
      '@type':
        type: string
    additionalProperties: {}
  protobufNullValue:
    type: string
    enum:
      - NULL_VALUE
    default: NULL_VALUE
    description: |-
      `NullValue` is a singleton enumeration to represent the null value for the
      `Value` type union.

      The JSON representation for `NullValue` is JSON `null`.

       - NULL_VALUE: Null value.
  rpcStatus:
    type: object
    properties:
      code:
        type: integer
        format: int32
      message:
        type: string
      details:
        type: array
        items:
          type: object
          $ref: '#/definitions/protobufAny'
  v1Access:
    type: object
    properties:
      subjectId:
        type: string
        description: subject_id is the subject.
      kind:
        $ref: '#/definitions/v1SubjectKind'
        description: kind is the subject's kind.
      confidential:
        type: boolean
        description: confidential reports confidentiality_level >= 2 (explicit grant required).
      level:
        $ref: '#/definitions/v1Permission'
        description: level is the effective level (PERMISSION_NONE when none).
      source:
        $ref: '#/definitions/v1AccessSource'
        description: source is the rule that produced the level.
    description: Access is the caller's effective level on a subject.
  v1AccessGrant:
    type: object
    properties:
      id:
        type: string
        description: id identifies the grant.
      subjectId:
        type: string
        description: subject_id is the subject the grant is on.
      granteeKind:
        $ref: '#/definitions/v1GranteeKind'
        description: grantee_kind is who the grant is given to.
      granteeId:
        type: string
        description: grantee_id is the user id, or the group or org unit subject id.
      granteeLabel:
        type: string
        description: grantee_label is the grantee's display name.
        readOnly: true
      level:
        $ref: '#/definitions/v1Permission'
        description: level is the granted level.
      grantedAt:
        type: string
        format: date-time
        description: granted_at is when the grant was made.
      grantedBy:
        type: string
        description: granted_by is the operator who made it.
      grantReason:
        type: string
        description: grant_reason explains it.
      revokedAt:
        type: string
        format: date-time
        description: revoked_at is when it was revoked or replaced; unset while current.
      revokedBy:
        type: string
        description: revoked_by is the operator who revoked it; empty while current.
      revokeReason:
        type: string
        description: revoke_reason explains the revocation.
    description: AccessGrant is one grant on a subject; a revoked grant is kept as history.
  v1AccessSource:
    type: string
    enum:
      - ACCESS_SOURCE_UNSPECIFIED
      - ACCESS_SOURCE_PERSONAL
      - ACCESS_SOURCE_GROUP
      - ACCESS_SOURCE_ORG_UNIT
      - ACCESS_SOURCE_ROLE
      - ACCESS_SOURCE_BASELINE
    default: ACCESS_SOURCE_UNSPECIFIED
    description: |-
      AccessSource tells which rule produced an effective level.

       - ACCESS_SOURCE_UNSPECIFIED: ACCESS_SOURCE_UNSPECIFIED is the zero value.
       - ACCESS_SOURCE_PERSONAL: ACCESS_SOURCE_PERSONAL is a grant to the user.
       - ACCESS_SOURCE_GROUP: ACCESS_SOURCE_GROUP is the highest grant to one of the user's groups.
       - ACCESS_SOURCE_ORG_UNIT: ACCESS_SOURCE_ORG_UNIT is the grant of the nearest of the user's units or their ancestors.
       - ACCESS_SOURCE_ROLE: ACCESS_SOURCE_ROLE is an application role (ADMIN or a role covering the kind).
       - ACCESS_SOURCE_BASELINE: ACCESS_SOURCE_BASELINE is the default: READ unless the subject is confidential.
  v1Actor:
    type: object
    properties:
      subjectRef:
        $ref: '#/definitions/v1SubjectRef'
        description: subject_ref is the embedded canonical identity (kind = ACTOR); its id is the actor id.
      actorKind:
        $ref: '#/definitions/v1ActorKind'
        description: actor_kind is PERSON or ORGANIZATION, fixed at creation.
      displayName:
        type: string
        description: |-
          display_name is the usual name shown and searched (1-200 characters,
          production Acteur.Name), e.g. "Migros Flon", mirrored into the subject label;
          an organization's registered name is OrganizationDetails.legal_name.
      nameForSearch:
        type: string
        description: name_for_search is the lower-cased display_name, recomputed on rename.
        readOnly: true
      isActive:
        type: boolean
        description: |-
          is_active is the business activation flag (production Acteur.IsActive),
          distinct from soft deletion.
      publicationCode:
        type: integer
        format: int32
        description: publication_code is the opaque production Acteur.CodePublication.
      person:
        $ref: '#/definitions/v1PersonDetails'
        description: person is set for ACTOR_KIND_PERSON.
      organization:
        $ref: '#/definitions/v1OrganizationDetails'
        description: organization is set for ACTOR_KIND_ORGANIZATION.
      contacts:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1ActorContact'
        description: contacts are the typed contacts, ordered by type then creation time.
      createdAt:
        type: string
        format: date-time
        description: created_at is the server creation time.
        readOnly: true
      createdBy:
        type: string
        description: created_by is the operator who created the actor.
      updatedAt:
        type: string
        format: date-time
        description: updated_at is the last modification time, maintained by the database.
        readOnly: true
      recordMetadata:
        $ref: '#/definitions/v1RecordMetadata'
        description: record_metadata is the governance record (confidentiality, lock, owner...).
      addresses:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1ActorAddress'
        description: addresses are the actor's current postal addresses, principal first.
    description: Actor is an external person or organization, 1:1 with SubjectRef (id == subject id).
    required:
      - displayName
  v1ActorAddress:
    type: object
    properties:
      id:
        type: string
        description: id is the server-assigned id of the actor-address link.
        readOnly: true
      addressType:
        $ref: '#/definitions/v1AddressType'
        description: address_type is the required role of the address for this actor.
      isPrincipal:
        type: boolean
        description: |-
          is_principal marks the actor's principal address; at most one per actor,
          and the first address becomes principal when none is marked.
      street:
        type: string
        description: street is the required street name (1-200 characters), e.g. "Place de la Palud".
      houseNumber:
        type: string
        description: house_number is the optional number with its suffix (at most 20 characters), e.g. "2bis".
      addressLine2:
        type: string
        description: 'address_line2 is an optional complement (at most 200 characters): c/o, building, floor.'
      postalCode:
        type: string
        description: |-
          postal_code is the required postal code (1-20 characters); a Swiss one has
          four digits, 1000-9999 (INVALID_ARGUMENT otherwise).
      locality:
        type: string
        description: locality is the required locality (1-100 characters), e.g. "Lausanne".
      countryCode:
        type: string
        description: country_code is the ISO 3166-1 alpha-2 country; empty means CH.
      label:
        type: string
        description: label is an optional free note (at most 100 characters); required for OTHER.
      createdAt:
        type: string
        format: date-time
        description: created_at is when the address was linked to the actor.
        readOnly: true
    description: |-
      ActorAddress is one postal address of an actor with its role. Addresses are
      stored as their own rows linked to actors (M:N); replacing an actor's
      addresses ends the previous links instead of deleting them.
    required:
      - street
      - postalCode
      - locality
  v1ActorContact:
    type: object
    properties:
      contactType:
        $ref: '#/definitions/v1ContactType'
        description: contact_type is the required, defined contact type.
      value:
        type: string
        description: |-
          value is the channel or identifier (1-400 characters, trimmed), validated and
          stored normalized per contact_type (INVALID_ARGUMENT otherwise): phones and fax
          in E.164 (+41213152222; Swiss national 021 315 22 22 and 00 prefixes are
          converted); a bare e-mail address; an http(s) website (https:// added when
          missing); "Case postale <n>"; IDE as CHE-123.456.788 with a valid modulo-11
          check digit; VAT as an IDE followed by MWST, TVA or IVA; ABACUS as 1-10 digits;
          commercial register as CH-550.1.012.345-6 or a register URL; OTHER is free text.
      isPrimary:
        type: boolean
        description: is_primary marks the preferred channel of its type; not enforced as unique.
      label:
        type: string
        description: label is an optional free note (at most 100 characters); required for OTHER.
    description: |-
      ActorContact is one typed contact channel or business identifier attached to an
      actor (production ActeurComplement row: IdTypeComplement + Complement).
    required:
      - value
  v1ActorKind:
    type: string
    enum:
      - ACTOR_KIND_UNSPECIFIED
      - ACTOR_KIND_PERSON
      - ACTOR_KIND_ORGANIZATION
    default: ACTOR_KIND_UNSPECIFIED
    description: |-
      ActorKind discriminates a physical person from a moral organization
      (production Acteur.IsPhysique).

       - ACTOR_KIND_UNSPECIFIED: ACTOR_KIND_UNSPECIFIED is the zero value; rejected on create and means
      "any kind" in searches.
       - ACTOR_KIND_PERSON: ACTOR_KIND_PERSON is a personne physique (IsPhysique = true).
       - ACTOR_KIND_ORGANIZATION: ACTOR_KIND_ORGANIZATION is a personne morale (IsPhysique = false).
  v1AddDocumentVersionResponse:
    type: object
    properties:
      document:
        $ref: '#/definitions/v1Document'
        description: document is the document; its current_version is the new version.
      version:
        $ref: '#/definitions/v1DocumentVersion'
        description: version is the new version.
      auditEvent:
        $ref: '#/definitions/v1AuditEvent'
        description: audit_event is the DOCUMENT_VERSION_ADDED audit event.
    description: AddDocumentVersionResponse returns the document with its new current version.
  v1AddGroupMemberResponse:
    type: object
    properties:
      member:
        $ref: '#/definitions/v1GroupMember'
        description: member is the new membership.
      auditEvent:
        $ref: '#/definitions/v1AuditEvent'
        description: audit_event is the RELATIONSHIP_LINKED event on the user's subject.
    description: AddGroupMemberResponse returns the membership and its audit event.
  v1AddressType:
    type: string
    enum:
      - ADDRESS_TYPE_UNSPECIFIED
      - ADDRESS_TYPE_HEAD_OFFICE
      - ADDRESS_TYPE_BRANCH
      - ADDRESS_TYPE_CORRESPONDENCE
      - ADDRESS_TYPE_BILLING
      - ADDRESS_TYPE_RESIDENCE
      - ADDRESS_TYPE_OTHER
    default: ADDRESS_TYPE_UNSPECIFIED
    description: |-
      AddressType is the role an address plays for one actor (production
      lien_acteur_adresse qualification).

       - ADDRESS_TYPE_UNSPECIFIED: ADDRESS_TYPE_UNSPECIFIED is the zero value; rejected on input.
       - ADDRESS_TYPE_HEAD_OFFICE: ADDRESS_TYPE_HEAD_OFFICE is an organization's registered office (siège).
       - ADDRESS_TYPE_BRANCH: ADDRESS_TYPE_BRANCH is a branch or establishment (succursale) of the same actor.
       - ADDRESS_TYPE_CORRESPONDENCE: ADDRESS_TYPE_CORRESPONDENCE is where mail is sent.
       - ADDRESS_TYPE_BILLING: ADDRESS_TYPE_BILLING is where invoices are sent.
       - ADDRESS_TYPE_RESIDENCE: ADDRESS_TYPE_RESIDENCE is a person's home (domicile).
       - ADDRESS_TYPE_OTHER: ADDRESS_TYPE_OTHER is any other role; label should describe it.
  v1AppRole:
    type: object
    properties:
      code:
        type: string
        description: code is the stable identifier (upper case, e.g. ADMIN).
      label:
        type: string
        description: label is the human name.
      description:
        type: string
        description: description tells what the role allows.
      isActive:
        type: boolean
        description: is_active is false for a role that can no longer be granted.
    description: |-
      AppRole is an application role stored in Goéland (GLD-047). ADMIN is the role
      behind the goeland:admin scope.
  v1ArchiveGroupResponse:
    type: object
    properties:
      group:
        $ref: '#/definitions/v1SecurityGroup'
        description: group is the archived group.
      auditEvent:
        $ref: '#/definitions/v1AuditEvent'
        description: audit_event is the GROUP_ARCHIVED event.
    description: ArchiveGroupResponse returns the group and its audit event.
  v1AssignBusinessRefResponse:
    type: object
    properties:
      subjectRef:
        $ref: '#/definitions/v1SubjectRef'
        description: subject_ref is the subject with business_ref set.
      auditEvent:
        $ref: '#/definitions/v1AuditEvent'
        description: audit_event is the BUSINESS_REF_ASSIGNED audit event.
    description: AssignBusinessRefResponse returns the subject with its reference.
  v1AssignTaskResponse:
    type: object
    properties:
      task:
        $ref: '#/definitions/v1Task'
        description: task is the task with its new assignee.
      assignEvent:
        $ref: '#/definitions/v1AuditEvent'
        description: assign_event is the TASK_ASSIGNED audit event.
    description: AssignTaskResponse returns the reassigned task.
  v1AuditEvent:
    type: object
    properties:
      id:
        type: string
        description: id is the server-assigned event UUID.
      subjectId:
        type: string
        description: subject_id is the subject the event is about.
      eventType:
        type: string
        description: |-
          event_type is an upper-case code (1-100 characters), e.g. DOCUMENT_CREATED,
          RELATIONSHIP_LINKED or DOCUMENT_FINALIZED.
      actorUserId:
        type: string
        description: |-
          actor_user_id is the authenticated operator who caused the event (not a
          domain ACTOR subject), derived server-side.
      occurredAt:
        type: string
        format: date-time
        description: occurred_at is the server time of the event.
        readOnly: true
      beforeState:
        type: object
        description: |-
          before_state is a snapshot of the changed critical fields before the
          mutation; absent for creations.
      afterState:
        type: object
        description: after_state is a snapshot of the changed critical fields after the mutation.
      reason:
        type: string
        description: reason is the operator-supplied justification (at most 2000 characters).
      correlationId:
        type: string
        description: |-
          correlation_id groups the events of one multi-subject action; empty when
          the event stands alone.
      requestId:
        type: string
        description: request_id is the HTTP request identifier the event was written under.
      metadata:
        type: object
        description: metadata is secondary context for the event.
    description: |-
      AuditEvent is an append-only probative audit record, written on every mutation
      in the same transaction as the change it records.
    required:
      - eventType
  v1BatchGetUsersResponse:
    type: object
    properties:
      users:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1User'
        description: users are the resolved users, ordered by id.
    description: BatchGetUsersResponse returns the known users; unknown ids are absent.
  v1BuildingDetails:
    type: object
    properties:
      egid:
        type: integer
        format: int32
        description: egid is the federal building identifier (RegBL/GWR); 0 when unknown; unique.
      ecaNumber:
        type: string
        description: eca_number is the cantonal insurance (ECA) number (at most 20 characters).
      constructionYear:
        type: integer
        format: int32
        description: construction_year is 1000-2100; 0 when unknown.
      buildingStatus:
        $ref: '#/definitions/v1BuildingStatus'
        description: building_status is the RegBL status; UNSPECIFIED when unknown.
    description: BuildingDetails are the register identifiers of a building.
  v1BuildingStatus:
    type: string
    enum:
      - BUILDING_STATUS_UNSPECIFIED
      - BUILDING_STATUS_PLANNED
      - BUILDING_STATUS_AUTHORIZED
      - BUILDING_STATUS_UNDER_CONSTRUCTION
      - BUILDING_STATUS_EXISTING
      - BUILDING_STATUS_UNUSABLE
      - BUILDING_STATUS_DEMOLISHED
      - BUILDING_STATUS_NOT_REALIZED
    default: BUILDING_STATUS_UNSPECIFIED
    description: |-
      BuildingStatus is the building status of the federal register of buildings
      (RegBL / GWR, codes 1001-1008).

       - BUILDING_STATUS_UNSPECIFIED: BUILDING_STATUS_UNSPECIFIED means unknown.
       - BUILDING_STATUS_PLANNED: BUILDING_STATUS_PLANNED is a planned building (1001, projeté).
       - BUILDING_STATUS_AUTHORIZED: BUILDING_STATUS_AUTHORIZED is an authorized building (1002, autorisé).
       - BUILDING_STATUS_UNDER_CONSTRUCTION: BUILDING_STATUS_UNDER_CONSTRUCTION is being built (1003, en construction).
       - BUILDING_STATUS_EXISTING: BUILDING_STATUS_EXISTING is an existing building (1004, existant).
       - BUILDING_STATUS_UNUSABLE: BUILDING_STATUS_UNUSABLE is an unusable building (1005, non utilisable).
       - BUILDING_STATUS_DEMOLISHED: BUILDING_STATUS_DEMOLISHED is a demolished building (1007, démoli).
       - BUILDING_STATUS_NOT_REALIZED: BUILDING_STATUS_NOT_REALIZED is a building that was not built (1008, non réalisé).
  v1BusinessRefRequest:
    type: object
    properties:
      namespace:
        type: string
        description: |-
          namespace scopes uniqueness, e.g. OPC: an upper-case letter followed by up
          to 31 upper-case letters, digits or underscores. Required with allocate;
          empty allows a free, non-unique explicit value (e.g. a legacy number).
      value:
        type: string
        description: value is an explicit reference (1-100 characters, no surrounding whitespace).
      allocate:
        type: boolean
        description: |-
          allocate, when true, asks for the next "<YYYY>-<NNNNNN>" reference of the
          namespace for the current calendar year in Europe/Zurich (e.g. 2026-000042).
    description: |-
      BusinessRefRequest asks for a business reference on a subject: an explicit
      value or a server-allocated one. A subject keeps its first reference.
  v1CancelCirculationResponse:
    type: object
    properties:
      circulation:
        $ref: '#/definitions/v1Circulation'
        description: circulation is the cancelled circulation (its open tasks are cancelled).
      cancelEvent:
        $ref: '#/definitions/v1AuditEvent'
        description: cancel_event is the CIRCULATION_CANCELLED audit event.
    description: CancelCirculationResponse returns the cancelled circulation.
  v1CancelTaskResponse:
    type: object
    properties:
      task:
        $ref: '#/definitions/v1Task'
        description: task is the task, CANCELLED.
      statusEvent:
        $ref: '#/definitions/v1AuditEvent'
        description: status_event is the TASK_CANCELLED audit event.
    description: CancelTaskResponse returns the cancelled task.
  v1Case:
    type: object
    properties:
      subjectRef:
        $ref: '#/definitions/v1SubjectRef'
        description: |-
          subject_ref is the embedded canonical identity (kind = CASE), including the
          business reference; its id is the case id.
      caseType:
        $ref: '#/definitions/v1CaseType'
        description: case_type is the classification chosen at creation.
      title:
        type: string
        description: title is the case title (1-500 characters), mirrored into the subject label.
      description:
        type: string
        description: description is free text (at most 4000 characters).
      status:
        $ref: '#/definitions/v1CaseStatus'
        description: status is the operational state.
      openedAt:
        type: string
        format: date-time
        description: opened_at is when the case was opened.
        readOnly: true
      closedAt:
        type: string
        format: date-time
        description: closed_at is when the case was closed; absent unless status is CLOSED.
        readOnly: true
      closedBy:
        type: string
        description: closed_by is the operator who closed the case; empty unless CLOSED.
      closureReason:
        type: string
        description: closure_reason is the justification given when closing; empty unless CLOSED.
      metadata:
        type: object
        description: metadata holds secondary data about the case.
      createdAt:
        type: string
        format: date-time
        description: created_at is the server creation time.
        readOnly: true
      createdBy:
        type: string
        description: created_by is the operator who created the case.
      updatedAt:
        type: string
        format: date-time
        description: updated_at is the last modification time, maintained by the database.
        readOnly: true
      recordMetadata:
        $ref: '#/definitions/v1RecordMetadata'
        description: record_metadata is the governance record (confidentiality, lock, owner...).
    description: Case is an administrative business file, 1:1 with SubjectRef (id == subject id).
    required:
      - title
  v1CaseStatus:
    type: string
    enum:
      - CASE_STATUS_UNSPECIFIED
      - CASE_STATUS_OPEN
      - CASE_STATUS_IN_PROGRESS
      - CASE_STATUS_SUSPENDED
      - CASE_STATUS_CLOSED
    default: CASE_STATUS_UNSPECIFIED
    description: |-
      CaseStatus is the operational state of a case. ARCHIVED and DISPOSED are
      records-management states handled by the future retention component, not here.

       - CASE_STATUS_UNSPECIFIED: CASE_STATUS_UNSPECIFIED is the zero value; never stored, "any status" in searches.
       - CASE_STATUS_OPEN: CASE_STATUS_OPEN is a newly opened (or reopened) case.
       - CASE_STATUS_IN_PROGRESS: CASE_STATUS_IN_PROGRESS is a case being actively processed.
       - CASE_STATUS_SUSPENDED: CASE_STATUS_SUSPENDED is a case put on hold (e.g. waiting for the requester).
       - CASE_STATUS_CLOSED: CASE_STATUS_CLOSED is an operationally finished case; its metadata can no
      longer be edited until it is reopened.
  v1CaseType:
    type: object
    properties:
      id:
        type: string
        description: id is the catalogue row UUID.
      code:
        type: string
        description: code is the unique stable key (1-100 characters), e.g. OPC_DEMANDE_PC.
      label:
        type: string
        description: label is the human label (at most 200 characters).
      description:
        type: string
        description: description documents the business meaning (at most 2000 characters).
      businessRefNamespace:
        type: string
        description: |-
          business_ref_namespace, when set, makes CreateCase allocate the case's
          business reference in this namespace (e.g. OPC → 2026-000042).
      isActive:
        type: boolean
        description: is_active reports whether the type is offered for new cases.
      defaultConfidentialityLevel:
        type: integer
        format: int32
        description: |-
          default_confidentiality_level is the minimum confidentiality of a new
          case of this type (0-5; from 2 the case needs a grant to be read). A
          creation asking for a lower level gets this one (GLD-050).
      defaultGrants:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1CaseTypeDefaultGrant'
        description: |-
          default_grants are copied once onto every new case of this type, besides
          the creator's FULL_CONTROL and the owning unit's MANAGE (GLD-050); later
          changes of the template leave existing cases unchanged.
    description: |-
      CaseType is a controlled classification of cases (e.g. OPC_DEMANDE_PC).
      Types are seeded reference data; a case's type is fixed at creation.
    required:
      - code
  v1CaseTypeDefaultGrant:
    type: object
    properties:
      granteeKind:
        $ref: '#/definitions/v1GranteeKind'
        description: |-
          grantee_kind is a user, a group, an org unit (with its sub-units) or
          GRANTEE_KIND_CREATOR_UNITS, the units the creator is a direct member of.
      granteeId:
        type: string
        description: |-
          grantee_id is the user id, or the group or org unit subject id; empty for
          GRANTEE_KIND_CREATOR_UNITS.
      granteeLabel:
        type: string
        description: grantee_label is the grantee's display name.
        readOnly: true
      level:
        $ref: '#/definitions/v1Permission'
        description: level is the level given (READ to FULL_CONTROL).
    description: CaseTypeDefaultGrant is one line of a case type's default grants.
  v1Circulation:
    type: object
    properties:
      id:
        type: string
        description: id is the circulation UUID.
      caseId:
        type: string
        description: case_id is the case the circulation belongs to.
      title:
        type: string
        description: title names the circulation (1-500 characters).
      message:
        type: string
        description: message is the request sent to the recipients (at most 4000 characters).
      dueAt:
        type: string
        format: date-time
        description: due_at is the deadline of the answers; absent when none.
      overdue:
        type: boolean
        description: overdue reports an open circulation past its deadline (answers are still accepted).
        readOnly: true
      status:
        $ref: '#/definitions/v1CirculationStatus'
        description: status is the lifecycle state.
      currentStep:
        type: integer
        format: int32
        description: current_step is the open step (the last one once completed).
      stepCount:
        type: integer
        format: int32
        description: step_count is the number of steps.
      createdAt:
        type: string
        format: date-time
        description: created_at is the creation time.
        readOnly: true
      createdBy:
        type: string
        description: created_by is the operator who sent the circulation.
      completedAt:
        type: string
        format: date-time
        description: completed_at is set once every recipient answered.
        readOnly: true
      cancelledAt:
        type: string
        format: date-time
        description: cancelled_at is set when the circulation was cancelled.
        readOnly: true
      cancelledBy:
        type: string
        description: cancelled_by is the operator who cancelled it.
      cancellationReason:
        type: string
        description: cancellation_reason is the justification of the cancellation.
      recipients:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1CirculationRecipient'
        description: recipients are the recipients by step then label.
    description: Circulation sends a case to recipients for their answer.
  v1CirculationRecipient:
    type: object
    properties:
      id:
        type: string
        description: id is the recipient UUID (the target of RespondToCirculation).
      step:
        type: integer
        format: int32
        description: step is the recipient's step (1 first); recipients of a step answer in parallel.
      assigneeUserId:
        type: string
        description: assignee_user_id is the internal user; empty when a unit is the recipient.
      assigneeOrgUnitId:
        type: string
        description: assignee_org_unit_id is the org unit; empty when a user is the recipient.
      assigneeLabel:
        type: string
        description: assignee_label is the recipient's display name.
        readOnly: true
      taskId:
        type: string
        description: task_id is the recipient's task; empty until its step opens.
      taskStatus:
        $ref: '#/definitions/v1TaskStatus'
        description: task_status is the status of the recipient's task, when it exists.
        readOnly: true
      awaiting:
        type: boolean
        description: awaiting reports a recipient whose step is open and who has not answered.
        readOnly: true
      response:
        $ref: '#/definitions/v1CirculationResponse'
        description: response is the answer; UNSPECIFIED until given.
      responseText:
        type: string
        description: response_text is the text of the answer.
      respondedAt:
        type: string
        format: date-time
        description: responded_at is when the answer was recorded.
        readOnly: true
      respondedBy:
        type: string
        description: responded_by is the operator who recorded the answer.
      responseEntryId:
        type: string
        description: response_entry_id is the RESPONSE timeline entry of the answer.
    description: CirculationRecipient is one recipient of a circulation and its answer.
  v1CirculationRecipientInput:
    type: object
    properties:
      step:
        type: integer
        format: int32
        description: |-
          step is the recipient's step (1 or more); 0 means 1. Steps are renumbered
          from 1 in their order, so 1, 3, 3 becomes 1, 2, 2.
      assigneeUserId:
        type: string
        description: assignee_user_id is an internal user (operator id); exclusive with assignee_org_unit_id.
      assigneeOrgUnitId:
        type: string
        description: assignee_org_unit_id is a live org unit; exclusive with assignee_user_id.
    description: 'CirculationRecipientInput is a recipient of a new circulation: one user or one unit.'
  v1CirculationResponse:
    type: string
    enum:
      - CIRCULATION_RESPONSE_UNSPECIFIED
      - CIRCULATION_RESPONSE_FAVORABLE
      - CIRCULATION_RESPONSE_UNFAVORABLE
      - CIRCULATION_RESPONSE_COMMENT
      - CIRCULATION_RESPONSE_NOT_CONCERNED
      - CIRCULATION_RESPONSE_NEED_MORE_INFO
    default: CIRCULATION_RESPONSE_UNSPECIFIED
    description: |-
      CirculationResponse is the answer of a recipient (v2 §29).

       - CIRCULATION_RESPONSE_UNSPECIFIED: CIRCULATION_RESPONSE_UNSPECIFIED is the zero value: not answered yet.
       - CIRCULATION_RESPONSE_FAVORABLE: CIRCULATION_RESPONSE_FAVORABLE is a favourable opinion.
       - CIRCULATION_RESPONSE_UNFAVORABLE: CIRCULATION_RESPONSE_UNFAVORABLE is an unfavourable opinion.
       - CIRCULATION_RESPONSE_COMMENT: CIRCULATION_RESPONSE_COMMENT is a remark without an opinion.
       - CIRCULATION_RESPONSE_NOT_CONCERNED: CIRCULATION_RESPONSE_NOT_CONCERNED means the recipient is not concerned.
       - CIRCULATION_RESPONSE_NEED_MORE_INFO: CIRCULATION_RESPONSE_NEED_MORE_INFO asks for more information.
  v1CirculationStatus:
    type: string
    enum:
      - CIRCULATION_STATUS_UNSPECIFIED
      - CIRCULATION_STATUS_OPEN
      - CIRCULATION_STATUS_COMPLETED
      - CIRCULATION_STATUS_CANCELLED
    default: CIRCULATION_STATUS_UNSPECIFIED
    description: |-
      CirculationStatus is the lifecycle state of a circulation.

       - CIRCULATION_STATUS_UNSPECIFIED: CIRCULATION_STATUS_UNSPECIFIED is the zero value; never stored.
       - CIRCULATION_STATUS_OPEN: CIRCULATION_STATUS_OPEN is a circulation waiting for responses.
       - CIRCULATION_STATUS_COMPLETED: CIRCULATION_STATUS_COMPLETED is a circulation every recipient answered.
       - CIRCULATION_STATUS_CANCELLED: CIRCULATION_STATUS_CANCELLED is a circulation stopped with a reason.
  v1CompleteTaskResponse:
    type: object
    properties:
      task:
        $ref: '#/definitions/v1Task'
        description: task is the task, DONE.
      statusEvent:
        $ref: '#/definitions/v1AuditEvent'
        description: status_event is the TASK_COMPLETED audit event.
    description: CompleteTaskResponse returns the completed task.
  v1ContactType:
    type: string
    enum:
      - CONTACT_TYPE_UNSPECIFIED
      - CONTACT_TYPE_PHONE
      - CONTACT_TYPE_PHONE_PRIVATE
      - CONTACT_TYPE_PHONE_PRO
      - CONTACT_TYPE_MOBILE
      - CONTACT_TYPE_FAX
      - CONTACT_TYPE_EMAIL
      - CONTACT_TYPE_WEBSITE
      - CONTACT_TYPE_POSTAL_BOX
      - CONTACT_TYPE_IDE_FEDERAL
      - CONTACT_TYPE_VAT_NUMBER
      - CONTACT_TYPE_ABACUS_DEBTOR
      - CONTACT_TYPE_COMMERCIAL_REGISTER
      - CONTACT_TYPE_OTHER
    default: CONTACT_TYPE_UNSPECIFIED
    description: |-
      ContactType is the controlled vocabulary for the typed contact / identity bag
      (production DicoActeurTypeComplement). Values split into contact channels and
      probative business identifiers; the latter stay first-class so they are
      queryable (an actor is often located by IDE / VAT / ABACUS debtor number).

       - CONTACT_TYPE_UNSPECIFIED: CONTACT_TYPE_UNSPECIFIED is the zero value; rejected on input.
       - CONTACT_TYPE_PHONE: CONTACT_TYPE_PHONE is a general phone number (channel).
       - CONTACT_TYPE_PHONE_PRIVATE: CONTACT_TYPE_PHONE_PRIVATE is a private phone number (channel).
       - CONTACT_TYPE_PHONE_PRO: CONTACT_TYPE_PHONE_PRO is a professional phone number (channel).
       - CONTACT_TYPE_MOBILE: CONTACT_TYPE_MOBILE is a mobile phone number (channel).
       - CONTACT_TYPE_FAX: CONTACT_TYPE_FAX is a fax number (channel).
       - CONTACT_TYPE_EMAIL: CONTACT_TYPE_EMAIL is an e-mail address (channel).
       - CONTACT_TYPE_WEBSITE: CONTACT_TYPE_WEBSITE is a website URL (channel).
       - CONTACT_TYPE_POSTAL_BOX: CONTACT_TYPE_POSTAL_BOX is a postal box / case postale (channel).
       - CONTACT_TYPE_IDE_FEDERAL: CONTACT_TYPE_IDE_FEDERAL is the federal IDE / UID business identifier (CHE-###.###.###).
       - CONTACT_TYPE_VAT_NUMBER: CONTACT_TYPE_VAT_NUMBER is a VAT (TVA) number.
       - CONTACT_TYPE_ABACUS_DEBTOR: CONTACT_TYPE_ABACUS_DEBTOR is the ABACUS accounting debtor number.
       - CONTACT_TYPE_COMMERCIAL_REGISTER: CONTACT_TYPE_COMMERCIAL_REGISTER is a commercial register (registre du commerce) link.
       - CONTACT_TYPE_OTHER: CONTACT_TYPE_OTHER is any other channel; label should describe it.
  v1ContentBlob:
    type: object
    properties:
      id:
        type: string
        description: id is the blob UUID returned by the upload endpoint.
      sha256:
        type: string
        description: sha256 is the lower-case hex digest computed by the server; unique.
      storageRef:
        type: string
        description: |-
          storage_ref is the URI of the bytes (internal://...); empty when the bytes
          are held by an external system and only the digest is known.
      mimeType:
        type: string
        description: mime_type is the media type of the bytes; empty when unknown.
      fileSizeBytes:
        type: string
        format: int64
        description: file_size_bytes is the size of the bytes. Serialized as a JSON string (int64).
      createdAt:
        type: string
        format: date-time
        description: created_at is when the content was first stored.
        readOnly: true
      createdBy:
        type: string
        description: created_by is the operator whose upload first stored the content.
      verifiedAt:
        type: string
        format: date-time
        description: verified_at is the last probative re-verification of the bytes; currently never set (GLD-021).
        readOnly: true
    description: |-
      ContentBlob is binary content identified by its SHA-256; identical bytes are
      stored once and may back several versions (spec v2 §17, §19).
  v1CreateActorRequest:
    type: object
    properties:
      actorKind:
        $ref: '#/definitions/v1ActorKind'
        description: actor_kind is the required kind; UNSPECIFIED is rejected.
      displayName:
        type: string
        description: |-
          display_name is the usual name (at most 200 characters, trimmed); required
          except for a person, where an empty value is derived as "<first> <last>".
      publicationCode:
        type: integer
        format: int32
        description: publication_code is the opaque legacy publication code.
      person:
        $ref: '#/definitions/v1PersonDetails'
        description: person carries the PERSON fields.
      organization:
        $ref: '#/definitions/v1OrganizationDetails'
        description: organization carries the ORGANIZATION fields.
      contacts:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1ActorContact'
        description: contacts are the initial typed contacts.
      initialGovernance:
        $ref: '#/definitions/v1RecordMetadata'
        description: |-
          initial_governance optionally sets the owner, confidentiality and records
          fields; the owner defaults to the operator.

          NOTE: the acting operator is derived server-side from the authenticated
          principal (never trusted from the client).
      addresses:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1ActorAddress'
        description: addresses are the initial postal addresses (at most 20).
    description: |-
      CreateActorRequest registers an actor. SubjectRef + RecordMetadata are created
      via Core internally. The kind-specific block must match actor_kind.
  v1CreateActorResponse:
    type: object
    properties:
      actor:
        $ref: '#/definitions/v1Actor'
        description: actor is the created actor with its contacts and governance.
      createdEvent:
        $ref: '#/definitions/v1AuditEvent'
        description: created_event is the ACTOR_CREATED audit event.
    description: CreateActorResponse returns the created actor.
  v1CreateCaseRequest:
    type: object
    properties:
      caseTypeCode:
        type: string
        description: case_type_code is the required code of an active case type.
      title:
        type: string
        description: title is the required title (1-500 characters); surrounding whitespace is trimmed.
      description:
        type: string
        description: description is optional free text (at most 4000 characters).
      metadata:
        type: object
        description: metadata holds secondary data about the case.
      businessRef:
        $ref: '#/definitions/v1BusinessRefRequest'
        description: |-
          business_ref overrides the reference: absent means "allocate in the case
          type's namespace when it has one, otherwise none".
      initialGovernance:
        $ref: '#/definitions/v1RecordMetadata'
        description: |-
          initial_governance optionally sets the owner, confidentiality and records
          fields; the owner defaults to the operator.

          NOTE: the acting operator is derived server-side from the authenticated
          principal (never trusted from the client).
    description: |-
      CreateCaseRequest opens a new case. SubjectRef + RecordMetadata are created
      via Core internally, in the same transaction.
    required:
      - caseTypeCode
      - title
  v1CreateCaseResponse:
    type: object
    properties:
      case:
        $ref: '#/definitions/v1Case'
        description: case is the opened case (status OPEN) with its governance.
      createdEvent:
        $ref: '#/definitions/v1AuditEvent'
        description: created_event is the CASE_CREATED audit event.
    description: CreateCaseResponse returns the opened case.
  v1CreateCaseTypeRequest:
    type: object
    properties:
      code:
        type: string
        description: |-
          code is the immutable key: upper-case letters, digits and underscores
          (2-100), starting with a letter, e.g. OPC_DEMANDE_PC; ALREADY_EXISTS when taken.
      label:
        type: string
        description: label is the required human label (1-200 characters).
      description:
        type: string
        description: description documents the business meaning (at most 2000 characters).
      businessRefNamespace:
        type: string
        description: |-
          business_ref_namespace is the namespace in which cases of this type get
          their reference (empty: none allocated), e.g. OPC.
      reason:
        type: string
        description: reason is the justification recorded in the reference change log (at most 2000 characters).
      defaultConfidentialityLevel:
        type: integer
        format: int32
        description: default_confidentiality_level is the minimum confidentiality of its new cases (0-5).
    description: CreateCaseTypeRequest adds a case type (administrators only).
    required:
      - code
      - label
  v1CreateCaseTypeResponse:
    type: object
    properties:
      caseType:
        $ref: '#/definitions/v1CaseType'
        description: case_type is the created entry, active.
      change:
        $ref: '#/definitions/v1ReferenceChange'
        description: change is the REFERENCE_CREATED entry of the reference change log.
    description: CreateCaseTypeResponse returns the new case type and its log entry.
  v1CreateCirculationResponse:
    type: object
    properties:
      circulation:
        $ref: '#/definitions/v1Circulation'
        description: circulation is the created circulation, its first step open.
      createdEvent:
        $ref: '#/definitions/v1AuditEvent'
        description: created_event is the CIRCULATION_CREATED audit event (on the case subject).
    description: CreateCirculationResponse returns the new circulation.
  v1CreateDocumentRequest:
    type: object
    properties:
      documentTypeCode:
        type: string
        description: document_type_code is the required code of an existing document type.
      title:
        type: string
        description: title is the required title (1-500 characters); surrounding whitespace is trimmed.
      description:
        type: string
        description: description is optional free text (at most 4000 characters).
      officialDate:
        type: string
        description: official_date is the optional legal date as YYYY-MM-DD.
      externalSystem:
        type: string
        description: external_system names the external system of record, if any.
      externalId:
        type: string
        description: external_id identifies the document inside external_system.
      externalUrl:
        type: string
        description: external_url links to the external document; it becomes the subject's canonical URL.
      isFinal:
        type: boolean
        description: is_final creates version 1 already final (document status FINAL).
      isRecord:
        type: boolean
        description: is_record declares version 1 a record, which also makes it final.
      language:
        type: string
        description: language is the ISO 639 content language.
      pageCount:
        type: integer
        format: int32
        description: page_count is the number of pages of version 1.
      metadata:
        type: object
        description: metadata holds secondary extension data.
      initialGovernance:
        $ref: '#/definitions/v1RecordMetadata'
        description: |-
          initial_governance optionally sets the owner, confidentiality and records
          fields; the owner defaults to the operator.

          NOTE: the acting operator is derived server-side from the authenticated
          principal (never trusted from the client). A document's AUTHOR is a separate,
          external ACTOR subject linked via DOCUMENT_AUTHORED_BY_ACTOR — not this operator.
      linkToCaseId:
        type: string
        description: |-
          link_to_case_id is an optional convenience: link the new (or reused)
          document to this case with CASE_HAS_DOCUMENT in the same transaction.
      contentBlobId:
        type: string
        description: |-
          content_blob_id is the content returned by POST /api/documents/upload;
          empty for a metadata-only document or an external reference. NOT_FOUND
          when unknown.
    description: |-
      CreateDocumentRequest registers a document (metadata first; the bytes are
      uploaded beforehand and referenced by content_blob_id). When the content is
      already held by a live document, that document is reused instead (see
      CreateDocumentResponse.reused).
    required:
      - documentTypeCode
      - title
  v1CreateDocumentResponse:
    type: object
    properties:
      document:
        $ref: '#/definitions/v1Document'
        description: document is the created document, or the reused one when reused is true.
      createdEvent:
        $ref: '#/definitions/v1AuditEvent'
        description: created_event is DOCUMENT_CREATED, or DOCUMENT_REUSED on the existing document.
      initialRelationship:
        $ref: '#/definitions/v1SubjectRelationship'
        description: |-
          initial_relationship is the CASE_HAS_DOCUMENT edge; set only when
          link_to_case_id was provided and the link did not already exist.
      reused:
        type: boolean
        description: |-
          reused is true when the content was already held by a live document, which
          was reused (no new document; the request's title and metadata are ignored).
    description: CreateDocumentResponse returns the created (or reused) document and its side effects.
  v1CreateDocumentTypeRequest:
    type: object
    properties:
      code:
        type: string
        description: |-
          code is the immutable key: upper-case letters, digits and underscores
          (2-100), starting with a letter, e.g. OPC_DEMANDE_PC; ALREADY_EXISTS when taken.
      label:
        type: string
        description: label is the required human label (1-200 characters).
      description:
        type: string
        description: description documents the business meaning (at most 2000 characters).
      category:
        type: string
        description: category groups the type (at most 100 characters), e.g. ENTREE, PLAN, DECISION.
      reason:
        type: string
        description: reason is the justification recorded in the reference change log (at most 2000 characters).
    description: CreateDocumentTypeRequest adds a document type (administrators only).
    required:
      - code
      - label
  v1CreateDocumentTypeResponse:
    type: object
    properties:
      documentType:
        $ref: '#/definitions/v1DocumentType'
        description: document_type is the created entry, active.
      change:
        $ref: '#/definitions/v1ReferenceChange'
        description: change is the REFERENCE_CREATED entry of the reference change log.
    description: CreateDocumentTypeResponse returns the new document type and its log entry.
  v1CreateGroupRequest:
    type: object
    properties:
      name:
        type: string
        description: name is the group's name, unique among live groups.
      description:
        type: string
        description: description tells what the group is for.
    description: CreateGroupRequest creates a security group; its creator gets FULL_CONTROL.
  v1CreateGroupResponse:
    type: object
    properties:
      group:
        $ref: '#/definitions/v1SecurityGroup'
        description: group is the new group.
      auditEvent:
        $ref: '#/definitions/v1AuditEvent'
        description: audit_event is the GROUP_CREATED event.
    description: CreateGroupResponse returns the group and its audit event.
  v1CreateOrgUnitRequest:
    type: object
