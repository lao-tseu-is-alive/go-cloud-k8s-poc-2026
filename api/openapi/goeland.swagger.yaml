    post:
      summary: |-
        Append a new current version to a document (optionally with new content).
        Requires goeland:write; writes a DOCUMENT_VERSION_ADDED audit event;
        FAILED_PRECONDITION when the document is locked or deleted.
      operationId: AddDocumentVersion
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1AddDocumentVersionResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: documentId
          description: document_id is the document; a locked or deleted document is rejected.
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/DocumentServiceAddDocumentVersionBody'
      tags:
        - DocumentService
  /api/documents/{id}:
    get:
      summary: |-
        Retrieve a document with context (outgoing relationships, recent history).
        Requires goeland:read; NOT_FOUND when the document does not exist.
      operationId: GetDocument
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1GetDocumentResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          description: id is the document (subject_ref) UUID.
          in: path
          required: true
          type: string
        - name: includeRelationships
          description: |-
            include_relationships also returns the document's OUTGOING relationships
            (to things, actors, previous versions). CASE_HAS_DOCUMENT edges point into
            the document: list them with CoreService.ListRelationships(outgoing=false).
          in: query
          required: false
          type: boolean
        - name: includeAudit
          description: include_audit also returns the 20 most recent audit events.
          in: query
          required: false
          type: boolean
      tags:
        - DocumentService
    delete:
      summary: |-
        Soft-delete a document (non-destructive) and write an audit event.
        Requires goeland:write.
      operationId: DeleteDocument
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1DeleteDocumentResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          description: |-
            id is the document UUID; an already deleted document is rejected, a
            locked one is not.
          in: path
          required: true
          type: string
        - name: reason
          description: reason is the justification recorded on the audit event (at most 2000 characters).
          in: query
          required: false
          type: string
      tags:
        - DocumentService
    patch:
      summary: |-
        Update mutable metadata only (respects locking).
        Requires goeland:write; FAILED_PRECONDITION when the document is locked or deleted.
      operationId: UpdateDocumentMetadata
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1UpdateDocumentMetadataResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          description: id is the document UUID.
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/DocumentServiceUpdateDocumentMetadataBody'
      tags:
        - DocumentService
  /api/documents/{id}/finalize:
    post:
      summary: |-
