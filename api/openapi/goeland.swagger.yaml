swagger: "2.0"
info:
  title: goeland/v1/core.proto
  version: version not set
tags:
  - name: CoreService
    description: |-
      CoreService exposes the transversal primitives reused by every domain component.
      Every RPC carries a google.api.http annotation so the Vanguard transcoder also
      exposes it as REST/JSON (mapped from spec §13.6 relationships + subject/audit paths).
      The Connect/gRPC path /goeland.v1.CoreService/<Method> remains available too.
  - name: AccessService
    description: |-
      AccessService manages grants and security groups and tells the caller its
      effective level on a subject. Reads need goeland:read, changes goeland:write
      plus the level each RPC names.
  - name: ActorService
    description: |-
      ActorService is the external-party (person / organization) component of the POC.
      Every RPC carries a google.api.http annotation so Vanguard also exposes it as
      REST/JSON; the Connect/gRPC path /goeland.v1.ActorService/<Method> stays available.
  - name: CaseService
    description: |-
      CaseService is the case (affaire) component of the Goéland POC. Every RPC carries a
      google.api.http annotation so Vanguard also exposes it as REST/JSON; the
      Connect/gRPC path /goeland.v1.CaseService/<Method> stays available.
  - name: TaskService
    description: |-
      TaskService manages the tasks of the Goéland POC cases. Every RPC carries a
      google.api.http annotation so Vanguard also exposes it as REST/JSON; the
      Connect/gRPC path /goeland.v1.TaskService/<Method> stays available.
      Mutations fail with FAILED_PRECONDITION when the case is closed, locked or
      deleted, or when the task status does not allow the move.
  - name: CirculationService
    description: |-
      CirculationService manages the circulations of the Goéland POC cases. Every
      RPC carries a google.api.http annotation so Vanguard also exposes it as
      REST/JSON; the Connect/gRPC path /goeland.v1.CirculationService/<Method>
      stays available. Mutations fail with FAILED_PRECONDITION when the case is
      closed, locked or deleted, or when the circulation is no longer open.
  - name: DocumentService
    description: |-
      DocumentService is the modern-GED document component of the Goéland POC.

      Every RPC carries a google.api.http annotation so the Vanguard transcoder also
      exposes it as REST/JSON (and the generated OpenAPI documents that surface).
      REST paths follow the spec (§13.3) with sensible additions for the extra RPCs.
      The Connect/gRPC path /goeland.v1.DocumentService/<Method> remains available too.
  - name: OrgUnitService
    description: |-
      OrgUnitService manages the organizational units of the Goéland POC. Every RPC
      carries a google.api.http annotation so Vanguard also exposes it as
      REST/JSON; the Connect/gRPC path /goeland.v1.OrgUnitService/<Method> stays available.
  - name: ThingService
    description: ThingService manages business objects (parcels, buildings, ...) and their geometry.
  - name: TimelineService
    description: |-
      TimelineService is the case timeline component of the Goéland POC. Every RPC
      carries a google.api.http annotation so Vanguard also exposes it as
      REST/JSON; the Connect/gRPC path /goeland.v1.TimelineService/<Method> stays
      available. Mutations fail with FAILED_PRECONDITION when the case is closed,
      locked or deleted, or when the entry is no longer a draft.
consumes:
  - application/json
produces:
  - application/json
paths:
  /api/actors:
    post:
      summary: |-
        Create a person or organization actor. SubjectRef + RecordMetadata via Core.
        Requires goeland:write; everything, including the ACTOR_CREATED audit event,
        is written in one transaction.
      operationId: CreateActor
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1CreateActorResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: body
          description: |-
            CreateActorRequest registers an actor. SubjectRef + RecordMetadata are created
            via Core internally. The kind-specific block must match actor_kind.
          in: body
          required: true
          schema:
            $ref: '#/definitions/v1CreateActorRequest'
      tags:
        - ActorService
  /api/actors/search:
    get:
      summary: |-
        Accent-insensitive name search + kind / category / status filters.
        Requires goeland:read.
      operationId: SearchActors
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1SearchActorsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: query
          description: |-
            query is plain text matched accent-insensitively against the display and
            legal names (at most 200 characters); empty matches every actor.
          in: query
          required: false
          type: string
        - name: actorKind
          description: |-
            actor_kind restricts results to one kind; UNSPECIFIED means any.

             - ACTOR_KIND_UNSPECIFIED: ACTOR_KIND_UNSPECIFIED is the zero value; rejected on create and means
            "any kind" in searches.
             - ACTOR_KIND_PERSON: ACTOR_KIND_PERSON is a personne physique (IsPhysique = true).
             - ACTOR_KIND_ORGANIZATION: ACTOR_KIND_ORGANIZATION is a personne morale (IsPhysique = false).
          in: query
          required: false
          type: string
          enum:
            - ACTOR_KIND_UNSPECIFIED
            - ACTOR_KIND_PERSON
            - ACTOR_KIND_ORGANIZATION
          default: ACTOR_KIND_UNSPECIFIED
        - name: organizationCategoryCode
          description: |-
            organization_category_code restricts results to one category; empty means
            any, and an unknown code matches nothing.
          in: query
          required: false
          type: string
        - name: onlyActive
          description: only_active restricts results to business-active actors.
          in: query
          required: false
          type: boolean
        - name: includeDeleted
          description: include_deleted also returns soft-deleted actors.
          in: query
          required: false
          type: boolean
        - name: pageSize
          description: page_size is the page length; 0 means the default (25), at most 200.
          in: query
          required: false
          type: integer
          format: int32
        - name: pageToken
          description: page_token is the next_page_token of the previous page; empty for the first page.
          in: query
          required: false
          type: string
      tags:
        - ActorService
  /api/actors/{id}:
    get:
      summary: |-
        Retrieve an actor with optional relationship + audit context.
        Requires goeland:read; NOT_FOUND when the actor does not exist.
      operationId: GetActor
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1GetActorResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          description: id is the actor (subject_ref) UUID.
          in: path
          required: true
          type: string
        - name: includeRelationships
          description: |-
            include_relationships also returns the relationships in both directions:
            incoming roles (CASE_HAS_ACTOR_*, DOCUMENT_*_ACTOR) and actor-to-actor links
            (ACTOR_BRANCH_OF_ACTOR, ACTOR_CONTACT_PERSON_OF_ACTOR).
          in: query
          required: false
          type: boolean
        - name: includeAudit
          description: include_audit also returns the 20 most recent audit events.
          in: query
          required: false
          type: boolean
      tags:
        - ActorService
    delete:
      summary: |-
        Soft-delete an actor (non-destructive) and write an audit event.
        Requires goeland:write.
      operationId: DeleteActor
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1DeleteActorResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          description: id is the actor UUID; an already deleted actor is rejected, a locked one is not.
          in: path
          required: true
          type: string
        - name: reason
          description: reason is the justification recorded on the audit event (at most 2000 characters).
          in: query
          required: false
          type: string
      tags:
        - ActorService
    patch:
      summary: |-
        Update mutable fields (respects locking). Contacts optionally replaced wholesale.
        Requires goeland:write; FAILED_PRECONDITION when the actor is locked or deleted.
      operationId: UpdateActor
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1UpdateActorResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          description: id is the actor UUID; a locked or deleted actor is rejected.
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/ActorServiceUpdateActorBody'
      tags:
        - ActorService
  /api/app-roles:
    get:
      summary: List the application role catalogue. Requires goeland:read.
      operationId: ListAppRoles
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListAppRolesResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      tags:
        - CoreService
  /api/app-roles/{roleCode}/holders:
    get:
      summary: List the users currently holding a role. Requires goeland:read.
      operationId: ListRoleHolders
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListRoleHoldersResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: roleCode
          description: role_code is the role.
          in: path
          required: true
          type: string
      tags:
        - CoreService
  /api/case-types:
    get:
      summary: |-
        List the controlled case types (classification catalogue).
        Requires goeland:read.
      operationId: ListCaseTypes
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListCaseTypesResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: onlyActive
          description: only_active returns only types offered for new cases.
          in: query
          required: false
          type: boolean
      tags:
        - CaseService
    post:
      summary: |-
        Add a case type. Requires goeland:admin; logs REFERENCE_CREATED. Fails with
        ALREADY_EXISTS for a taken code.
      operationId: CreateCaseType
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1CreateCaseTypeResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: body
          description: CreateCaseTypeRequest adds a case type (administrators only).
          in: body
          required: true
          schema:
            $ref: '#/definitions/v1CreateCaseTypeRequest'
      tags:
        - CaseService
  /api/case-types/{code}:
    patch:
      summary: |-
        Change a case type (label, description, activation, ...); the code is
        immutable. Requires goeland:admin; logs REFERENCE_UPDATED. NOT_FOUND for an
        unknown code.
      operationId: UpdateCaseType
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1UpdateCaseTypeResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: code
          description: code selects the entry to update (its code never changes).
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/CaseServiceUpdateCaseTypeBody'
      tags:
        - CaseService
  /api/case-types/{code}/default-grants:
    post:
      summary: |-
        Replace the default grants copied onto new cases of a type (GLD-050).
        Requires goeland:admin; logs REFERENCE_UPDATED. NOT_FOUND for an unknown
        code, INVALID_ARGUMENT for an unknown or inactive grantee or a repeated one.
      operationId: SetCaseTypeDefaultGrants
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1SetCaseTypeDefaultGrantsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: code
          description: code selects the case type.
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/CaseServiceSetCaseTypeDefaultGrantsBody'
      tags:
        - CaseService
  /api/cases:
    post:
      summary: |-
        Open a case. SubjectRef + RecordMetadata via Core, business reference
        allocated in the case type's namespace when it has one.
        Requires goeland:write; writes a CASE_CREATED audit event in the same transaction.
      operationId: CreateCase
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1CreateCaseResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: body
          description: |-
            CreateCaseRequest opens a new case. SubjectRef + RecordMetadata are created
            via Core internally, in the same transaction.
          in: body
          required: true
          schema:
            $ref: '#/definitions/v1CreateCaseRequest'
      tags:
        - CaseService
  /api/cases/search:
    get:
      summary: |-
        Accent-insensitive search by title/description or exact business reference,
        with type / status filters. Requires goeland:read.
      operationId: SearchCases
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1SearchCasesResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: query
          description: |-
            query is plain text matched accent-insensitively against title and
            description, or exactly against the business reference (at most 200
            characters); empty matches every case.
          in: query
          required: false
          type: string
        - name: caseTypeCode
          description: case_type_code restricts results to one type; empty means any.
          in: query
          required: false
          type: string
        - name: status
          description: |-
            status restricts results to one status; UNSPECIFIED means any.

             - CASE_STATUS_UNSPECIFIED: CASE_STATUS_UNSPECIFIED is the zero value; never stored, "any status" in searches.
             - CASE_STATUS_OPEN: CASE_STATUS_OPEN is a newly opened (or reopened) case.
             - CASE_STATUS_IN_PROGRESS: CASE_STATUS_IN_PROGRESS is a case being actively processed.
             - CASE_STATUS_SUSPENDED: CASE_STATUS_SUSPENDED is a case put on hold (e.g. waiting for the requester).
             - CASE_STATUS_CLOSED: CASE_STATUS_CLOSED is an operationally finished case; its metadata can no
            longer be edited until it is reopened.
          in: query
          required: false
          type: string
          enum:
            - CASE_STATUS_UNSPECIFIED
            - CASE_STATUS_OPEN
            - CASE_STATUS_IN_PROGRESS
            - CASE_STATUS_SUSPENDED
            - CASE_STATUS_CLOSED
          default: CASE_STATUS_UNSPECIFIED
        - name: includeDeleted
          description: include_deleted also returns soft-deleted cases.
          in: query
          required: false
          type: boolean
        - name: pageSize
          description: page_size is the page length; 0 means the default (25), at most 200.
          in: query
          required: false
          type: integer
          format: int32
        - name: pageToken
          description: page_token is the next_page_token of the previous page; empty for the first page.
          in: query
          required: false
          type: string
      tags:
        - CaseService
  /api/cases/{caseId}/circulations:
    get:
      summary: List the circulations of a case. Requires goeland:read.
      operationId: ListCaseCirculations
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListCaseCirculationsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: caseId
          description: case_id is the case UUID.
          in: path
          required: true
          type: string
      tags:
        - CirculationService
    post:
      summary: |-
        Send an open case to recipients: the first step's tasks are created at once.
        Requires goeland:write; writes CIRCULATION_CREATED and a SYSTEM timeline entry.
      operationId: CreateCirculation
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1CreateCirculationResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: caseId
          description: case_id is the case UUID.
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/CirculationServiceCreateCirculationBody'
      tags:
        - CirculationService
  /api/cases/{caseId}/tasks:
    get:
      summary: List the tasks of a case. Requires goeland:read.
      operationId: ListCaseTasks
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListCaseTasksResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: caseId
          description: case_id is the case UUID.
          in: path
          required: true
          type: string
        - name: statuses
          description: |-
            statuses restricts the result; empty means every status.

             - TASK_STATUS_UNSPECIFIED: TASK_STATUS_UNSPECIFIED is the zero value; never stored, "any status" in filters.
             - TASK_STATUS_OPEN: TASK_STATUS_OPEN is a task to do.
             - TASK_STATUS_IN_PROGRESS: TASK_STATUS_IN_PROGRESS is a task being worked on.
             - TASK_STATUS_DONE: TASK_STATUS_DONE is a completed task.
             - TASK_STATUS_CANCELLED: TASK_STATUS_CANCELLED is a task that will not be done (with a reason).
          in: query
          required: false
          type: array
          items:
            type: string
            enum:
              - TASK_STATUS_UNSPECIFIED
              - TASK_STATUS_OPEN
              - TASK_STATUS_IN_PROGRESS
              - TASK_STATUS_DONE
              - TASK_STATUS_CANCELLED
          collectionFormat: multi
        - name: pageSize
          description: page_size is the page length; 0 means the default (25), at most 200.
          in: query
          required: false
          type: integer
          format: int32
        - name: pageToken
          description: page_token is the next_page_token of the previous page; empty for the first page.
          in: query
          required: false
          type: string
      tags:
        - TaskService
    post:
      summary: Add a manual task to an open case. Requires goeland:write; writes TASK_CREATED.
      operationId: CreateTask
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1CreateTaskResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: caseId
          description: case_id is the case UUID.
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/TaskServiceCreateTaskBody'
      tags:
        - TaskService
  /api/cases/{caseId}/timeline:
    get:
      summary: |-
        List a case timeline, most recent business date first.
        Requires goeland:read; NOT_FOUND when the case does not exist.
      operationId: ListTimelineEntries
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListTimelineEntriesResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: caseId
          description: case_id is the case UUID.
          in: path
          required: true
          type: string
        - name: entryTypes
          description: |-
            entry_types restricts the result to these types; empty means any type.

             - TIMELINE_ENTRY_TYPE_UNSPECIFIED: TIMELINE_ENTRY_TYPE_UNSPECIFIED is the zero value; never stored, "any type" in filters.
             - TIMELINE_ENTRY_TYPE_COMMENT: TIMELINE_ENTRY_TYPE_COMMENT is a free follow-up note.
             - TIMELINE_ENTRY_TYPE_OPINION: TIMELINE_ENTRY_TYPE_OPINION is an opinion (préavis) given on the case.
             - TIMELINE_ENTRY_TYPE_DECISION: TIMELINE_ENTRY_TYPE_DECISION is a business decision.
             - TIMELINE_ENTRY_TYPE_REQUEST: TIMELINE_ENTRY_TYPE_REQUEST is a request sent or received (e.g. missing documents).
             - TIMELINE_ENTRY_TYPE_RESPONSE: TIMELINE_ENTRY_TYPE_RESPONSE is a response to a request.
             - TIMELINE_ENTRY_TYPE_VALIDATION: TIMELINE_ENTRY_TYPE_VALIDATION records a business validation act.
             - TIMELINE_ENTRY_TYPE_SYSTEM: TIMELINE_ENTRY_TYPE_SYSTEM is a fact written by the server (e.g. a case
            status change); never created through the API, always locked.
             - TIMELINE_ENTRY_TYPE_AI_PROPOSAL: TIMELINE_ENTRY_TYPE_AI_PROPOSAL is a proposal awaiting human validation;
            reserved for the AI component (GLD-030) and rejected until then.
          in: query
          required: false
          type: array
          items:
            type: string
            enum:
              - TIMELINE_ENTRY_TYPE_UNSPECIFIED
              - TIMELINE_ENTRY_TYPE_COMMENT
              - TIMELINE_ENTRY_TYPE_OPINION
              - TIMELINE_ENTRY_TYPE_DECISION
              - TIMELINE_ENTRY_TYPE_REQUEST
              - TIMELINE_ENTRY_TYPE_RESPONSE
              - TIMELINE_ENTRY_TYPE_VALIDATION
              - TIMELINE_ENTRY_TYPE_SYSTEM
              - TIMELINE_ENTRY_TYPE_AI_PROPOSAL
          collectionFormat: multi
        - name: includeWithdrawn
          description: include_withdrawn also returns withdrawn drafts.
          in: query
          required: false
          type: boolean
        - name: pageSize
          description: page_size is the page length; 0 means the default (25), at most 200.
          in: query
          required: false
          type: integer
          format: int32
        - name: pageToken
          description: page_token is the next_page_token of the previous page; empty for the first page.
          in: query
          required: false
          type: string
      tags:
        - TimelineService
    post:
      summary: |-
        Add a draft entry (optionally a correction, optionally citing documents).
        Requires goeland:write; writes TIMELINE_ENTRY_ADDED on the case.
      operationId: CreateTimelineEntry
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1CreateTimelineEntryResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: caseId
          description: case_id is the case UUID.
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/TimelineServiceCreateTimelineEntryBody'
      tags:
        - TimelineService
  /api/cases/{id}:
    get:
      summary: |-
        Retrieve a case with optional relationships (both directions) and audit.
        Requires goeland:read; NOT_FOUND when the case does not exist.
      operationId: GetCase
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1GetCaseResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          description: id is the case (subject_ref) UUID.
          in: path
          required: true
          type: string
        - name: includeRelationships
          description: |-
            include_relationships also returns the case's relationships in BOTH
            directions (actors, documents, things, parent and child cases).
          in: query
          required: false
          type: boolean
        - name: includeAudit
          description: include_audit also returns the 20 most recent audit events.
          in: query
          required: false
          type: boolean
      tags:
        - CaseService
    delete:
      summary: |-
        Soft-delete a case (non-destructive) and write an audit event.
        Requires goeland:write.
      operationId: DeleteCase
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1DeleteCaseResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          description: id is the case UUID; an already deleted case is rejected, a locked one is not.
          in: path
          required: true
          type: string
        - name: reason
          description: reason is the justification recorded on the audit event (at most 2000 characters).
          in: query
          required: false
          type: string
      tags:
        - CaseService
    patch:
      summary: |-
        Replace the editable metadata of a case.
        Requires goeland:write; FAILED_PRECONDITION when the case is closed, locked or deleted.
      operationId: UpdateCase
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1UpdateCaseResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          description: id is the case UUID.
          in: path
          required: true
          type: string
