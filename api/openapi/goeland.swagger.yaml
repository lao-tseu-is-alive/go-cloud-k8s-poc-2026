        $ref: '#/definitions/v1AuditEvent'
        description: dissolve_event is the ORG_UNIT_DISSOLVED audit event.
    description: DissolveOrgUnitResponse returns the dissolved unit.
  v1Document:
    type: object
    properties:
      subjectRef:
        $ref: '#/definitions/v1SubjectRef'
        description: subject_ref is the embedded canonical identity (kind = DOCUMENT); its id is the document id.
      documentType:
        $ref: '#/definitions/v1DocumentType'
        description: document_type is the classification chosen at creation.
      title:
        type: string
        description: title is the document title (1-500 characters), mirrored into the subject label.
      description:
        type: string
        description: description is free text (at most 4000 characters).
      officialDate:
        type: string
        description: |-
          official_date is the legal probative date of the document itself, as
          YYYY-MM-DD; empty when unknown.
      externalSystem:
        type: string
        description: |-
          external_system names the system of record: alfresco, minio, sharepoint
          or goeland-legacy; empty when internal.
      externalId:
        type: string
        description: external_id is the authoritative id in external_system (prevents duplication).
      externalUrl:
        type: string
        description: external_url is a clickable link to the external document, if available.
      language:
        type: string
        description: |-
          language is the ISO 639 content language, e.g. "fr" or "de" (at most 10
          characters); unrelated to the UI locale.
      status:
        $ref: '#/definitions/v1DocumentStatus'
        description: status is the lifecycle state; FINAL when the current version is final.
      metadata:
        type: object
        description: 'metadata holds secondary data: classification, keywords, extracted entities...'
      createdAt:
        type: string
        format: date-time
        description: created_at is the server creation time.
        readOnly: true
      createdBy:
        type: string
        description: created_by is the operator who created the document.
      updatedAt:
        type: string
        format: date-time
        description: updated_at is the last modification time, maintained by the database.
        readOnly: true
      recordMetadata:
        $ref: '#/definitions/v1RecordMetadata'
        description: record_metadata is the governance record (confidentiality, lock, owner...).
      currentVersion:
        $ref: '#/definitions/v1DocumentVersion'
        description: current_version is the explicit current version, with its content.
        readOnly: true
    description: |-
      Document is the logical business document, 1:1 with SubjectRef (id == subject
      id); its content lives in versions. External references (Alfresco node, legacy,
      SharePoint) stay document-level.
    required:
      - title
  v1DocumentStatus:
    type: string
    enum:
      - DOCUMENT_STATUS_UNSPECIFIED
      - DOCUMENT_STATUS_DRAFT
      - DOCUMENT_STATUS_FINAL
      - DOCUMENT_STATUS_SUPERSEDED
      - DOCUMENT_STATUS_ARCHIVED
    default: DOCUMENT_STATUS_UNSPECIFIED
    description: |-
      DocumentStatus is the lifecycle state of a document.

       - DOCUMENT_STATUS_UNSPECIFIED: DOCUMENT_STATUS_UNSPECIFIED is the zero value; never stored.
       - DOCUMENT_STATUS_DRAFT: DOCUMENT_STATUS_DRAFT is the initial, editable state.
       - DOCUMENT_STATUS_FINAL: DOCUMENT_STATUS_FINAL marks a finalized document (is_final = true).
       - DOCUMENT_STATUS_SUPERSEDED: DOCUMENT_STATUS_SUPERSEDED marks a document replaced by a newer version.
       - DOCUMENT_STATUS_ARCHIVED: DOCUMENT_STATUS_ARCHIVED marks a document handed over to archiving.
  v1DocumentType:
    type: object
    properties:
      id:
        type: string
        description: id is the catalogue row UUID.
      code:
        type: string
        description: |-
          code is the unique stable key (1-100 characters), e.g. PLAN,
          INCOMING_LETTER or DECISION.
      label:
        type: string
        description: label is the human label (at most 200 characters).
      description:
        type: string
        description: description documents the business meaning (at most 2000 characters).
      category:
        type: string
        description: |-
          category groups types: ENTREE, SORTIE, PLAN, DECISION, JUSTIFICATIF...;
          empty when uncategorized.
      isActive:
        type: boolean
        description: is_active reports whether the type is offered for new documents.
    description: |-
      DocumentType is a controlled classification (behavior + category).
      Types are seeded reference data; a document's type is fixed at creation.
    required:
      - code
  v1DocumentVersion:
    type: object
    properties:
      id:
        type: string
        description: id is the version UUID.
      documentId:
        type: string
        description: document_id is the owning document.
      versionNo:
        type: integer
        format: int32
        description: version_no numbers the versions of one document from 1, without gaps.
      content:
        $ref: '#/definitions/v1ContentBlob'
        description: |-
          content is the binary content; absent for a metadata-only version or an
          external reference.
      pageCount:
        type: integer
        format: int32
        description: page_count is the number of pages; 0 when unknown.
      isFinal:
        type: boolean
        description: is_final reports a validated, business-final version (then immutable).
      isRecord:
        type: boolean
        description: is_record declares a record for retention / records management; a record is always final.
      validatedAt:
        type: string
        format: date-time
        description: validated_at is when the version became final; absent while mutable.
        readOnly: true
      validatedBy:
        type: string
        description: validated_by is the operator who made the version final.
      metadata:
        type: object
        description: metadata holds secondary data about this version.
      createdAt:
        type: string
        format: date-time
        description: created_at is the server creation time.
        readOnly: true
      createdBy:
        type: string
        description: created_by is the operator who added the version.
    description: |-
      DocumentVersion is a dated, append-only state of a document (spec v2 §18). A
      final or record version is immutable; versions are never deleted.
  v1EndRelationshipResponse:
    type: object
    properties:
      relationship:
        $ref: '#/definitions/v1SubjectRelationship'
        description: relationship is the ended edge, hydrated with both subjects and the type.
      auditEvent:
        $ref: '#/definitions/v1AuditEvent'
        description: audit_event is the RELATIONSHIP_ENDED audit event.
    description: EndRelationshipResponse returns the ended edge and its audit event.
  v1FinalizeDocumentResponse:
    type: object
    properties:
      document:
        $ref: '#/definitions/v1Document'
        description: document is the finalized document.
      finalizeEvent:
        $ref: '#/definitions/v1AuditEvent'
        description: finalize_event is the DOCUMENT_FINALIZED audit event.
    description: FinalizeDocumentResponse returns the finalized document.
  v1GetActorResponse:
    type: object
    properties:
      actor:
        $ref: '#/definitions/v1Actor'
        description: actor is the actor with its contacts and governance.
      relationships:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1SubjectRelationship'
        description: |-
          relationships are the actor's edges in both directions (outgoing first);
          empty unless include_relationships was set.
      recentAudit:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1AuditEvent'
        description: recent_audit holds the latest audit events, newest first; empty unless include_audit was set.
    description: GetActorResponse returns an actor and the requested context.
  v1GetCaseResponse:
    type: object
    properties:
      case:
        $ref: '#/definitions/v1Case'
        description: case is the case with its governance.
      relationships:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1SubjectRelationship'
        description: relationships are the outgoing then incoming edges; empty unless include_relationships was set.
      recentAudit:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1AuditEvent'
        description: recent_audit holds the latest audit events, newest first; empty unless include_audit was set.
    description: GetCaseResponse returns a case and the requested context.
  v1GetCirculationResponse:
    type: object
    properties:
      circulation:
        $ref: '#/definitions/v1Circulation'
        description: circulation is the circulation.
    description: GetCirculationResponse returns the circulation with its recipients.
  v1GetCurrentUserResponse:
    type: object
    properties:
      user:
        $ref: '#/definitions/v1User'
        description: user is the caller as recorded from its token.
      scopes:
        type: array
        items:
          type: string
        description: |-
          scopes are the caller's effective scopes: those of its token, plus
          goeland:admin when the user holds the ADMIN role (never from the token).
    description: GetCurrentUserResponse describes the authenticated caller.
  v1GetDocumentResponse:
    type: object
    properties:
      document:
        $ref: '#/definitions/v1Document'
        description: document is the document with its governance.
      relationships:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1SubjectRelationship'
        description: relationships are the outgoing edges; empty unless include_relationships was set.
      recentAudit:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1AuditEvent'
        description: recent_audit holds the latest audit events, newest first; empty unless include_audit was set.
    description: GetDocumentResponse returns a document and the requested context.
  v1GetGroupResponse:
    type: object
    properties:
      group:
        $ref: '#/definitions/v1SecurityGroup'
        description: group is the group.
      members:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1GroupMember'
        description: members are its current members.
    description: GetGroupResponse returns the group and its current members, by name.
  v1GetMyAccessResponse:
    type: object
    properties:
      access:
        $ref: '#/definitions/v1Access'
        description: access is the caller's effective level.
    description: GetMyAccessResponse returns it.
  v1GetOrgUnitResponse:
    type: object
    properties:
      orgUnit:
        $ref: '#/definitions/v1OrgUnit'
        description: org_unit is the unit.
      ancestors:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1OrgUnitNode'
        description: ancestors are the units above it, from the root down to its parent.
      children:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1OrgUnitNode'
        description: children are the units directly below it (dissolved ones included), by label.
      relationships:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1SubjectRelationship'
        description: relationships are present when requested.
      recentAudit:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1AuditEvent'
        description: recent_audit is present when requested, newest first.
    description: GetOrgUnitResponse returns the unit with its place in the tree.
  v1GetSubjectRefResponse:
    type: object
    properties:
      subjectRef:
        $ref: '#/definitions/v1SubjectRef'
        description: subject_ref is the subject identity.
      metadata:
        $ref: '#/definitions/v1RecordMetadata'
        description: metadata is the governance record; absent unless include_metadata was set.
      recentAudit:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1AuditEvent'
        description: recent_audit holds the latest audit events; empty unless include_audit_summary was set.
    description: GetSubjectRefResponse returns a subject and the requested optional parts.
  v1GetTaskResponse:
    type: object
    properties:
      task:
        $ref: '#/definitions/v1Task'
        description: task is the task.
    description: GetTaskResponse returns the task with its assignment history.
  v1GetThingResponse:
    type: object
    properties:
      thing:
        $ref: '#/definitions/v1Thing'
        description: thing is the thing with its governance.
      relationships:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1SubjectRelationship'
        description: relationships are the outgoing then incoming edges; empty unless include_relationships was set.
      recentAudit:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1AuditEvent'
        description: recent_audit holds the latest audit events, newest first; empty unless include_audit was set.
    description: GetThingResponse returns a thing and the requested context.
  v1GetTimelineEntryResponse:
    type: object
    properties:
      entry:
        $ref: '#/definitions/v1TimelineEntry'
        description: entry is the entry with its documents.
    description: GetTimelineEntryResponse returns the entry.
  v1GrantUserRoleResponse:
    type: object
    properties:
      role:
        $ref: '#/definitions/v1UserRole'
        description: role is the assignment.
      auditEvent:
        $ref: '#/definitions/v1AuditEvent'
        description: audit_event is the USER_ROLE_GRANTED event on the user's subject.
    description: GrantUserRoleResponse returns the new assignment and its audit event.
  v1GranteeKind:
    type: string
    enum:
      - GRANTEE_KIND_UNSPECIFIED
      - GRANTEE_KIND_USER
      - GRANTEE_KIND_GROUP
      - GRANTEE_KIND_ORG_UNIT
      - GRANTEE_KIND_CREATOR_UNITS
    default: GRANTEE_KIND_UNSPECIFIED
    description: |-
      GranteeKind is who a grant is given to.

       - GRANTEE_KIND_UNSPECIFIED: GRANTEE_KIND_UNSPECIFIED is the zero value; rejected.
       - GRANTEE_KIND_USER: GRANTEE_KIND_USER is an internal user (User.id).
       - GRANTEE_KIND_GROUP: GRANTEE_KIND_GROUP is a security group (its subject id).
       - GRANTEE_KIND_ORG_UNIT: GRANTEE_KIND_ORG_UNIT is an org unit and its sub-units (its subject id).
       - GRANTEE_KIND_CREATOR_UNITS: GRANTEE_KIND_CREATOR_UNITS stands, in a case type's default grants only,
      for the units the creator is a direct member of (resolved at creation);
      SetGrant refuses it.
  v1GroupMember:
    type: object
    properties:
      user:
        $ref: '#/definitions/v1User'
        description: user is the member.
      relationshipId:
        type: string
        description: relationship_id is the USER_MEMBER_OF_GROUP relationship.
      since:
        type: string
        format: date-time
        description: since is when the user joined.
      addedBy:
        type: string
        description: added_by is the operator who added the user.
    description: GroupMember is a current member of a group.
  v1LinkDocumentResponse:
    type: object
    properties:
      relationship:
        $ref: '#/definitions/v1SubjectRelationship'
        description: relationship is the created edge.
      auditEvent:
        $ref: '#/definitions/v1AuditEvent'
        description: audit_event is the RELATIONSHIP_LINKED audit event.
    description: LinkDocumentResponse returns the created edge.
  v1LinkSubjectsRequest:
    type: object
    properties:
      sourceSubjectId:
        type: string
        description: source_subject_id is the subject the edge starts from.
      targetSubjectId:
        type: string
        description: target_subject_id is the subject the edge points to.
      relationshipTypeCode:
        type: string
        description: |-
          relationship_type_code selects an active RelationshipType whose kinds must
          match the two subjects (FAILED_PRECONDITION otherwise).
      roleDetail:
        type: string
        description: role_detail optionally qualifies the relation (at most 500 characters).
      validFrom:
        type: string
        format: date-time
        description: valid_from is the optional business start of validity.
    description: LinkSubjectsRequest creates a typed edge between two existing subjects.
    required:
      - relationshipTypeCode
  v1LinkSubjectsResponse:
    type: object
    properties:
      relationship:
        $ref: '#/definitions/v1SubjectRelationship'
        description: relationship is the created edge, hydrated with both subjects and the type.
      auditEvent:
        $ref: '#/definitions/v1AuditEvent'
        description: audit_event is the RELATIONSHIP_LINKED audit event.
    description: LinkSubjectsResponse returns the created edge and its audit event.
  v1LinkTimelineDocumentResponse:
    type: object
    properties:
      entry:
        $ref: '#/definitions/v1TimelineEntry'
        description: entry is the draft with its documents.
      linkEvent:
        $ref: '#/definitions/v1AuditEvent'
        description: link_event is the TIMELINE_DOCUMENT_LINKED audit event.
    description: LinkTimelineDocumentResponse returns the entry with the new link.
  v1ListAppRolesResponse:
    type: object
    properties:
      roles:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1AppRole'
        description: roles are the application roles.
    description: ListAppRolesResponse returns the catalogue, by code.
  v1ListAuditEventsResponse:
    type: object
    properties:
      events:
        type: array
        items:
