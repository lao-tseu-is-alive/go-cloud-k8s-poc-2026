swagger: "2.0"
info:
  title: goeland/v1/core.proto
  version: version not set
tags:
  - name: CoreService
    description: |-
      CoreService exposes the transversal primitives reused by every domain component.
      Every RPC carries a google.api.http annotation so the Vanguard transcoder also
      exposes it as REST/JSON (mapped from spec §13.6 relationships + subject/audit paths).
      The Connect/gRPC path /goeland.v1.CoreService/<Method> remains available too.
  - name: ActorService
    description: |-
      ActorService is the external-party (person / organization) component of the POC.
      Every RPC carries a google.api.http annotation so Vanguard also exposes it as
      REST/JSON; the Connect/gRPC path /goeland.v1.ActorService/<Method> stays available.
  - name: CaseService
    description: |-
      CaseService is the case (affaire) component of the Goéland POC. Every RPC carries a
      google.api.http annotation so Vanguard also exposes it as REST/JSON; the
      Connect/gRPC path /goeland.v1.CaseService/<Method> stays available.
  - name: DocumentService
    description: |-
      DocumentService is the modern-GED document component of the Goéland POC.

      Every RPC carries a google.api.http annotation so the Vanguard transcoder also
      exposes it as REST/JSON (and the generated OpenAPI documents that surface).
      REST paths follow the spec (§13.3) with sensible additions for the extra RPCs.
      The Connect/gRPC path /goeland.v1.DocumentService/<Method> remains available too.
consumes:
  - application/json
produces:
  - application/json
paths:
  /api/actors:
    post:
      summary: |-
        Create a person or organization actor. SubjectRef + RecordMetadata via Core.
        Requires goeland:write; everything, including the ACTOR_CREATED audit event,
        is written in one transaction.
      operationId: CreateActor
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1CreateActorResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: body
          description: |-
            CreateActorRequest registers an actor. SubjectRef + RecordMetadata are created
            via Core internally. The kind-specific block must match actor_kind.
          in: body
          required: true
          schema:
            $ref: '#/definitions/v1CreateActorRequest'
      tags:
        - ActorService
  /api/actors/search:
    get:
      summary: |-
        Accent-insensitive name search + kind / category / status filters.
        Requires goeland:read.
      operationId: SearchActors
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1SearchActorsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: query
          description: |-
            query is plain text matched accent-insensitively against the display and
            legal names (at most 200 characters); empty matches every actor.
          in: query
          required: false
          type: string
        - name: actorKind
          description: |-
            actor_kind restricts results to one kind; UNSPECIFIED means any.

             - ACTOR_KIND_UNSPECIFIED: ACTOR_KIND_UNSPECIFIED is the zero value; rejected on create and means
            "any kind" in searches.
             - ACTOR_KIND_PERSON: ACTOR_KIND_PERSON is a personne physique (IsPhysique = true).
             - ACTOR_KIND_ORGANIZATION: ACTOR_KIND_ORGANIZATION is a personne morale (IsPhysique = false).
          in: query
          required: false
          type: string
          enum:
            - ACTOR_KIND_UNSPECIFIED
            - ACTOR_KIND_PERSON
            - ACTOR_KIND_ORGANIZATION
          default: ACTOR_KIND_UNSPECIFIED
        - name: organizationCategoryCode
          description: |-
            organization_category_code restricts results to one category; empty means
            any, and an unknown code matches nothing.
          in: query
          required: false
          type: string
        - name: onlyActive
          description: only_active restricts results to business-active actors.
          in: query
          required: false
          type: boolean
        - name: includeDeleted
          description: include_deleted also returns soft-deleted actors.
          in: query
          required: false
          type: boolean
        - name: pageSize
          description: page_size is the page length; 0 means the default (25), at most 200.
          in: query
          required: false
          type: integer
          format: int32
        - name: pageToken
          description: page_token is the next_page_token of the previous page; empty for the first page.
          in: query
          required: false
          type: string
      tags:
        - ActorService
  /api/actors/{id}:
    get:
      summary: |-
        Retrieve an actor with optional relationship + audit context.
        Requires goeland:read; NOT_FOUND when the actor does not exist.
      operationId: GetActor
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1GetActorResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          description: id is the actor (subject_ref) UUID.
          in: path
          required: true
          type: string
        - name: includeRelationships
          description: |-
            include_relationships also returns the INCOMING relationships (actors are
            the target of CASE_HAS_ACTOR_* and DOCUMENT_*_ACTOR edges).
          in: query
          required: false
          type: boolean
        - name: includeAudit
          description: include_audit also returns the 20 most recent audit events.
          in: query
          required: false
          type: boolean
      tags:
        - ActorService
    delete:
      summary: |-
        Soft-delete an actor (non-destructive) and write an audit event.
        Requires goeland:write.
      operationId: DeleteActor
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1DeleteActorResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          description: id is the actor UUID; an already deleted actor is rejected, a locked one is not.
          in: path
          required: true
          type: string
        - name: reason
          description: reason is the justification recorded on the audit event (at most 2000 characters).
          in: query
          required: false
          type: string
      tags:
        - ActorService
    patch:
      summary: |-
        Update mutable fields (respects locking). Contacts optionally replaced wholesale.
        Requires goeland:write; FAILED_PRECONDITION when the actor is locked or deleted.
      operationId: UpdateActor
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1UpdateActorResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          description: id is the actor UUID; a locked or deleted actor is rejected.
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/ActorServiceUpdateActorBody'
      tags:
        - ActorService
  /api/case-types:
    get:
      summary: |-
        List the controlled case types (classification catalogue).
        Requires goeland:read.
      operationId: ListCaseTypes
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListCaseTypesResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: onlyActive
          description: only_active returns only types offered for new cases.
          in: query
          required: false
          type: boolean
      tags:
        - CaseService
  /api/cases:
    post:
      summary: |-
        Open a case. SubjectRef + RecordMetadata via Core, business reference
        allocated in the case type's namespace when it has one.
        Requires goeland:write; writes a CASE_CREATED audit event in the same transaction.
      operationId: CreateCase
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1CreateCaseResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: body
          description: |-
            CreateCaseRequest opens a new case. SubjectRef + RecordMetadata are created
            via Core internally, in the same transaction.
          in: body
          required: true
          schema:
            $ref: '#/definitions/v1CreateCaseRequest'
      tags:
        - CaseService
  /api/cases/search:
    get:
      summary: |-
        Accent-insensitive search by title/description or exact business reference,
        with type / status filters. Requires goeland:read.
      operationId: SearchCases
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1SearchCasesResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: query
          description: |-
            query is plain text matched accent-insensitively against title and
            description, or exactly against the business reference (at most 200
            characters); empty matches every case.
          in: query
          required: false
          type: string
        - name: caseTypeCode
          description: case_type_code restricts results to one type; empty means any.
          in: query
          required: false
          type: string
        - name: status
          description: |-
            status restricts results to one status; UNSPECIFIED means any.

             - CASE_STATUS_UNSPECIFIED: CASE_STATUS_UNSPECIFIED is the zero value; never stored, "any status" in searches.
             - CASE_STATUS_OPEN: CASE_STATUS_OPEN is a newly opened (or reopened) case.
             - CASE_STATUS_IN_PROGRESS: CASE_STATUS_IN_PROGRESS is a case being actively processed.
             - CASE_STATUS_SUSPENDED: CASE_STATUS_SUSPENDED is a case put on hold (e.g. waiting for the requester).
             - CASE_STATUS_CLOSED: CASE_STATUS_CLOSED is an operationally finished case; its metadata can no
            longer be edited until it is reopened.
          in: query
          required: false
          type: string
          enum:
            - CASE_STATUS_UNSPECIFIED
            - CASE_STATUS_OPEN
            - CASE_STATUS_IN_PROGRESS
            - CASE_STATUS_SUSPENDED
            - CASE_STATUS_CLOSED
          default: CASE_STATUS_UNSPECIFIED
        - name: includeDeleted
          description: include_deleted also returns soft-deleted cases.
          in: query
          required: false
          type: boolean
        - name: pageSize
          description: page_size is the page length; 0 means the default (25), at most 200.
          in: query
          required: false
          type: integer
          format: int32
        - name: pageToken
          description: page_token is the next_page_token of the previous page; empty for the first page.
          in: query
          required: false
          type: string
      tags:
        - CaseService
  /api/cases/{id}:
    get:
      summary: |-
        Retrieve a case with optional relationships (both directions) and audit.
        Requires goeland:read; NOT_FOUND when the case does not exist.
      operationId: GetCase
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1GetCaseResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          description: id is the case (subject_ref) UUID.
          in: path
          required: true
          type: string
        - name: includeRelationships
          description: |-
            include_relationships also returns the case's relationships in BOTH
            directions (actors, documents, things, parent and child cases).
          in: query
          required: false
          type: boolean
        - name: includeAudit
          description: include_audit also returns the 20 most recent audit events.
          in: query
          required: false
          type: boolean
      tags:
        - CaseService
    delete:
      summary: |-
        Soft-delete a case (non-destructive) and write an audit event.
        Requires goeland:write.
      operationId: DeleteCase
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1DeleteCaseResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          description: id is the case UUID; an already deleted case is rejected, a locked one is not.
          in: path
          required: true
          type: string
        - name: reason
          description: reason is the justification recorded on the audit event (at most 2000 characters).
          in: query
          required: false
          type: string
      tags:
        - CaseService
    patch:
      summary: |-
        Replace the editable metadata of a case.
        Requires goeland:write; FAILED_PRECONDITION when the case is closed, locked or deleted.
      operationId: UpdateCase
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1UpdateCaseResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          description: id is the case UUID.
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/CaseServiceUpdateCaseBody'
      tags:
        - CaseService
  /api/cases/{id}/transition:
    post:
      summary: |-
        Move a case to another status (see TransitionCaseRequest for the allowed moves).
        Requires goeland:write; writes a CASE_STATUS_CHANGED audit event.
      operationId: TransitionCase
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1TransitionCaseResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          description: id is the case UUID; a locked or deleted case is rejected.
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/CaseServiceTransitionCaseBody'
      tags:
        - CaseService
  /api/document-types:
    get:
      summary: |-
        List the controlled document types (classification catalogue).
        Requires goeland:read.
      operationId: ListDocumentTypes
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListDocumentTypesResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: onlyActive
          description: only_active returns only types offered for new documents.
          in: query
          required: false
          type: boolean
      tags:
        - DocumentService
  /api/documents:
    post:
      summary: |-
        Create / register document metadata. SubjectRef + RecordMetadata are created via Core internally.
        Requires goeland:write; subject, governance, document, version 1, optional
        links and the DOCUMENT_CREATED audit event are written in one transaction.
        Content already held by a live document reuses it (DOCUMENT_REUSED, reused = true).
      operationId: CreateDocument
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1CreateDocumentResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: body
          description: |-
            CreateDocumentRequest registers a document (metadata first; the bytes are
            uploaded beforehand and referenced by content_blob_id). When the content is
            already held by a live document, that document is reused instead (see
            CreateDocumentResponse.reused).
          in: body
          required: true
          schema:
            $ref: '#/definitions/v1CreateDocumentRequest'
      tags:
        - DocumentService
  /api/documents/search:
    get:
      summary: |-
        Full-text + filtered search (leverages the generated tsvector + GIN index).
        Requires goeland:read.
      operationId: SearchDocuments
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1SearchDocumentsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: query
          description: |-
            query is plain text matched accent-insensitively against title and
            description (at most 500 characters); empty matches every document.
          in: query
          required: false
          type: string
        - name: documentTypeCode
          description: document_type_code restricts results to one type; empty means any.
          in: query
          required: false
          type: string
        - name: caseId
          description: case_id restricts results to documents linked from that case by CASE_HAS_DOCUMENT.
          in: query
          required: false
          type: string
        - name: thingId
          description: thing_id restricts results to documents with an outgoing link to that thing.
          in: query
          required: false
          type: string
        - name: confidentialityMax
          description: |-
            confidentiality_max is the inclusive upper bound on the confidentiality
            level; 0 means no cap.
          in: query
          required: false
          type: integer
          format: int32
        - name: onlyRecords
          description: only_records restricts results to declared records.
          in: query
          required: false
          type: boolean
        - name: onlyFinal
          description: only_final restricts results to finalized documents.
          in: query
          required: false
          type: boolean
        - name: includeDeleted
          description: include_deleted also returns soft-deleted documents.
          in: query
          required: false
          type: boolean
        - name: pageSize
          description: page_size is the page length; 0 means the default (25), at most 200.
          in: query
          required: false
          type: integer
          format: int32
        - name: pageToken
          description: page_token is the next_page_token of the previous page; empty for the first page.
          in: query
          required: false
          type: string
      tags:
        - DocumentService
  /api/documents/{documentId}/links:
    post:
      summary: |-
        Convenience wrapper around Core.LinkSubjects for document-centric use.
        Requires goeland:write; same errors as CoreService.LinkSubjects.
      operationId: LinkDocument
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1LinkDocumentResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: documentId
          description: document_id is the document, used as the source of the edge.
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/DocumentServiceLinkDocumentBody'
      tags:
        - DocumentService
  /api/documents/{documentId}/versions:
    get:
      summary: List the versions of a document, newest first. Requires goeland:read.
      operationId: ListDocumentVersions
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListDocumentVersionsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: documentId
          description: document_id is the document; NOT_FOUND when unknown.
          in: path
          required: true
          type: string
      tags:
        - DocumentService
    post:
      summary: |-
        Append a new current version to a document (optionally with new content).
        Requires goeland:write; writes a DOCUMENT_VERSION_ADDED audit event;
        FAILED_PRECONDITION when the document is locked or deleted.
      operationId: AddDocumentVersion
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1AddDocumentVersionResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: documentId
          description: document_id is the document; a locked or deleted document is rejected.
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/DocumentServiceAddDocumentVersionBody'
      tags:
        - DocumentService
  /api/documents/{id}:
    get:
      summary: |-
        Retrieve a document with context (outgoing relationships, recent history).
        Requires goeland:read; NOT_FOUND when the document does not exist.
      operationId: GetDocument
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1GetDocumentResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          description: id is the document (subject_ref) UUID.
          in: path
          required: true
          type: string
        - name: includeRelationships
          description: |-
            include_relationships also returns the document's OUTGOING relationships
            (to things, actors, previous versions). CASE_HAS_DOCUMENT edges point into
            the document: list them with CoreService.ListRelationships(outgoing=false).
          in: query
          required: false
          type: boolean
        - name: includeAudit
          description: include_audit also returns the 20 most recent audit events.
          in: query
          required: false
          type: boolean
      tags:
        - DocumentService
    delete:
      summary: |-
        Soft-delete a document (non-destructive) and write an audit event.
        Requires goeland:write.
      operationId: DeleteDocument
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1DeleteDocumentResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          description: |-
            id is the document UUID; an already deleted document is rejected, a
            locked one is not.
          in: path
          required: true
          type: string
        - name: reason
          description: reason is the justification recorded on the audit event (at most 2000 characters).
          in: query
          required: false
          type: string
      tags:
        - DocumentService
    patch:
      summary: |-
        Update mutable metadata only (respects locking).
        Requires goeland:write; FAILED_PRECONDITION when the document is locked or deleted.
      operationId: UpdateDocumentMetadata
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1UpdateDocumentMetadataResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          description: id is the document UUID.
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/DocumentServiceUpdateDocumentMetadataBody'
      tags:
        - DocumentService
  /api/documents/{id}/finalize:
    post:
      summary: |-
        Business finalization + optional governance lock. Critical for probative documents.
        Requires goeland:write; FAILED_PRECONDITION when the document is locked or deleted.
      operationId: FinalizeDocument
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1FinalizeDocumentResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          description: id is the document UUID; a locked or deleted document is rejected.
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/DocumentServiceFinalizeDocumentBody'
      tags:
        - DocumentService
  /api/documents/{id}/integrity:
    get:
      summary: |-
        Non-mutating, NON-PROBATIVE stored-hash comparison: checks the caller's
        expected sha256 against the registered hash. It does NOT read storage bytes
        and writes nothing (hence read-scoped). Real streamed verification is future work.
      operationId: VerifyDocumentIntegrity
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1VerifyDocumentIntegrityResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          description: id is the document UUID.
          in: path
          required: true
          type: string
        - name: expectedSha256
          description: expected_sha256 is the caller's hex digest; empty never verifies.
          in: query
          required: false
          type: string
      tags:
        - DocumentService
  /api/organization-categories:
    get:
      summary: |-
        List the controlled organization categories (classification catalogue).
        Requires goeland:read.
      operationId: ListOrganizationCategories
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListOrganizationCategoriesResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: onlyActive
          description: only_active returns only categories offered for new organizations.
          in: query
          required: false
          type: boolean
      tags:
        - ActorService
  /api/relationship-types:
    get:
      summary: |-
        List the catalogue of allowed relationship types (optionally filtered).
        Requires goeland:read.
      operationId: ListRelationshipTypes
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListRelationshipTypesResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: onlyActive
          description: only_active returns only types that accept new links.
          in: query
          required: false
          type: boolean
        - name: sourceKind
          description: |-
            source_kind restricts the list to one source kind; UNSPECIFIED means any.

             - SUBJECT_KIND_UNSPECIFIED: SUBJECT_KIND_UNSPECIFIED is the zero value; rejected where a kind is required
            and means "any kind" in filters.
             - SUBJECT_KIND_CASE: SUBJECT_KIND_CASE is an administrative case file (affaire / dossier métier).
             - SUBJECT_KIND_DOCUMENT: SUBJECT_KIND_DOCUMENT is a GED document (DocumentService).
             - SUBJECT_KIND_THING: SUBJECT_KIND_THING is a business or territorial object (parcelle, bâtiment...).
             - SUBJECT_KIND_ACTOR: SUBJECT_KIND_ACTOR is an external person or organization (ActorService);
            never an authenticated operator.
             - SUBJECT_KIND_USER: SUBJECT_KIND_USER is an internal user as a graph subject (future).
             - SUBJECT_KIND_ORG_UNIT: SUBJECT_KIND_ORG_UNIT is an internal organizational unit (future).
          in: query
          required: false
          type: string
          enum:
            - SUBJECT_KIND_UNSPECIFIED
            - SUBJECT_KIND_CASE
            - SUBJECT_KIND_DOCUMENT
            - SUBJECT_KIND_THING
            - SUBJECT_KIND_ACTOR
            - SUBJECT_KIND_USER
            - SUBJECT_KIND_ORG_UNIT
          default: SUBJECT_KIND_UNSPECIFIED
        - name: targetKind
          description: |-
            target_kind restricts the list to one target kind; UNSPECIFIED means any.

             - SUBJECT_KIND_UNSPECIFIED: SUBJECT_KIND_UNSPECIFIED is the zero value; rejected where a kind is required
            and means "any kind" in filters.
             - SUBJECT_KIND_CASE: SUBJECT_KIND_CASE is an administrative case file (affaire / dossier métier).
             - SUBJECT_KIND_DOCUMENT: SUBJECT_KIND_DOCUMENT is a GED document (DocumentService).
             - SUBJECT_KIND_THING: SUBJECT_KIND_THING is a business or territorial object (parcelle, bâtiment...).
             - SUBJECT_KIND_ACTOR: SUBJECT_KIND_ACTOR is an external person or organization (ActorService);
            never an authenticated operator.
             - SUBJECT_KIND_USER: SUBJECT_KIND_USER is an internal user as a graph subject (future).
             - SUBJECT_KIND_ORG_UNIT: SUBJECT_KIND_ORG_UNIT is an internal organizational unit (future).
          in: query
          required: false
          type: string
          enum:
            - SUBJECT_KIND_UNSPECIFIED
            - SUBJECT_KIND_CASE
            - SUBJECT_KIND_DOCUMENT
            - SUBJECT_KIND_THING
            - SUBJECT_KIND_ACTOR
            - SUBJECT_KIND_USER
            - SUBJECT_KIND_ORG_UNIT
          default: SUBJECT_KIND_UNSPECIFIED
      tags:
        - CoreService
  /api/relationships:
    post:
      summary: |-
        Create a typed, validated relationship (enforces kind compatibility + uniqueness of the active link).
        Requires goeland:write; writes a RELATIONSHIP_LINKED audit event. Fails with
        NOT_FOUND (unknown subject or type), FAILED_PRECONDITION (kind mismatch or a
        soft-deleted subject; locked subjects may still be linked) or ALREADY_EXISTS
        (an open edge of the same type already links the two subjects).
      operationId: LinkSubjects
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1LinkSubjectsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: body
          description: LinkSubjectsRequest creates a typed edge between two existing subjects.
          in: body
          required: true
          schema:
            $ref: '#/definitions/v1LinkSubjectsRequest'
      tags:
        - CoreService
  /api/relationships/{relationshipId}:
    delete:
      summary: |-
        Soft-delete an existing relationship (non-destructive) and write an audit event.
        Requires goeland:write; writes a RELATIONSHIP_UNLINKED audit event.
      operationId: UnlinkSubjects
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1UnlinkSubjectsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: relationshipId
          description: relationship_id is the active edge to unlink; NOT_FOUND when unknown or already unlinked.
          in: path
          required: true
          type: string
        - name: reason
          description: reason is the justification recorded on the audit event (at most 2000 characters).
          in: query
          required: false
          type: string
      tags:
        - CoreService
  /api/relationships/{relationshipId}/end:
    post:
      summary: |-
        End an open relationship in the business sense by setting its valid_to; the
        edge stays listed as history and a new open edge of the same type may then be
        created. Distinct from UnlinkSubjects, which removes a mistaken edge.
        Requires goeland:write; writes a RELATIONSHIP_ENDED audit event.
      operationId: EndRelationship
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1EndRelationshipResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: relationshipId
          description: |-
            relationship_id is the open edge to end; NOT_FOUND when unknown or unlinked,
            FAILED_PRECONDITION when it already has an end of validity.
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/CoreServiceEndRelationshipBody'
      tags:
        - CoreService
  /api/subjects:
    post:
      summary: |-
        Create a canonical subject identity + its record_metadata in one transaction.
        Every other create (Document, Case, Thing, Actor) calls this first.
        Requires goeland:write; writes a SUBJECT_CREATED audit event.
      operationId: CreateSubjectRef
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1CreateSubjectRefResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: body
          description: CreateSubjectRefRequest creates a bare subject identity with its governance record.
          in: body
          required: true
          schema:
            $ref: '#/definitions/v1CreateSubjectRefRequest'
      tags:
        - CoreService
  /api/subjects/{id}:
    get:
      summary: |-
        Retrieve a subject with optional governance + audit info.
        Requires goeland:read; NOT_FOUND when the subject does not exist.
      operationId: GetSubjectRef
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1GetSubjectRefResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          description: id is the subject UUID.
          in: path
          required: true
          type: string
        - name: includeMetadata
          description: include_metadata also returns the governance record.
          in: query
          required: false
          type: boolean
        - name: includeAuditSummary
          description: include_audit_summary also returns the most recent audit events (newest first).
          in: query
          required: false
          type: boolean
      tags:
        - CoreService
  /api/subjects/{subjectId}/audit:
    get:
      summary: |-
        Full probative history for compliance / reconstruction.
        Requires goeland:read.
      operationId: ListAuditEvents
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListAuditEventsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: subjectId
          description: subject_id is the subject whose history is listed.
          in: path
          required: true
          type: string
        - name: eventType
          description: event_type restricts the list to one event code; empty means any.
          in: query
          required: false
          type: string
        - name: from
          description: from is the inclusive lower bound on occurred_at; absent means unbounded.
          in: query
          required: false
          type: string
          format: date-time
        - name: to
          description: to is the inclusive upper bound on occurred_at; absent means unbounded.
          in: query
          required: false
          type: string
          format: date-time
        - name: pageSize
          description: page_size is the page length; 0 means the default (25), at most 200.
          in: query
          required: false
          type: integer
          format: int32
        - name: pageToken
          description: page_token is the next_page_token of the previous page; empty for the first page.
          in: query
          required: false
          type: string
      tags:
        - CoreService
  /api/subjects/{subjectId}/business-ref:
    post:
      summary: |-
        Give an existing subject its business reference (explicit or allocated).
        Requires goeland:write; writes a BUSINESS_REF_ASSIGNED audit event. Fails
        with ALREADY_EXISTS when the subject already has a reference or the
        (namespace, value) pair is taken, FAILED_PRECONDITION for a deleted subject.
      operationId: AssignBusinessRef
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1AssignBusinessRefResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: subjectId
          description: subject_id is the subject; a soft-deleted subject is rejected, a locked one is not.
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/CoreServiceAssignBusinessRefBody'
      tags:
        - CoreService
  /api/subjects/{subjectId}/relationships:
    get:
      summary: |-
        List relationships for a subject (graph traversal primitive). Use the `outgoing`
        query parameter to choose direction: /api/subjects/{id}/relationships?outgoing=true.
        Requires goeland:read.
      operationId: ListRelationships
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListRelationshipsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: subjectId
          description: subject_id is the subject whose edges are listed.
          in: path
          required: true
          type: string
        - name: outgoing
          description: outgoing selects edges from this subject when true, and edges into it when false.
          in: query
          required: false
          type: boolean
        - name: relationshipTypeCode
          description: relationship_type_code restricts the list to one type; empty means any.
          in: query
          required: false
          type: string
        - name: pageSize
          description: page_size is the page length; 0 means the default (25), at most 200.
          in: query
          required: false
          type: integer
          format: int32
        - name: pageToken
          description: page_token is the next_page_token of the previous page; empty for the first page.
          in: query
          required: false
          type: string
      tags:
        - CoreService
  /api/subjects:lookup:
    get:
      summary: |-
        Find subjects by exact business reference, optionally by namespace and kind.
        Requires goeland:read.
      operationId: LookupSubjects
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1LookupSubjectsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: businessRef
          description: business_ref is the exact reference to find (1-100 characters).
          in: query
          required: false
          type: string
        - name: namespace
          description: namespace restricts the match to one namespace; empty matches any, including none.
          in: query
          required: false
          type: string
        - name: kind
          description: |-
            kind restricts the match to one subject kind; UNSPECIFIED means any.

             - SUBJECT_KIND_UNSPECIFIED: SUBJECT_KIND_UNSPECIFIED is the zero value; rejected where a kind is required
            and means "any kind" in filters.
             - SUBJECT_KIND_CASE: SUBJECT_KIND_CASE is an administrative case file (affaire / dossier métier).
             - SUBJECT_KIND_DOCUMENT: SUBJECT_KIND_DOCUMENT is a GED document (DocumentService).
             - SUBJECT_KIND_THING: SUBJECT_KIND_THING is a business or territorial object (parcelle, bâtiment...).
             - SUBJECT_KIND_ACTOR: SUBJECT_KIND_ACTOR is an external person or organization (ActorService);
            never an authenticated operator.
             - SUBJECT_KIND_USER: SUBJECT_KIND_USER is an internal user as a graph subject (future).
             - SUBJECT_KIND_ORG_UNIT: SUBJECT_KIND_ORG_UNIT is an internal organizational unit (future).
          in: query
          required: false
          type: string
          enum:
            - SUBJECT_KIND_UNSPECIFIED
            - SUBJECT_KIND_CASE
            - SUBJECT_KIND_DOCUMENT
            - SUBJECT_KIND_THING
            - SUBJECT_KIND_ACTOR
            - SUBJECT_KIND_USER
            - SUBJECT_KIND_ORG_UNIT
          default: SUBJECT_KIND_UNSPECIFIED
      tags:
        - CoreService
definitions:
  ActorServiceUpdateActorBody:
    type: object
    properties:
      displayName:
        type: string
        description: |-
          display_name is the new name (1-200 characters). Validation currently
          requires it on every update, so it is always applied.
      isActive:
        type: boolean
        description: is_active activates or deactivates the actor when present.
      publicationCode:
        type: integer
        format: int32
        description: publication_code replaces the publication code when present.
      person:
        $ref: '#/definitions/v1PersonDetails'
        description: person replaces the PERSON fields.
      organization:
        $ref: '#/definitions/v1OrganizationDetails'
        description: organization replaces the ORGANIZATION fields.
      replaceContacts:
        type: boolean
        description: |-
          replace_contacts, when true, makes contacts the new full set; when false,
          contacts is ignored and the existing ones are kept.
      contacts:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1ActorContact'
        description: contacts is the new contact set, used only with replace_contacts.
      reason:
        type: string
        description: reason is the justification recorded on the audit event (at most 2000 characters).
    description: |-
      UpdateActorRequest updates mutable fields. Blocked if the record is locked.
      contacts, when provided, replace the full set (managed as a whole for simplicity).
  CaseServiceTransitionCaseBody:
    type: object
    properties:
      targetStatus:
        $ref: '#/definitions/v1CaseStatus'
        description: target_status is the requested status; UNSPECIFIED is rejected.
      reason:
        type: string
        description: reason is the justification (at most 2000 characters); required to close or reopen.
    description: |-
      TransitionCaseRequest moves a case to another status. Allowed transitions:
      OPEN → IN_PROGRESS | SUSPENDED | CLOSED; IN_PROGRESS → OPEN | SUSPENDED |
      CLOSED; SUSPENDED → OPEN | IN_PROGRESS | CLOSED; CLOSED → OPEN (reopen).
      Closing and reopening require a reason. Anything else is FAILED_PRECONDITION.
  CaseServiceUpdateCaseBody:
    type: object
    properties:
      title:
        type: string
        description: title is the new required title (1-500 characters).
      description:
        type: string
        description: description replaces the description (at most 4000 characters).
      metadata:
        type: object
        description: metadata replaces the whole extension map.
      reason:
        type: string
        description: reason is the justification recorded on the audit event (at most 2000 characters).
    description: |-
      UpdateCaseRequest replaces the editable metadata of a case (no partial merge).
      A closed, locked or deleted case is rejected.
  CoreServiceAssignBusinessRefBody:
    type: object
    properties:
      businessRef:
        $ref: '#/definitions/v1BusinessRefRequest'
        description: business_ref is the explicit or allocated reference to assign.
      reason:
        type: string
        description: reason is the justification recorded on the audit event (at most 2000 characters).
    description: AssignBusinessRefRequest gives an existing subject its business reference.
  CoreServiceEndRelationshipBody:
    type: object
    properties:
      validTo:
        type: string
        format: date-time
        description: |-
          valid_to is the business end of validity; the server time when absent. It
          may lie in the future (a scheduled end) but not before valid_from
          (INVALID_ARGUMENT).
      reason:
        type: string
        description: reason is the justification recorded on the audit event (at most 2000 characters).
    description: |-
      EndRelationshipRequest records that an open edge ended in the business sense
      ("the mandate ended"), keeping it in the graph as history. Use UnlinkSubjects
      instead when the edge was a mistake.
  DocumentServiceAddDocumentVersionBody:
    type: object
    properties:
      contentBlobId:
        type: string
        description: |-
          content_blob_id is the content from POST /api/documents/upload; empty for a
          metadata-only version. It may repeat an earlier version's content.
      isFinal:
        type: boolean
        description: is_final creates the version already final.
      isRecord:
        type: boolean
        description: is_record declares the version a record, which also makes it final.
      pageCount:
        type: integer
        format: int32
        description: page_count is the number of pages.
      metadata:
        type: object
        description: metadata holds secondary data about the version.
      reason:
        type: string
        description: reason is the justification recorded on the audit event (at most 2000 characters).
    description: AddDocumentVersionRequest appends a new current version to a document.
  DocumentServiceFinalizeDocumentBody:
    type: object
    properties:
      reason:
        type: string
        description: reason is the justification recorded on the audit event (at most 2000 characters).
      alsoLockGovernance:
        type: boolean
        description: also_lock_governance also sets record_metadata.is_locked, making the document immutable.
    description: FinalizeDocumentRequest marks a document final and optionally locks its governance record (immutable).
  DocumentServiceLinkDocumentBody:
    type: object
    properties:
      targetSubjectId:
        type: string
        description: target_subject_id is the subject the edge points to.
      relationshipTypeCode:
        type: string
        description: |-
          relationship_type_code selects a type whose source kind is DOCUMENT, e.g.
          DOCUMENT_AUTHORED_BY_ACTOR or DOCUMENT_SENT_TO_ACTOR.
      roleDetail:
        type: string
        description: role_detail optionally qualifies the relation (at most 500 characters).
    description: |-
      LinkDocumentRequest links a document to another subject (delegates to CoreService.LinkSubjects
      with document-specific validation + audit context).
    required:
      - relationshipTypeCode
  DocumentServiceUpdateDocumentMetadataBody:
    type: object
    properties:
      title:
        type: string
        description: title is the new required title (1-500 characters).
      description:
        type: string
        description: description replaces the description (at most 4000 characters).
      officialDate:
        type: string
        description: official_date replaces the legal date (YYYY-MM-DD); empty clears it.
      language:
        type: string
        description: language replaces the content language.
      metadata:
        type: object
        description: metadata replaces the whole extension map.
      reason:
        type: string
        description: reason is the justification recorded on the audit event (at most 2000 characters).
    description: |-
      UpdateDocumentMetadataRequest updates only mutable metadata. Blocked if the record is locked.
      Every field replaces the stored value (no partial merge).
  protobufAny:
    type: object
    properties:
      '@type':
        type: string
    additionalProperties: {}
  protobufNullValue:
    type: string
    enum:
      - NULL_VALUE
    default: NULL_VALUE
    description: |-
      `NullValue` is a singleton enumeration to represent the null value for the
      `Value` type union.

      The JSON representation for `NullValue` is JSON `null`.

       - NULL_VALUE: Null value.
  rpcStatus:
    type: object
    properties:
      code:
        type: integer
        format: int32
      message:
        type: string
      details:
        type: array
        items:
          type: object
          $ref: '#/definitions/protobufAny'
  v1Actor:
    type: object
    properties:
      subjectRef:
        $ref: '#/definitions/v1SubjectRef'
        description: subject_ref is the embedded canonical identity (kind = ACTOR); its id is the actor id.
      actorKind:
        $ref: '#/definitions/v1ActorKind'
        description: actor_kind is PERSON or ORGANIZATION, fixed at creation.
      displayName:
        type: string
        description: |-
          display_name is the name (1-200 characters, production Acteur.Name),
          mirrored into the subject label.
      nameForSearch:
        type: string
        description: name_for_search is the lower-cased display_name, recomputed on rename.
        readOnly: true
      isActive:
        type: boolean
        description: |-
          is_active is the business activation flag (production Acteur.IsActive),
          distinct from soft deletion.
      publicationCode:
        type: integer
        format: int32
        description: publication_code is the opaque production Acteur.CodePublication.
      person:
        $ref: '#/definitions/v1PersonDetails'
        description: person is set for ACTOR_KIND_PERSON.
      organization:
        $ref: '#/definitions/v1OrganizationDetails'
        description: organization is set for ACTOR_KIND_ORGANIZATION.
      contacts:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1ActorContact'
        description: contacts are the typed contacts, ordered by type then creation time.
      createdAt:
        type: string
        format: date-time
        description: created_at is the server creation time.
        readOnly: true
      createdBy:
        type: string
        description: created_by is the operator who created the actor.
      updatedAt:
        type: string
        format: date-time
        description: updated_at is the last modification time, maintained by the database.
        readOnly: true
      recordMetadata:
        $ref: '#/definitions/v1RecordMetadata'
        description: record_metadata is the governance record (confidentiality, lock, owner...).
    description: Actor is an external person or organization, 1:1 with SubjectRef (id == subject id).
    required:
      - displayName
  v1ActorContact:
    type: object
    properties:
      contactType:
        $ref: '#/definitions/v1ContactType'
        description: contact_type is the required, defined contact type.
      value:
        type: string
        description: value is the channel or identifier (1-400 characters, trimmed).
      isPrimary:
        type: boolean
        description: is_primary marks the preferred channel of its type; not enforced as unique.
      label:
        type: string
        description: label is an optional free note (at most 100 characters).
    description: |-
      ActorContact is one typed contact channel or business identifier attached to an
      actor (production ActeurComplement row: IdTypeComplement + Complement).
    required:
      - value
  v1ActorKind:
    type: string
    enum:
      - ACTOR_KIND_UNSPECIFIED
      - ACTOR_KIND_PERSON
      - ACTOR_KIND_ORGANIZATION
    default: ACTOR_KIND_UNSPECIFIED
    description: |-
      ActorKind discriminates a physical person from a moral organization
      (production Acteur.IsPhysique).

       - ACTOR_KIND_UNSPECIFIED: ACTOR_KIND_UNSPECIFIED is the zero value; rejected on create and means
      "any kind" in searches.
       - ACTOR_KIND_PERSON: ACTOR_KIND_PERSON is a personne physique (IsPhysique = true).
       - ACTOR_KIND_ORGANIZATION: ACTOR_KIND_ORGANIZATION is a personne morale (IsPhysique = false).
  v1AddDocumentVersionResponse:
    type: object
    properties:
      document:
        $ref: '#/definitions/v1Document'
        description: document is the document; its current_version is the new version.
      version:
        $ref: '#/definitions/v1DocumentVersion'
        description: version is the new version.
      auditEvent:
        $ref: '#/definitions/v1AuditEvent'
        description: audit_event is the DOCUMENT_VERSION_ADDED audit event.
    description: AddDocumentVersionResponse returns the document with its new current version.
  v1AssignBusinessRefResponse:
    type: object
    properties:
      subjectRef:
        $ref: '#/definitions/v1SubjectRef'
        description: subject_ref is the subject with business_ref set.
      auditEvent:
        $ref: '#/definitions/v1AuditEvent'
        description: audit_event is the BUSINESS_REF_ASSIGNED audit event.
    description: AssignBusinessRefResponse returns the subject with its reference.
  v1AuditEvent:
    type: object
    properties:
      id:
        type: string
        description: id is the server-assigned event UUID.
      subjectId:
        type: string
        description: subject_id is the subject the event is about.
      eventType:
        type: string
        description: |-
          event_type is an upper-case code (1-100 characters), e.g. DOCUMENT_CREATED,
          RELATIONSHIP_LINKED or DOCUMENT_FINALIZED.
      actorUserId:
        type: string
        description: |-
          actor_user_id is the authenticated operator who caused the event (not a
          domain ACTOR subject), derived server-side.
      occurredAt:
        type: string
        format: date-time
        description: occurred_at is the server time of the event.
        readOnly: true
      beforeState:
        type: object
        description: |-
          before_state is a snapshot of the changed critical fields before the
          mutation; absent for creations.
      afterState:
        type: object
        description: after_state is a snapshot of the changed critical fields after the mutation.
      reason:
        type: string
        description: reason is the operator-supplied justification (at most 2000 characters).
      correlationId:
        type: string
        description: |-
          correlation_id groups the events of one multi-subject action; empty when
          the event stands alone.
      requestId:
        type: string
        description: request_id is the HTTP request identifier the event was written under.
      metadata:
        type: object
        description: metadata is secondary context for the event.
    description: |-
      AuditEvent is an append-only probative audit record, written on every mutation
      in the same transaction as the change it records.
    required:
      - eventType
  v1BusinessRefRequest:
    type: object
    properties:
      namespace:
        type: string
        description: |-
          namespace scopes uniqueness, e.g. OPC: an upper-case letter followed by up
          to 31 upper-case letters, digits or underscores. Required with allocate;
          empty allows a free, non-unique explicit value (e.g. a legacy number).
      value:
        type: string
        description: value is an explicit reference (1-100 characters, no surrounding whitespace).
      allocate:
        type: boolean
        description: |-
          allocate, when true, asks for the next "<YYYY>-<NNNNNN>" reference of the
          namespace for the current calendar year in Europe/Zurich (e.g. 2026-000042).
    description: |-
      BusinessRefRequest asks for a business reference on a subject: an explicit
      value or a server-allocated one. A subject keeps its first reference.
  v1Case:
    type: object
    properties:
      subjectRef:
        $ref: '#/definitions/v1SubjectRef'
        description: |-
          subject_ref is the embedded canonical identity (kind = CASE), including the
          business reference; its id is the case id.
      caseType:
        $ref: '#/definitions/v1CaseType'
        description: case_type is the classification chosen at creation.
      title:
        type: string
        description: title is the case title (1-500 characters), mirrored into the subject label.
      description:
        type: string
        description: description is free text (at most 4000 characters).
      status:
        $ref: '#/definitions/v1CaseStatus'
        description: status is the operational state.
      openedAt:
        type: string
        format: date-time
        description: opened_at is when the case was opened.
        readOnly: true
      closedAt:
        type: string
        format: date-time
        description: closed_at is when the case was closed; absent unless status is CLOSED.
        readOnly: true
      closedBy:
        type: string
        description: closed_by is the operator who closed the case; empty unless CLOSED.
      closureReason:
        type: string
        description: closure_reason is the justification given when closing; empty unless CLOSED.
      metadata:
        type: object
        description: metadata holds secondary data about the case.
      createdAt:
        type: string
        format: date-time
        description: created_at is the server creation time.
        readOnly: true
      createdBy:
        type: string
        description: created_by is the operator who created the case.
      updatedAt:
        type: string
        format: date-time
        description: updated_at is the last modification time, maintained by the database.
        readOnly: true
      recordMetadata:
        $ref: '#/definitions/v1RecordMetadata'
        description: record_metadata is the governance record (confidentiality, lock, owner...).
    description: Case is an administrative business file, 1:1 with SubjectRef (id == subject id).
    required:
      - title
  v1CaseStatus:
    type: string
    enum:
      - CASE_STATUS_UNSPECIFIED
      - CASE_STATUS_OPEN
      - CASE_STATUS_IN_PROGRESS
      - CASE_STATUS_SUSPENDED
      - CASE_STATUS_CLOSED
    default: CASE_STATUS_UNSPECIFIED
    description: |-
      CaseStatus is the operational state of a case. ARCHIVED and DISPOSED are
      records-management states handled by the future retention component, not here.

       - CASE_STATUS_UNSPECIFIED: CASE_STATUS_UNSPECIFIED is the zero value; never stored, "any status" in searches.
       - CASE_STATUS_OPEN: CASE_STATUS_OPEN is a newly opened (or reopened) case.
       - CASE_STATUS_IN_PROGRESS: CASE_STATUS_IN_PROGRESS is a case being actively processed.
       - CASE_STATUS_SUSPENDED: CASE_STATUS_SUSPENDED is a case put on hold (e.g. waiting for the requester).
       - CASE_STATUS_CLOSED: CASE_STATUS_CLOSED is an operationally finished case; its metadata can no
      longer be edited until it is reopened.
  v1CaseType:
    type: object
    properties:
      id:
        type: string
        description: id is the catalogue row UUID.
      code:
        type: string
        description: code is the unique stable key (1-100 characters), e.g. OPC_DEMANDE_PC.
      label:
        type: string
        description: label is the human label (at most 200 characters).
      description:
        type: string
        description: description documents the business meaning (at most 2000 characters).
      businessRefNamespace:
        type: string
        description: |-
          business_ref_namespace, when set, makes CreateCase allocate the case's
          business reference in this namespace (e.g. OPC → 2026-000042).
      isActive:
        type: boolean
        description: is_active reports whether the type is offered for new cases.
    description: |-
      CaseType is a controlled classification of cases (e.g. OPC_DEMANDE_PC).
      Types are seeded reference data; a case's type is fixed at creation.
    required:
      - code
  v1ContactType:
    type: string
    enum:
      - CONTACT_TYPE_UNSPECIFIED
      - CONTACT_TYPE_PHONE
      - CONTACT_TYPE_PHONE_PRIVATE
      - CONTACT_TYPE_PHONE_PRO
      - CONTACT_TYPE_MOBILE
      - CONTACT_TYPE_FAX
      - CONTACT_TYPE_EMAIL
      - CONTACT_TYPE_WEBSITE
      - CONTACT_TYPE_POSTAL_BOX
      - CONTACT_TYPE_IDE_FEDERAL
      - CONTACT_TYPE_VAT_NUMBER
      - CONTACT_TYPE_ABACUS_DEBTOR
      - CONTACT_TYPE_COMMERCIAL_REGISTER
      - CONTACT_TYPE_OTHER
    default: CONTACT_TYPE_UNSPECIFIED
    description: |-
      ContactType is the controlled vocabulary for the typed contact / identity bag
      (production DicoActeurTypeComplement). Values split into contact channels and
      probative business identifiers; the latter stay first-class so they are
      queryable (an actor is often located by IDE / VAT / ABACUS debtor number).

       - CONTACT_TYPE_UNSPECIFIED: CONTACT_TYPE_UNSPECIFIED is the zero value; rejected on input.
       - CONTACT_TYPE_PHONE: CONTACT_TYPE_PHONE is a general phone number (channel).
       - CONTACT_TYPE_PHONE_PRIVATE: CONTACT_TYPE_PHONE_PRIVATE is a private phone number (channel).
       - CONTACT_TYPE_PHONE_PRO: CONTACT_TYPE_PHONE_PRO is a professional phone number (channel).
       - CONTACT_TYPE_MOBILE: CONTACT_TYPE_MOBILE is a mobile phone number (channel).
       - CONTACT_TYPE_FAX: CONTACT_TYPE_FAX is a fax number (channel).
       - CONTACT_TYPE_EMAIL: CONTACT_TYPE_EMAIL is an e-mail address (channel).
       - CONTACT_TYPE_WEBSITE: CONTACT_TYPE_WEBSITE is a website URL (channel).
       - CONTACT_TYPE_POSTAL_BOX: CONTACT_TYPE_POSTAL_BOX is a postal box / case postale (channel).
       - CONTACT_TYPE_IDE_FEDERAL: CONTACT_TYPE_IDE_FEDERAL is the federal IDE / UID business identifier (CHE-###.###.###).
       - CONTACT_TYPE_VAT_NUMBER: CONTACT_TYPE_VAT_NUMBER is a VAT (TVA) number.
       - CONTACT_TYPE_ABACUS_DEBTOR: CONTACT_TYPE_ABACUS_DEBTOR is the ABACUS accounting debtor number.
       - CONTACT_TYPE_COMMERCIAL_REGISTER: CONTACT_TYPE_COMMERCIAL_REGISTER is a commercial register (registre du commerce) link.
       - CONTACT_TYPE_OTHER: CONTACT_TYPE_OTHER is any other channel; label should describe it.
  v1ContentBlob:
    type: object
    properties:
      id:
        type: string
        description: id is the blob UUID returned by the upload endpoint.
      sha256:
        type: string
        description: sha256 is the lower-case hex digest computed by the server; unique.
      storageRef:
        type: string
        description: |-
          storage_ref is the URI of the bytes (internal://...); empty when the bytes
          are held by an external system and only the digest is known.
      mimeType:
        type: string
        description: mime_type is the media type of the bytes; empty when unknown.
      fileSizeBytes:
        type: string
        format: int64
        description: file_size_bytes is the size of the bytes. Serialized as a JSON string (int64).
      createdAt:
        type: string
        format: date-time
        description: created_at is when the content was first stored.
        readOnly: true
      createdBy:
        type: string
        description: created_by is the operator whose upload first stored the content.
      verifiedAt:
        type: string
        format: date-time
        description: verified_at is the last probative re-verification of the bytes; currently never set (GLD-021).
        readOnly: true
    description: |-
      ContentBlob is binary content identified by its SHA-256; identical bytes are
      stored once and may back several versions (spec v2 §17, §19).
  v1CreateActorRequest:
    type: object
    properties:
      actorKind:
        $ref: '#/definitions/v1ActorKind'
        description: actor_kind is the required kind; UNSPECIFIED is rejected.
      displayName:
        type: string
        description: display_name is the required name (1-200 characters, trimmed).
      publicationCode:
        type: integer
        format: int32
        description: publication_code is the opaque legacy publication code.
      person:
        $ref: '#/definitions/v1PersonDetails'
        description: person carries the PERSON fields.
      organization:
        $ref: '#/definitions/v1OrganizationDetails'
        description: organization carries the ORGANIZATION fields.
      contacts:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1ActorContact'
        description: contacts are the initial typed contacts.
      initialGovernance:
        $ref: '#/definitions/v1RecordMetadata'
        description: |-
          initial_governance optionally sets the owner, confidentiality and records
          fields; the owner defaults to the operator.

          NOTE: the acting operator is derived server-side from the authenticated
          principal (never trusted from the client).
    description: |-
      CreateActorRequest registers an actor. SubjectRef + RecordMetadata are created
      via Core internally. The kind-specific block must match actor_kind.
    required:
      - displayName
  v1CreateActorResponse:
    type: object
    properties:
      actor:
        $ref: '#/definitions/v1Actor'
        description: actor is the created actor with its contacts and governance.
      createdEvent:
        $ref: '#/definitions/v1AuditEvent'
        description: created_event is the ACTOR_CREATED audit event.
    description: CreateActorResponse returns the created actor.
  v1CreateCaseRequest:
    type: object
    properties:
      caseTypeCode:
        type: string
        description: case_type_code is the required code of an active case type.
      title:
        type: string
        description: title is the required title (1-500 characters); surrounding whitespace is trimmed.
      description:
        type: string
        description: description is optional free text (at most 4000 characters).
      metadata:
        type: object
        description: metadata holds secondary data about the case.
      businessRef:
        $ref: '#/definitions/v1BusinessRefRequest'
        description: |-
          business_ref overrides the reference: absent means "allocate in the case
          type's namespace when it has one, otherwise none".
      initialGovernance:
        $ref: '#/definitions/v1RecordMetadata'
        description: |-
          initial_governance optionally sets the owner, confidentiality and records
          fields; the owner defaults to the operator.

          NOTE: the acting operator is derived server-side from the authenticated
          principal (never trusted from the client).
    description: |-
      CreateCaseRequest opens a new case. SubjectRef + RecordMetadata are created
      via Core internally, in the same transaction.
    required:
      - caseTypeCode
      - title
  v1CreateCaseResponse:
    type: object
    properties:
      case:
        $ref: '#/definitions/v1Case'
        description: case is the opened case (status OPEN) with its governance.
      createdEvent:
        $ref: '#/definitions/v1AuditEvent'
        description: created_event is the CASE_CREATED audit event.
    description: CreateCaseResponse returns the opened case.
  v1CreateDocumentRequest:
    type: object
    properties:
      documentTypeCode:
        type: string
        description: document_type_code is the required code of an existing document type.
      title:
        type: string
        description: title is the required title (1-500 characters); surrounding whitespace is trimmed.
      description:
        type: string
        description: description is optional free text (at most 4000 characters).
      officialDate:
        type: string
        description: official_date is the optional legal date as YYYY-MM-DD.
      externalSystem:
        type: string
        description: external_system names the external system of record, if any.
      externalId:
        type: string
        description: external_id identifies the document inside external_system.
      externalUrl:
        type: string
        description: external_url links to the external document; it becomes the subject's canonical URL.
      isFinal:
        type: boolean
        description: is_final creates version 1 already final (document status FINAL).
      isRecord:
        type: boolean
        description: is_record declares version 1 a record, which also makes it final.
      language:
        type: string
        description: language is the ISO 639 content language.
      pageCount:
        type: integer
        format: int32
        description: page_count is the number of pages of version 1.
      metadata:
        type: object
        description: metadata holds secondary extension data.
      initialGovernance:
        $ref: '#/definitions/v1RecordMetadata'
        description: |-
          initial_governance optionally sets the owner, confidentiality and records
          fields; the owner defaults to the operator.

          NOTE: the acting operator is derived server-side from the authenticated
          principal (never trusted from the client). A document's AUTHOR is a separate,
          external ACTOR subject linked via DOCUMENT_AUTHORED_BY_ACTOR — not this operator.
      linkToCaseId:
        type: string
        description: |-
          link_to_case_id is an optional convenience: link the new (or reused)
          document to this case with CASE_HAS_DOCUMENT in the same transaction.
      contentBlobId:
        type: string
        description: |-
          content_blob_id is the content returned by POST /api/documents/upload;
          empty for a metadata-only document or an external reference. NOT_FOUND
          when unknown.
    description: |-
      CreateDocumentRequest registers a document (metadata first; the bytes are
      uploaded beforehand and referenced by content_blob_id). When the content is
      already held by a live document, that document is reused instead (see
      CreateDocumentResponse.reused).
    required:
      - documentTypeCode
      - title
  v1CreateDocumentResponse:
    type: object
    properties:
      document:
        $ref: '#/definitions/v1Document'
        description: document is the created document, or the reused one when reused is true.
      createdEvent:
        $ref: '#/definitions/v1AuditEvent'
        description: created_event is DOCUMENT_CREATED, or DOCUMENT_REUSED on the existing document.
      initialRelationship:
        $ref: '#/definitions/v1SubjectRelationship'
        description: |-
          initial_relationship is the CASE_HAS_DOCUMENT edge; set only when
          link_to_case_id was provided and the link did not already exist.
      reused:
        type: boolean
        description: |-
          reused is true when the content was already held by a live document, which
          was reused (no new document; the request's title and metadata are ignored).
    description: CreateDocumentResponse returns the created (or reused) document and its side effects.
  v1CreateSubjectRefRequest:
    type: object
    properties:
      kind:
        $ref: '#/definitions/v1SubjectKind'
        description: kind is the required subject kind; UNSPECIFIED is rejected.
      displayLabel:
        type: string
        description: display_label is the required human label (1-500 characters).
      canonicalUrl:
        type: string
        description: canonical_url is an optional stable permalink (at most 2048 characters).
      initialMetadata:
        $ref: '#/definitions/v1RecordMetadata'
        description: |-
          initial_metadata optionally sets the owner, confidentiality, retention,
          sort_final and metadata of the new governance record.
      businessRef:
        $ref: '#/definitions/v1BusinessRefRequest'
        description: |-
          business_ref optionally assigns a business reference in the same
          transaction; ALREADY_EXISTS when the (namespace, value) pair is taken.

          NOTE: the acting operator is derived server-side from the authenticated
           principal (never trusted from the client) and recorded as audit_event.actor_user_id.
    description: CreateSubjectRefRequest creates a bare subject identity with its governance record.
    required:
      - displayLabel
  v1CreateSubjectRefResponse:
    type: object
    properties:
      subjectRef:
        $ref: '#/definitions/v1SubjectRef'
        description: subject_ref is the created identity.
      metadata:
        $ref: '#/definitions/v1RecordMetadata'
        description: metadata is the created governance record.
      createdEvent:
        $ref: '#/definitions/v1AuditEvent'
        description: created_event is the SUBJECT_CREATED audit event.
    description: CreateSubjectRefResponse returns the created identity, governance and audit event.
  v1DeleteActorResponse:
    type: object
    properties:
      deletedActorId:
        type: string
        description: deleted_actor_id is the soft-deleted actor.
      deleteEvent:
        $ref: '#/definitions/v1AuditEvent'
        description: delete_event is the ACTOR_DELETED audit event.
    description: DeleteActorResponse confirms a soft delete.
  v1DeleteCaseResponse:
    type: object
    properties:
      deletedCaseId:
        type: string
        description: deleted_case_id is the soft-deleted case.
      deleteEvent:
        $ref: '#/definitions/v1AuditEvent'
        description: delete_event is the CASE_DELETED audit event.
    description: DeleteCaseResponse confirms a soft delete.
  v1DeleteDocumentResponse:
    type: object
    properties:
      deletedDocumentId:
        type: string
        description: deleted_document_id is the soft-deleted document.
      deleteEvent:
        $ref: '#/definitions/v1AuditEvent'
        description: delete_event is the DOCUMENT_DELETED audit event.
    description: DeleteDocumentResponse confirms a soft delete.
  v1Document:
    type: object
    properties:
      subjectRef:
        $ref: '#/definitions/v1SubjectRef'
        description: subject_ref is the embedded canonical identity (kind = DOCUMENT); its id is the document id.
      documentType:
        $ref: '#/definitions/v1DocumentType'
        description: document_type is the classification chosen at creation.
      title:
        type: string
        description: title is the document title (1-500 characters), mirrored into the subject label.
      description:
        type: string
        description: description is free text (at most 4000 characters).
      officialDate:
        type: string
        description: |-
          official_date is the legal probative date of the document itself, as
          YYYY-MM-DD; empty when unknown.
      externalSystem:
        type: string
        description: |-
          external_system names the system of record: alfresco, minio, sharepoint
          or goeland-legacy; empty when internal.
      externalId:
        type: string
        description: external_id is the authoritative id in external_system (prevents duplication).
      externalUrl:
        type: string
        description: external_url is a clickable link to the external document, if available.
      language:
        type: string
        description: |-
          language is the ISO 639 content language, e.g. "fr" or "de" (at most 10
          characters); unrelated to the UI locale.
      status:
        $ref: '#/definitions/v1DocumentStatus'
        description: status is the lifecycle state; FINAL when the current version is final.
      metadata:
        type: object
        description: 'metadata holds secondary data: classification, keywords, extracted entities...'
      createdAt:
        type: string
        format: date-time
        description: created_at is the server creation time.
        readOnly: true
      createdBy:
        type: string
        description: created_by is the operator who created the document.
      updatedAt:
        type: string
        format: date-time
        description: updated_at is the last modification time, maintained by the database.
        readOnly: true
      recordMetadata:
        $ref: '#/definitions/v1RecordMetadata'
        description: record_metadata is the governance record (confidentiality, lock, owner...).
      currentVersion:
        $ref: '#/definitions/v1DocumentVersion'
        description: current_version is the explicit current version, with its content.
        readOnly: true
    description: |-
      Document is the logical business document, 1:1 with SubjectRef (id == subject
      id); its content lives in versions. External references (Alfresco node, legacy,
      SharePoint) stay document-level.
    required:
      - title
  v1DocumentStatus:
    type: string
    enum:
      - DOCUMENT_STATUS_UNSPECIFIED
      - DOCUMENT_STATUS_DRAFT
      - DOCUMENT_STATUS_FINAL
      - DOCUMENT_STATUS_SUPERSEDED
      - DOCUMENT_STATUS_ARCHIVED
    default: DOCUMENT_STATUS_UNSPECIFIED
    description: |-
      DocumentStatus is the lifecycle state of a document.

       - DOCUMENT_STATUS_UNSPECIFIED: DOCUMENT_STATUS_UNSPECIFIED is the zero value; never stored.
       - DOCUMENT_STATUS_DRAFT: DOCUMENT_STATUS_DRAFT is the initial, editable state.
       - DOCUMENT_STATUS_FINAL: DOCUMENT_STATUS_FINAL marks a finalized document (is_final = true).
       - DOCUMENT_STATUS_SUPERSEDED: DOCUMENT_STATUS_SUPERSEDED marks a document replaced by a newer version.
       - DOCUMENT_STATUS_ARCHIVED: DOCUMENT_STATUS_ARCHIVED marks a document handed over to archiving.
  v1DocumentType:
    type: object
    properties:
      id:
        type: string
        description: id is the catalogue row UUID.
      code:
        type: string
        description: |-
          code is the unique stable key (1-100 characters), e.g. PLAN,
          INCOMING_LETTER or DECISION.
      label:
        type: string
        description: label is the human label (at most 200 characters).
      description:
        type: string
        description: description documents the business meaning (at most 2000 characters).
      category:
        type: string
        description: |-
          category groups types: ENTREE, SORTIE, PLAN, DECISION, JUSTIFICATIF...;
          empty when uncategorized.
      isActive:
        type: boolean
        description: is_active reports whether the type is offered for new documents.
    description: |-
      DocumentType is a controlled classification (behavior + category).
      Types are seeded reference data; a document's type is fixed at creation.
    required:
      - code
  v1DocumentVersion:
    type: object
    properties:
      id:
        type: string
        description: id is the version UUID.
      documentId:
        type: string
        description: document_id is the owning document.
      versionNo:
        type: integer
        format: int32
        description: version_no numbers the versions of one document from 1, without gaps.
      content:
        $ref: '#/definitions/v1ContentBlob'
        description: |-
          content is the binary content; absent for a metadata-only version or an
          external reference.
      pageCount:
        type: integer
        format: int32
        description: page_count is the number of pages; 0 when unknown.
      isFinal:
        type: boolean
        description: is_final reports a validated, business-final version (then immutable).
      isRecord:
        type: boolean
        description: is_record declares a record for retention / records management; a record is always final.
      validatedAt:
        type: string
        format: date-time
        description: validated_at is when the version became final; absent while mutable.
        readOnly: true
      validatedBy:
        type: string
        description: validated_by is the operator who made the version final.
      metadata:
        type: object
        description: metadata holds secondary data about this version.
      createdAt:
        type: string
        format: date-time
        description: created_at is the server creation time.
        readOnly: true
      createdBy:
        type: string
        description: created_by is the operator who added the version.
    description: |-
      DocumentVersion is a dated, append-only state of a document (spec v2 §18). A
      final or record version is immutable; versions are never deleted.
  v1EndRelationshipResponse:
    type: object
    properties:
      relationship:
        $ref: '#/definitions/v1SubjectRelationship'
        description: relationship is the ended edge, hydrated with both subjects and the type.
      auditEvent:
        $ref: '#/definitions/v1AuditEvent'
        description: audit_event is the RELATIONSHIP_ENDED audit event.
    description: EndRelationshipResponse returns the ended edge and its audit event.
  v1FinalizeDocumentResponse:
    type: object
    properties:
      document:
        $ref: '#/definitions/v1Document'
        description: document is the finalized document.
      finalizeEvent:
        $ref: '#/definitions/v1AuditEvent'
        description: finalize_event is the DOCUMENT_FINALIZED audit event.
    description: FinalizeDocumentResponse returns the finalized document.
  v1GetActorResponse:
    type: object
    properties:
      actor:
        $ref: '#/definitions/v1Actor'
        description: actor is the actor with its contacts and governance.
      relationships:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1SubjectRelationship'
        description: relationships are the incoming edges; empty unless include_relationships was set.
      recentAudit:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1AuditEvent'
        description: recent_audit holds the latest audit events, newest first; empty unless include_audit was set.
    description: GetActorResponse returns an actor and the requested context.
  v1GetCaseResponse:
    type: object
    properties:
      case:
        $ref: '#/definitions/v1Case'
        description: case is the case with its governance.
      relationships:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1SubjectRelationship'
        description: relationships are the outgoing then incoming edges; empty unless include_relationships was set.
      recentAudit:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1AuditEvent'
        description: recent_audit holds the latest audit events, newest first; empty unless include_audit was set.
    description: GetCaseResponse returns a case and the requested context.
  v1GetDocumentResponse:
    type: object
    properties:
      document:
        $ref: '#/definitions/v1Document'
        description: document is the document with its governance.
      relationships:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1SubjectRelationship'
        description: relationships are the outgoing edges; empty unless include_relationships was set.
      recentAudit:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1AuditEvent'
        description: recent_audit holds the latest audit events, newest first; empty unless include_audit was set.
    description: GetDocumentResponse returns a document and the requested context.
  v1GetSubjectRefResponse:
    type: object
    properties:
      subjectRef:
        $ref: '#/definitions/v1SubjectRef'
        description: subject_ref is the subject identity.
      metadata:
        $ref: '#/definitions/v1RecordMetadata'
        description: metadata is the governance record; absent unless include_metadata was set.
      recentAudit:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1AuditEvent'
        description: recent_audit holds the latest audit events; empty unless include_audit_summary was set.
    description: GetSubjectRefResponse returns a subject and the requested optional parts.
  v1LinkDocumentResponse:
    type: object
    properties:
      relationship:
        $ref: '#/definitions/v1SubjectRelationship'
        description: relationship is the created edge.
      auditEvent:
        $ref: '#/definitions/v1AuditEvent'
        description: audit_event is the RELATIONSHIP_LINKED audit event.
    description: LinkDocumentResponse returns the created edge.
  v1LinkSubjectsRequest:
    type: object
    properties:
      sourceSubjectId:
        type: string
        description: source_subject_id is the subject the edge starts from.
      targetSubjectId:
        type: string
        description: target_subject_id is the subject the edge points to.
      relationshipTypeCode:
        type: string
        description: |-
          relationship_type_code selects an active RelationshipType whose kinds must
          match the two subjects (FAILED_PRECONDITION otherwise).
      roleDetail:
        type: string
        description: role_detail optionally qualifies the relation (at most 500 characters).
      validFrom:
        type: string
        format: date-time
        description: valid_from is the optional business start of validity.
    description: LinkSubjectsRequest creates a typed edge between two existing subjects.
    required:
      - relationshipTypeCode
  v1LinkSubjectsResponse:
    type: object
    properties:
      relationship:
        $ref: '#/definitions/v1SubjectRelationship'
        description: relationship is the created edge, hydrated with both subjects and the type.
      auditEvent:
        $ref: '#/definitions/v1AuditEvent'
        description: audit_event is the RELATIONSHIP_LINKED audit event.
    description: LinkSubjectsResponse returns the created edge and its audit event.
  v1ListAuditEventsResponse:
    type: object
    properties:
      events:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1AuditEvent'
        description: events are the audit events of this page, newest first.
      nextPageToken:
        type: string
        description: next_page_token fetches the next page; empty on the last page.
      totalSize:
        type: integer
        format: int32
        description: total_size is the number of matching events across all pages.
    description: ListAuditEventsResponse is one page of audit events.
  v1ListCaseTypesResponse:
    type: object
    properties:
      caseTypes:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1CaseType'
        description: case_types are the matching types.
    description: ListCaseTypesResponse returns the matching case types, ordered by code.
  v1ListDocumentTypesResponse:
    type: object
    properties:
      documentTypes:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1DocumentType'
        description: document_types are the matching types.
    description: ListDocumentTypesResponse returns the matching catalogue entries.
  v1ListDocumentVersionsResponse:
    type: object
    properties:
      versions:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1DocumentVersion'
        description: versions are the versions with their content, newest first.
    description: ListDocumentVersionsResponse returns every version, newest first.
  v1ListOrganizationCategoriesResponse:
    type: object
    properties:
      categories:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1OrganizationCategory'
        description: categories are the matching categories, ordered by label.
    description: ListOrganizationCategoriesResponse returns the matching categories.
  v1ListRelationshipTypesResponse:
    type: object
    properties:
      relationshipTypes:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1RelationshipType'
        description: relationship_types are the matching types.
    description: ListRelationshipTypesResponse returns the matching catalogue entries.
  v1ListRelationshipsResponse:
    type: object
    properties:
      relationships:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1SubjectRelationship'
        description: relationships are the edges of this page, hydrated with subjects and types.
      nextPageToken:
        type: string
        description: next_page_token fetches the next page; empty on the last page.
      totalSize:
        type: integer
        format: int32
        description: total_size is the number of matching edges across all pages.
    description: ListRelationshipsResponse is one page of edges.
  v1LookupSubjectsResponse:
    type: object
    properties:
      subjectRefs:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1SubjectRef'
        description: |-
          subject_refs are the matches, oldest first, at most 50 (a namespaced
          reference matches at most one subject).
    description: LookupSubjectsResponse returns the matching subjects.
  v1OrganizationCategory:
    type: object
    properties:
      id:
        type: string
        description: id is the catalogue row UUID.
      code:
        type: string
        description: code is the unique stable key (1-100 characters) used by requests and filters.
      label:
        type: string
        description: label is the human label (at most 200 characters).
      isActive:
        type: boolean
        description: is_active reports whether the category is offered for new organizations.
    description: |-
      OrganizationCategory is the controlled classification of a moral person
      (production DicoActMoralCategory: Commerces, Bureau d'architecte, Gérance, ...).
    required:
      - code
  v1OrganizationDetails:
    type: object
    properties:
      legalName:
        type: string
        description: legal_name is the required legal name / RaisonSociale (1-200 characters).
      categoryCode:
        type: string
        description: category_code is an OrganizationCategory.code; empty leaves the organization uncategorized.
      complement:
        type: string
        description: complement is an optional name complement (at most 1000 characters).
    description: OrganizationDetails carries the ORGANIZATION-only fields (production ActMoral).
    required:
      - legalName
  v1PersonDetails:
    type: object
    properties:
      isChRegister:
        type: boolean
        description: |-
          is_ch_register reports whether the person is linked to the CH population
          register (production Acteur.IsFromCH).
      chRegisterRef:
        type: string
        description: ch_register_ref is an opaque external register key (at most 100 characters); never PII.
    description: |-
      PersonDetails carries the PERSON-only fields. No civil-registry personal data is
      stored: only whether the person is linked to the CH population register and an
      opaque reference to it, so real identity stays in the source system.
  v1RecordMetadata:
    type: object
    properties:
      subjectId:
        type: string
        description: |-
          subject_id is server-assigned. When RecordMetadata is used as an input for
          initial governance it is left empty, so the uuid rule is skipped when unset.
      createdAt:
        type: string
        format: date-time
        description: created_at is the server creation time.
        readOnly: true
      createdBy:
        type: string
        description: created_by is the operator who created the subject, or "system" for imports.
      updatedAt:
        type: string
        format: date-time
        description: updated_at is the last governance mutation time; absent until the first update.
        readOnly: true
      updatedBy:
        type: string
        description: updated_by is the operator of the last mutation; empty until then.
      deletedAt:
        type: string
        format: date-time
        description: |-
          deleted_at marks a logical (soft) delete; absent while the subject is live.
          Records are never physically deleted.
        readOnly: true
      deletedBy:
        type: string
        description: deleted_by is the operator who soft-deleted the subject; empty while live.
      ownerUserId:
        type: string
        description: owner_user_id is the owning user; on creation it defaults to the operator.
      ownerOrgId:
        type: string
        description: owner_org_id is the owning organizational unit; empty when unset.
      confidentialityLevel:
        type: integer
        format: int32
        description: |-
          confidentiality_level ranges from 0 (public) to 5 (secret); recorded but not
          yet enforced by a permission engine.
      version:
        type: integer
        format: int32
        description: version starts at 1 and is incremented by every governance mutation.
        readOnly: true
      isLocked:
        type: boolean
        description: is_locked is set on formal validation or closure; a locked subject is immutable.
      lockedAt:
        type: string
        format: date-time
        description: locked_at is the lock time; absent while unlocked.
        readOnly: true
      lockedBy:
        type: string
        description: locked_by is the operator who locked the subject; empty while unlocked.
      retentionUntil:
        type: string
        description: |-
          retention_until is an ISO date or a records-management policy reference;
          empty when no retention rule applies.
      sortFinal:
        type: string
        description: |-
          sort_final is the archival disposition: CONSERVER, ELIMINER, ARCHIVER or
          VERSER_SAE; empty when undecided.
      metadata:
        type: object
        additionalProperties:
          type: string
        description: metadata holds secondary governance attributes; never critical fields.
    description: |-
      RecordMetadata is the 1:1 governance record attached to every SubjectRef.
      It implements non-destructive lifecycle, ownership, confidentiality and locking.
      As an input (initial governance) only the owner, confidentiality, retention,
      sort_final and metadata fields are read; the rest is server-managed.
  v1RelationshipType:
    type: object
    properties:
      id:
        type: string
        description: id is the catalogue row UUID.
      code:
        type: string
        description: |-
          code is the unique stable key (1-100 characters), e.g. CASE_HAS_DOCUMENT,
          DOCUMENT_AUTHORED_BY_ACTOR or DOCUMENT_PREVIOUS_VERSION.
      label:
        type: string
        description: label is the human label read from source to target (at most 200 characters).
      sourceKind:
        $ref: '#/definitions/v1SubjectKind'
        description: source_kind is the required kind of the source subject.
      targetKind:
        $ref: '#/definitions/v1SubjectKind'
        description: target_kind is the required kind of the target subject.
      isDirected:
        type: boolean
        description: is_directed reports whether the edge reads one way only.
      inverseLabel:
        type: string
        description: inverse_label is the human label read from target to source; empty when none.
      description:
        type: string
        description: description documents the business meaning (at most 2000 characters).
      isActive:
        type: boolean
        description: is_active reports whether new links of this type may be created.
    description: |-
      RelationshipType defines an allowed typed relation between two subject kinds.
      Types are seeded reference data; a link is accepted only when the subjects'
      kinds equal source_kind and target_kind.
    required:
      - code
  v1SearchActorsResponse:
    type: object
    properties:
      actors:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1Actor'
        description: actors are the actors of this page.
      nextPageToken:
        type: string
        description: next_page_token fetches the next page; empty on the last page.
      totalSize:
        type: integer
        format: int32
        description: total_size is the number of matching actors across all pages.
    description: SearchActorsResponse is one page of matching actors.
  v1SearchCasesResponse:
    type: object
    properties:
      cases:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1Case'
        description: cases are the cases of this page.
      nextPageToken:
        type: string
        description: next_page_token fetches the next page; empty on the last page.
      totalSize:
        type: integer
        format: int32
        description: total_size is the number of matching cases across all pages.
    description: SearchCasesResponse is one page of matching cases.
  v1SearchDocumentsResponse:
    type: object
    properties:
      documents:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1Document'
        description: documents are the documents of this page.
      nextPageToken:
        type: string
        description: next_page_token fetches the next page; empty on the last page.
      totalSize:
        type: integer
        format: int32
        description: total_size is the number of matching documents across all pages.
    description: SearchDocumentsResponse is one page of matching documents.
  v1SubjectKind:
    type: string
    enum:
      - SUBJECT_KIND_UNSPECIFIED
      - SUBJECT_KIND_CASE
      - SUBJECT_KIND_DOCUMENT
      - SUBJECT_KIND_THING
      - SUBJECT_KIND_ACTOR
      - SUBJECT_KIND_USER
      - SUBJECT_KIND_ORG_UNIT
    default: SUBJECT_KIND_UNSPECIFIED
    description: |-
      SubjectKind enumerates the canonical business subjects. Every SubjectRef has exactly one kind.

       - SUBJECT_KIND_UNSPECIFIED: SUBJECT_KIND_UNSPECIFIED is the zero value; rejected where a kind is required
      and means "any kind" in filters.
       - SUBJECT_KIND_CASE: SUBJECT_KIND_CASE is an administrative case file (affaire / dossier métier).
       - SUBJECT_KIND_DOCUMENT: SUBJECT_KIND_DOCUMENT is a GED document (DocumentService).
       - SUBJECT_KIND_THING: SUBJECT_KIND_THING is a business or territorial object (parcelle, bâtiment...).
       - SUBJECT_KIND_ACTOR: SUBJECT_KIND_ACTOR is an external person or organization (ActorService);
      never an authenticated operator.
       - SUBJECT_KIND_USER: SUBJECT_KIND_USER is an internal user as a graph subject (future).
       - SUBJECT_KIND_ORG_UNIT: SUBJECT_KIND_ORG_UNIT is an internal organizational unit (future).
  v1SubjectRef:
    type: object
    properties:
      id:
        type: string
        description: id is the server-assigned UUID shared by the domain entity and its governance record.
      kind:
        $ref: '#/definitions/v1SubjectKind'
        description: kind is the immutable subject kind.
      displayLabel:
        type: string
        description: |-
          display_label is the human label (1-500 characters), kept in sync with the
          domain entity's own label, e.g. a document title.
      canonicalUrl:
        type: string
        description: canonical_url is an optional stable external permalink or URI (at most 2048 characters).
      createdAt:
        type: string
        format: date-time
        description: created_at is the server creation time.
        readOnly: true
      businessRef:
        type: string
        description: |-
          business_ref is the optional human business reference, e.g. 2026-001245;
          empty when none. It is not the identity (id is). Set through
          CreateSubjectRefRequest.business_ref or AssignBusinessRef.
        readOnly: true
      businessRefNamespace:
        type: string
        description: |-
          business_ref_namespace scopes business_ref, e.g. OPC; (namespace,
          business_ref) is unique when the namespace is set. Empty for a free
          (non-unique) reference or no reference.
        readOnly: true
    description: |-
      SubjectRef is the canonical identity of any business subject.
      Every Case, Document, Thing and Actor owns exactly one SubjectRef entry.
    required:
      - displayLabel
  v1SubjectRelationship:
    type: object
    properties:
      id:
        type: string
        description: id is the server-assigned edge UUID.
      source:
        $ref: '#/definitions/v1SubjectRef'
        description: source is the subject the edge starts from.
      target:
        $ref: '#/definitions/v1SubjectRef'
        description: target is the subject the edge points to.
      relationshipType:
        $ref: '#/definitions/v1RelationshipType'
        description: relationship_type is the validated type of the edge.
      roleDetail:
        type: string
        description: |-
          role_detail qualifies the relation in free text (at most 500 characters),
          e.g. "mandataire principal" or "plan de masse v2".
      validFrom:
        type: string
        format: date-time
        description: valid_from is the optional business start of validity.
      validTo:
        type: string
        format: date-time
        description: |-
          valid_to is the business end of validity, set by EndRelationship; absent
          while the edge is open.
      createdAt:
        type: string
        format: date-time
        description: created_at is the server creation time.
        readOnly: true
      createdBy:
        type: string
        description: created_by is the operator who created the edge.
      deletedAt:
        type: string
        format: date-time
        description: deleted_at marks an unlinked (soft-deleted) edge; absent while active.
        readOnly: true
    description: |-
      SubjectRelationship is an actual edge in the business graph: typed, validated, soft-deletable.
      At most one open edge (not unlinked, no valid_to) exists per (source, target, type);
      an ended edge stays as history.
  v1TransitionCaseResponse:
    type: object
    properties:
      case:
        $ref: '#/definitions/v1Case'
        description: case is the case in its new status.
      transitionEvent:
        $ref: '#/definitions/v1AuditEvent'
        description: transition_event is the CASE_STATUS_CHANGED audit event (before/after status).
    description: TransitionCaseResponse returns the case in its new status.
  v1UnlinkSubjectsResponse:
    type: object
    properties:
      relationshipId:
        type: string
        description: relationship_id is the unlinked edge.
      auditEvent:
        $ref: '#/definitions/v1AuditEvent'
        description: audit_event is the RELATIONSHIP_UNLINKED audit event.
    description: UnlinkSubjectsResponse confirms an unlink.
  v1UpdateActorResponse:
    type: object
    properties:
      actor:
        $ref: '#/definitions/v1Actor'
        description: actor is the updated actor.
      updateEvent:
        $ref: '#/definitions/v1AuditEvent'
        description: update_event is the ACTOR_UPDATED audit event.
    description: UpdateActorResponse returns the updated actor.
  v1UpdateCaseResponse:
    type: object
    properties:
      case:
        $ref: '#/definitions/v1Case'
        description: case is the updated case.
      updateEvent:
        $ref: '#/definitions/v1AuditEvent'
        description: update_event is the CASE_UPDATED audit event.
    description: UpdateCaseResponse returns the updated case.
  v1UpdateDocumentMetadataResponse:
    type: object
    properties:
      document:
        $ref: '#/definitions/v1Document'
        description: document is the updated document.
      updateEvent:
        $ref: '#/definitions/v1AuditEvent'
        description: update_event is the DOCUMENT_METADATA_UPDATED audit event.
    description: UpdateDocumentMetadataResponse returns the updated document.
  v1VerifyDocumentIntegrityResponse:
    type: object
    properties:
      verified:
        type: boolean
        description: |-
          verified is true only when expected_sha256 and the registered hash are both
          non-empty and equal (case-insensitive).
      actualSha256:
        type: string
        description: actual_sha256 is the hash of the current version's content; empty without content.
      verifiedAt:
        type: string
        format: date-time
        description: verified_at is the content's last probative verification time; currently never set.
      storageRefChecked:
        type: string
        description: |-
          storage_ref_checked is the storage reference whose bytes were hashed;
          always empty because no bytes are read yet.
    description: VerifyDocumentIntegrityResponse reports the non-probative hash comparison.
