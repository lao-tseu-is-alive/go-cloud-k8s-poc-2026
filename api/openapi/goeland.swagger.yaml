  /api/relationship-types:
    get:
      summary: |-
        List the catalogue of allowed relationship types (optionally filtered).
        Requires goeland:read.
      operationId: ListRelationshipTypes
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListRelationshipTypesResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: onlyActive
          description: only_active returns only types that accept new links.
          in: query
          required: false
          type: boolean
        - name: sourceKind
          description: |-
            source_kind restricts the list to one source kind; UNSPECIFIED means any.

             - SUBJECT_KIND_UNSPECIFIED: SUBJECT_KIND_UNSPECIFIED is the zero value; rejected where a kind is required
            and means "any kind" in filters.
             - SUBJECT_KIND_CASE: SUBJECT_KIND_CASE is an administrative case file (affaire / dossier métier).
             - SUBJECT_KIND_DOCUMENT: SUBJECT_KIND_DOCUMENT is a GED document (DocumentService).
             - SUBJECT_KIND_THING: SUBJECT_KIND_THING is a business or territorial object (parcelle, bâtiment...).
             - SUBJECT_KIND_ACTOR: SUBJECT_KIND_ACTOR is an external person or organization (ActorService);
            never an authenticated operator.
             - SUBJECT_KIND_USER: SUBJECT_KIND_USER is an internal user (app_user), recorded from its token.
             - SUBJECT_KIND_ORG_UNIT: SUBJECT_KIND_ORG_UNIT is an internal organizational unit (OrgUnitService).
             - SUBJECT_KIND_GROUP: SUBJECT_KIND_GROUP is a security group of internal users (AccessService).
          in: query
          required: false
          type: string
          enum:
            - SUBJECT_KIND_UNSPECIFIED
            - SUBJECT_KIND_CASE
            - SUBJECT_KIND_DOCUMENT
            - SUBJECT_KIND_THING
            - SUBJECT_KIND_ACTOR
            - SUBJECT_KIND_USER
            - SUBJECT_KIND_ORG_UNIT
            - SUBJECT_KIND_GROUP
          default: SUBJECT_KIND_UNSPECIFIED
        - name: targetKind
          description: |-
            target_kind restricts the list to one target kind; UNSPECIFIED means any.

             - SUBJECT_KIND_UNSPECIFIED: SUBJECT_KIND_UNSPECIFIED is the zero value; rejected where a kind is required
            and means "any kind" in filters.
             - SUBJECT_KIND_CASE: SUBJECT_KIND_CASE is an administrative case file (affaire / dossier métier).
             - SUBJECT_KIND_DOCUMENT: SUBJECT_KIND_DOCUMENT is a GED document (DocumentService).
             - SUBJECT_KIND_THING: SUBJECT_KIND_THING is a business or territorial object (parcelle, bâtiment...).
             - SUBJECT_KIND_ACTOR: SUBJECT_KIND_ACTOR is an external person or organization (ActorService);
            never an authenticated operator.
             - SUBJECT_KIND_USER: SUBJECT_KIND_USER is an internal user (app_user), recorded from its token.
             - SUBJECT_KIND_ORG_UNIT: SUBJECT_KIND_ORG_UNIT is an internal organizational unit (OrgUnitService).
             - SUBJECT_KIND_GROUP: SUBJECT_KIND_GROUP is a security group of internal users (AccessService).
          in: query
          required: false
          type: string
          enum:
            - SUBJECT_KIND_UNSPECIFIED
            - SUBJECT_KIND_CASE
            - SUBJECT_KIND_DOCUMENT
            - SUBJECT_KIND_THING
            - SUBJECT_KIND_ACTOR
            - SUBJECT_KIND_USER
            - SUBJECT_KIND_ORG_UNIT
            - SUBJECT_KIND_GROUP
          default: SUBJECT_KIND_UNSPECIFIED
      tags:
        - CoreService
    post:
      summary: |-
        Add a relationship type. Requires goeland:admin; logs REFERENCE_CREATED. Fails with
        ALREADY_EXISTS for a taken code.
      operationId: CreateRelationshipType
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1CreateRelationshipTypeResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: body
          description: CreateRelationshipTypeRequest adds a relationship type (administrators only).
          in: body
          required: true
          schema:
            $ref: '#/definitions/v1CreateRelationshipTypeRequest'
      tags:
        - CoreService
