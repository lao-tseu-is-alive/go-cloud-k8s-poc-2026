  /api/task-types/{code}:
    patch:
      summary: Change a task type. Requires goeland:admin; logs REFERENCE_UPDATED.
      operationId: UpdateTaskType
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1UpdateTaskTypeResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: code
          description: code selects the entry to update (its code never changes).
          in: path
          required: true
