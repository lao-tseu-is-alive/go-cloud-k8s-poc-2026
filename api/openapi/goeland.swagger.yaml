  v1CreateThingRequest:
    type: object
    properties:
      thingTypeCode:
        type: string
        description: thing_type_code is the required code of an active thing type.
      name:
        type: string
        description: |-
          name is the thing's name (at most 300 characters); when empty it is derived
          for a parcel ("Parcelle <number>") or a building with an EGID ("Bâtiment EGID <egid>").
      description:
        type: string
        description: description is optional free text (at most 4000 characters).
      externalRef:
        type: string
        description: external_ref is an optional source-system identifier (at most 200 characters).
      geometryGeojson:
        type: string
        description: |-
          geometry_geojson is an optional GeoJSON geometry in EPSG:2056 (LV95)
          coordinates (at most 1 000 000 characters). It must be valid, lie in
          Switzerland (which also rejects WGS84 degrees sent by mistake) and match the
          type: polygonal for a parcel, a point or polygonal for a building.
      parcel:
        $ref: '#/definitions/v1ParcelDetails'
        description: parcel is required for a PARCEL-specialized type.
      building:
        $ref: '#/definitions/v1BuildingDetails'
        description: building is optional for a BUILDING-specialized type.
      metadata:
        type: object
        description: metadata holds secondary data about the thing.
      initialGovernance:
        $ref: '#/definitions/v1RecordMetadata'
        description: |-
          initial_governance optionally sets the owner, confidentiality and records
          fields; the owner defaults to the operator.

          NOTE: the acting operator is derived server-side from the authenticated
          principal (never trusted from the client).
    description: |-
      CreateThingRequest registers a thing. The specialization block must match the
      type's specialization (INVALID_ARGUMENT otherwise).
    required:
      - thingTypeCode
  v1CreateThingResponse:
    type: object
    properties:
      thing:
        $ref: '#/definitions/v1Thing'
        description: thing is the created thing with its governance.
      createdEvent:
        $ref: '#/definitions/v1AuditEvent'
        description: created_event is the THING_CREATED audit event.
    description: CreateThingResponse returns the created thing.
  v1CreateThingTypeRequest:
    type: object
