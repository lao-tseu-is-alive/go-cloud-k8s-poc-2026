        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: documentId
          description: document_id is the document, used as the source of the edge.
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/DocumentServiceLinkDocumentBody'
      tags:
        - DocumentService
  /api/documents/{documentId}/versions:
