  v1ListTaskTypesResponse:
    type: object
    properties:
      taskTypes:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1TaskType'
        description: task_types are the matching types.
    description: ListTaskTypesResponse returns the matching types, by code.
  v1ListThingTypesResponse:
    type: object
    properties:
      thingTypes:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1ThingType'
        description: thing_types are the catalogue entries.
    description: ListThingTypesResponse returns the thing types ordered by code.
  v1ListTimelineEntriesResponse:
    type: object
    properties:
      entries:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1TimelineEntry'
        description: entries are the entries of this page.
      nextPageToken:
        type: string
        description: next_page_token fetches the next page; empty on the last page.
      totalSize:
        type: integer
        format: int32
        description: total_size is the number of matching entries across all pages.
      draftCount:
        type: integer
        format: int32
        description: |-
          draft_count is the number of drafts of the case, whatever the filters (a
          case with drafts cannot be closed).
    description: ListTimelineEntriesResponse is one page of timeline entries.
  v1ListUserRolesResponse:
    type: object
    properties:
      roles:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1UserRole'
        description: roles are the assignments.
    description: ListUserRolesResponse returns the assignments, newest first.
  v1LockTimelineEntryResponse:
    type: object
    properties:
      entry:
        $ref: '#/definitions/v1TimelineEntry'
        description: entry is the locked entry, with its document versions pinned.
      lockEvent:
        $ref: '#/definitions/v1AuditEvent'
        description: lock_event is the TIMELINE_ENTRY_LOCKED audit event.
    description: LockTimelineEntryResponse returns the locked entry.
  v1LookupSubjectsResponse:
    type: object
    properties:
      subjectRefs:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1SubjectRef'
        description: |-
          subject_refs are the matches, oldest first, at most 50 (a namespaced
          reference matches at most one subject).
    description: LookupSubjectsResponse returns the matching subjects.
  v1OrgUnit:
    type: object
    properties:
      subjectRef:
        $ref: '#/definitions/v1SubjectRef'
        description: subject_ref is the embedded canonical identity (kind = ORG_UNIT); its id is the unit id.
      orgUnitType:
        $ref: '#/definitions/v1OrgUnitType'
        description: org_unit_type is the classification of the unit.
      abbreviation:
        type: string
        description: |-
          abbreviation is the unit sigle (e.g. SOI), often shared with the parent
          unit, so not unique; empty when none.
      label:
        type: string
        description: label is the unit name.
      description:
        type: string
        description: description documents the unit's mission.
      email:
        type: string
        description: email is the functional mailbox of the unit; empty when none.
      parentId:
        type: string
        description: parent_id is the parent unit; empty for a root.
      dissolvedAt:
        type: string
        format: date-time
        description: dissolved_at is set when the unit was dissolved.
        readOnly: true
      dissolvedBy:
        type: string
        description: dissolved_by is the operator who dissolved the unit.
      dissolutionReason:
        type: string
        description: dissolution_reason is the justification of the dissolution.
      createdAt:
        type: string
        format: date-time
        description: created_at is the server creation time.
        readOnly: true
      createdBy:
        type: string
        description: created_by is the operator who created the unit.
      updatedAt:
        type: string
        format: date-time
        description: updated_at is the last modification time, maintained by the database.
        readOnly: true
      recordMetadata:
        $ref: '#/definitions/v1RecordMetadata'
        description: record_metadata is the governance record of the unit.
      externalRef:
        type: string
        description: |-
          external_ref is the unit id in a source system (e.g. goeland:1234), unique
          when set and immutable; empty for units created in the POC.
    description: OrgUnit is an organizational unit, 1:1 with SubjectRef (id == subject id).
  v1OrgUnitNode:
    type: object
    properties:
      id:
        type: string
        description: id is the unit (ORG_UNIT subject) UUID.
      abbreviation:
        type: string
        description: abbreviation is the unit sigle (not unique); empty when none.
      label:
        type: string
        description: label is the unit name.
      orgUnitTypeCode:
        type: string
        description: org_unit_type_code is the code of the unit type.
      parentId:
        type: string
        description: parent_id is the parent unit; empty for a root.
      dissolved:
        type: boolean
        description: dissolved reports whether the unit is dissolved.
    description: OrgUnitNode is the light form of a unit used to draw the tree and paths.
  v1OrgUnitType:
    type: object
    properties:
      id:
        type: string
        description: id is the catalogue row UUID.
      code:
        type: string
        description: code is the unique stable key, e.g. SERVICE.
      label:
        type: string
        description: label is the human label.
      description:
        type: string
        description: description documents the business meaning.
      sortOrder:
        type: integer
        format: int32
        description: sort_order orders the types from the top of the hierarchy down.
      isActive:
        type: boolean
        description: is_active reports whether the type is offered for new units.
    description: OrgUnitType is a controlled classification of units (e.g. DIRECTION, SERVICE).
  v1OrganizationCategory:
    type: object
    properties:
      id:
        type: string
        description: id is the catalogue row UUID.
      code:
        type: string
        description: code is the unique stable key (1-100 characters) used by requests and filters.
      label:
        type: string
        description: label is the human label (at most 200 characters).
      isActive:
        type: boolean
        description: is_active reports whether the category is offered for new organizations.
    description: |-
      OrganizationCategory is the controlled classification of a moral person
      (production DicoActMoralCategory: Commerces, Bureau d'architecte, Gérance, ...).
    required:
      - code
  v1OrganizationDetails:
    type: object
    properties:
      legalName:
        type: string
        description: |-
          legal_name is the required legal name as registered in the commercial
          register (RaisonSociale, 1-200 characters), e.g. "Société coopérative Migros
          Vaud"; display_name is the usual name, e.g. "Migros Flon".
      categoryCode:
        type: string
        description: category_code is an OrganizationCategory.code; empty leaves the organization uncategorized.
      complement:
        type: string
        description: |-
          complement is an optional name complement added to the name, such as
          "c/o ...", "Succursale de Nyon" or "Service des parcs" (at most 1000 characters);
          typed channels and identifiers go in contacts.
    description: OrganizationDetails carries the ORGANIZATION-only fields (production ActMoral).
    required:
      - legalName
  v1ParcelDetails:
    type: object
    properties:
      communeOfs:
        type: integer
        format: int32
        description: 'commune_ofs is the federal (OFS) number of the commune, 1-9999 (Lausanne: 5586).'
      parcelNumber:
        type: string
        description: |-
          parcel_number is the parcel number in the commune (1-20 characters); unique
          per commune (ALREADY_EXISTS otherwise).
      egrid:
        type: string
        description: egrid is the federal parcel identifier, "CH" + 12 characters; empty when unknown.
      surfaceM2:
        type: number
        format: double
        description: surface_m2 is the registered surface in square metres; 0 when unknown.
    description: ParcelDetails are the land-register identifiers of a parcel (bien-fonds).
  v1Permission:
    type: string
    enum:
      - PERMISSION_UNSPECIFIED
      - PERMISSION_NONE
      - PERMISSION_READ
      - PERMISSION_CONTRIBUTE
      - PERMISSION_MANAGE
      - PERMISSION_FULL_CONTROL
    default: PERMISSION_UNSPECIFIED
    description: |-
      Permission is the ordered access level of a user on a subject (GLD-048):
      granted per subject to a user, a group or an org unit, the most specific
      grant winning. There is no deny level.

       - PERMISSION_UNSPECIFIED: PERMISSION_UNSPECIFIED is the zero value; never granted.
       - PERMISSION_NONE: PERMISSION_NONE grants no access.
       - PERMISSION_READ: PERMISSION_READ allows reading the subject.
       - PERMISSION_CONTRIBUTE: PERMISSION_CONTRIBUTE adds timeline entries and attaches documents.
       - PERMISSION_MANAGE: PERMISSION_MANAGE edits metadata, relations and participants.
       - PERMISSION_FULL_CONTROL: PERMISSION_FULL_CONTROL closes, logically deletes and changes the owner.
  v1PersonDetails:
    type: object
    properties:
      isChRegister:
        type: boolean
        description: |-
          is_ch_register reports whether the person is linked to the CH population
          register (production Acteur.IsFromCH).
      chRegisterRef:
        type: string
        description: ch_register_ref is an opaque external register key (at most 100 characters); never PII.
      salutation:
        $ref: '#/definitions/v1Salutation'
        description: salutation is the form of address; UNSPECIFIED when unknown.
      lastName:
        type: string
        description: |-
          last_name is the family name (at most 100 characters, trimmed); required when
          creating or editing a person (INVALID_ARGUMENT otherwise).
      firstName:
        type: string
        description: first_name is the given name or names (at most 100 characters); empty when unknown.
    description: |-
      PersonDetails carries the PERSON-only fields: the minimal identity needed to
      identify and address the person (salutation, last and first name), plus the
      link to the CH population register. No birth date, AVS number or other
      civil-registry data is stored.
  v1RecordMetadata:
    type: object
    properties:
      subjectId:
        type: string
        description: |-
          subject_id is server-assigned. When RecordMetadata is used as an input for
          initial governance it is left empty, so the uuid rule is skipped when unset.
      createdAt:
        type: string
        format: date-time
        description: created_at is the server creation time.
        readOnly: true
      createdBy:
        type: string
        description: created_by is the operator who created the subject, or "system" for imports.
      updatedAt:
        type: string
        format: date-time
        description: updated_at is the last governance mutation time; absent until the first update.
        readOnly: true
      updatedBy:
        type: string
        description: updated_by is the operator of the last mutation; empty until then.
      deletedAt:
        type: string
        format: date-time
        description: |-
          deleted_at marks a logical (soft) delete; absent while the subject is live.
          Records are never physically deleted.
        readOnly: true
      deletedBy:
        type: string
        description: deleted_by is the operator who soft-deleted the subject; empty while live.
      ownerUserId:
        type: string
        description: owner_user_id is the owning user; on creation it defaults to the operator.
      ownerOrgId:
        type: string
        description: |-
          owner_org_id is the owning ORG_UNIT subject UUID; empty when unset. On
          creation it must name an existing, not dissolved unit.
      confidentialityLevel:
        type: integer
        format: int32
        description: |-
          confidentiality_level ranges from 0 (public) to 5 (secret); recorded but not
          yet enforced by a permission engine.
      version:
        type: integer
        format: int32
        description: version starts at 1 and is incremented by every governance mutation.
        readOnly: true
      isLocked:
        type: boolean
        description: is_locked is set on formal validation or closure; a locked subject is immutable.
      lockedAt:
        type: string
        format: date-time
        description: locked_at is the lock time; absent while unlocked.
        readOnly: true
      lockedBy:
        type: string
        description: locked_by is the operator who locked the subject; empty while unlocked.
      retentionUntil:
        type: string
        description: |-
          retention_until is an ISO date or a records-management policy reference;
          empty when no retention rule applies.
      sortFinal:
        type: string
        description: |-
          sort_final is the archival disposition: CONSERVER, ELIMINER, ARCHIVER or
          VERSER_SAE; empty when undecided.
      metadata:
        type: object
        additionalProperties:
          type: string
        description: metadata holds secondary governance attributes; never critical fields.
    description: |-
      RecordMetadata is the 1:1 governance record attached to every SubjectRef.
      It implements non-destructive lifecycle, ownership, confidentiality and locking.
      As an input (initial governance) only the owner, confidentiality, retention,
      sort_final and metadata fields are read; the rest is server-managed.
  v1ReferenceChange:
    type: object
    properties:
      id:
        type: string
        description: id is the server-assigned entry UUID.
        readOnly: true
      catalogue:
        type: string
        description: catalogue is case_type, relationship_type, organization_category, document_type, thing_type, org_unit_type or task_type.
        readOnly: true
      code:
        type: string
        description: code is the changed entry's code.
        readOnly: true
      eventType:
        type: string
        description: event_type is REFERENCE_CREATED or REFERENCE_UPDATED.
        readOnly: true
      actorUserId:
        type: string
        description: actor_user_id is the administrator (operator id) who made the change.
        readOnly: true
      occurredAt:
        type: string
        format: date-time
        description: occurred_at is when the change was made.
        readOnly: true
      beforeState:
        type: object
        description: before_state is the entry before an update; absent for a creation.
        readOnly: true
      afterState:
        type: object
        description: after_state is the entry after the change.
        readOnly: true
      reason:
        type: string
        description: reason is the administrator's justification; empty when none was given.
        readOnly: true
    description: |-
      ReferenceChange is one entry of the append-only log of reference data changes
      (case types, relationship types, organization categories, document types).
  v1RelationshipType:
    type: object
    properties:
      id:
        type: string
        description: id is the catalogue row UUID.
      code:
        type: string
        description: |-
          code is the unique stable key (1-100 characters), e.g. CASE_HAS_DOCUMENT,
          DOCUMENT_AUTHORED_BY_ACTOR or DOCUMENT_PREVIOUS_VERSION.
      label:
        type: string
        description: label is the human label read from source to target (at most 200 characters).
      sourceKind:
        $ref: '#/definitions/v1SubjectKind'
        description: source_kind is the required kind of the source subject.
      targetKind:
        $ref: '#/definitions/v1SubjectKind'
        description: target_kind is the required kind of the target subject.
      isDirected:
        type: boolean
        description: is_directed reports whether the edge reads one way only.
      inverseLabel:
        type: string
        description: inverse_label is the human label read from target to source; empty when none.
      description:
        type: string
        description: description documents the business meaning (at most 2000 characters).
      isActive:
        type: boolean
        description: is_active reports whether new links of this type may be created.
    description: |-
      RelationshipType defines an allowed typed relation between two subject kinds.
      Types are seeded reference data; a link is accepted only when the subjects'
      kinds equal source_kind and target_kind.
    required:
      - code
  v1RemoveGroupMemberResponse:
    type: object
    properties:
      auditEvent:
        $ref: '#/definitions/v1AuditEvent'
        description: audit_event is the RELATIONSHIP_ENDED event.
    description: RemoveGroupMemberResponse returns the ended membership event.
  v1ReopenTaskResponse:
    type: object
    properties:
      task:
        $ref: '#/definitions/v1Task'
        description: task is the task, OPEN again.
      statusEvent:
        $ref: '#/definitions/v1AuditEvent'
        description: status_event is the TASK_REOPENED audit event.
    description: ReopenTaskResponse returns the reopened task.
  v1RespondToCirculationResponse:
    type: object
    properties:
      circulation:
        $ref: '#/definitions/v1Circulation'
        description: circulation is the circulation (possibly with its next step open, or completed).
      responseEvent:
        $ref: '#/definitions/v1AuditEvent'
        description: response_event is the CIRCULATION_RESPONDED audit event.
    description: RespondToCirculationResponse returns the circulation after the answer.
  v1RevokeGrantResponse:
    type: object
    properties:
      grant:
        $ref: '#/definitions/v1AccessGrant'
        description: grant is the revoked grant.
      auditEvent:
        $ref: '#/definitions/v1AuditEvent'
        description: audit_event is the ACCESS_REVOKED event on the subject.
    description: RevokeGrantResponse returns the revoked grant and its audit event.
  v1RevokeUserRoleResponse:
    type: object
    properties:
      role:
        $ref: '#/definitions/v1UserRole'
        description: role is the assignment, now revoked.
      auditEvent:
        $ref: '#/definitions/v1AuditEvent'
        description: audit_event is the USER_ROLE_REVOKED event on the user's subject.
    description: RevokeUserRoleResponse returns the revoked assignment and its audit event.
  v1Salutation:
    type: string
    enum:
      - SALUTATION_UNSPECIFIED
      - SALUTATION_MADAME
      - SALUTATION_MONSIEUR
      - SALUTATION_NEUTRAL
    default: SALUTATION_UNSPECIFIED
    description: |-
      Salutation is how a PERSON actor is addressed in correspondence.

       - SALUTATION_UNSPECIFIED: SALUTATION_UNSPECIFIED means not specified (address by name only).
       - SALUTATION_MADAME: SALUTATION_MADAME is "Madame".
       - SALUTATION_MONSIEUR: SALUTATION_MONSIEUR is "Monsieur".
       - SALUTATION_NEUTRAL: SALUTATION_NEUTRAL is a neutral form of address (first and last name, no title).
  v1SearchActorsResponse:
    type: object
    properties:
      actors:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1Actor'
        description: actors are the actors of this page.
      nextPageToken:
        type: string
        description: next_page_token fetches the next page; empty on the last page.
      totalSize:
        type: integer
        format: int32
        description: total_size is the number of matching actors across all pages.
      totalSizeCapped:
        type: boolean
        description: |-
          total_size_capped reports that total_size is a lower bound: counting stops
          at 10000 matches, and so does paging (refine the search to go further).
    description: SearchActorsResponse is one page of matching actors.
  v1SearchCasesResponse:
    type: object
    properties:
      cases:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1Case'
        description: cases are the cases of this page.
      nextPageToken:
        type: string
        description: next_page_token fetches the next page; empty on the last page.
      totalSize:
        type: integer
        format: int32
        description: total_size is the number of matching cases across all pages.
      totalSizeCapped:
        type: boolean
        description: |-
          total_size_capped reports that total_size is a lower bound: counting stops
          at 10000 matches, and so does paging (refine the search to go further).
    description: SearchCasesResponse is one page of matching cases.
  v1SearchDocumentsResponse:
    type: object
    properties:
      documents:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1Document'
        description: documents are the documents of this page.
      nextPageToken:
        type: string
        description: next_page_token fetches the next page; empty on the last page.
      totalSize:
        type: integer
        format: int32
        description: total_size is the number of matching documents across all pages.
      totalSizeCapped:
        type: boolean
        description: |-
          total_size_capped reports that total_size is a lower bound: counting stops
          at 10000 matches, and so does paging (refine the search to go further).
    description: SearchDocumentsResponse is one page of matching documents.
  v1SearchOrgUnitsResponse:
    type: object
    properties:
      units:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1OrgUnit'
        description: units are the units of this page.
      nextPageToken:
        type: string
        description: next_page_token fetches the next page; empty on the last page.
      totalSize:
        type: integer
        format: int32
        description: total_size is the number of matching units across all pages.
    description: SearchOrgUnitsResponse is one page of matching units.
  v1SearchThingsResponse:
    type: object
    properties:
      things:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1Thing'
        description: things is the requested page, newest first.
      nextPageToken:
        type: string
        description: next_page_token fetches the next page; empty on the last page.
      totalSize:
        type: integer
        format: int32
        description: total_size is the number of matches across all pages.
      totalSizeCapped:
        type: boolean
        description: |-
          total_size_capped reports that total_size is a lower bound: counting stops
          at 10000 matches, and so does paging (refine the search to go further).
    description: SearchThingsResponse is one page of search results.
  v1SearchUsersResponse:
    type: object
    properties:
      users:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1User'
        description: users are the matching users.
    description: SearchUsersResponse returns the matching users, ordered by name.
  v1SecurityGroup:
    type: object
    properties:
      subjectRef:
        $ref: '#/definitions/v1SubjectRef'
        description: subject_ref is the group's canonical identity (kind GROUP).
      name:
        type: string
        description: name is the group's name, unique among live groups.
      description:
        type: string
        description: description tells what the group is for.
      archivedAt:
        type: string
        format: date-time
        description: archived_at is when the group was archived; unset while live.
      memberCount:
        type: integer
        format: int32
        description: member_count is the number of current members.
        readOnly: true
    description: |-
      SecurityGroup is a named set of internal users, given grants like a user or a
      unit; a GROUP subject. Archived groups grant nothing.
  v1SetCaseTypeDefaultGrantsResponse:
    type: object
    properties:
      caseType:
        $ref: '#/definitions/v1CaseType'
        description: case_type is the updated entry with its new template.
      change:
        $ref: '#/definitions/v1ReferenceChange'
        description: change is the REFERENCE_UPDATED log entry.
    description: SetCaseTypeDefaultGrantsResponse returns the case type and its log entry.
  v1SetGrantResponse:
    type: object
    properties:
      grant:
        $ref: '#/definitions/v1AccessGrant'
        description: grant is the current grant.
      auditEvent:
        $ref: '#/definitions/v1AuditEvent'
        description: audit_event is the ACCESS_GRANTED or ACCESS_CHANGED event on the subject.
    description: SetGrantResponse returns the current grant and its audit event.
  v1StartTaskResponse:
    type: object
    properties:
      task:
        $ref: '#/definitions/v1Task'
        description: task is the task, IN_PROGRESS.
      statusEvent:
        $ref: '#/definitions/v1AuditEvent'
        description: status_event is the TASK_STARTED audit event.
    description: StartTaskResponse returns the started task.
  v1SubjectKind:
    type: string
    enum:
      - SUBJECT_KIND_UNSPECIFIED
      - SUBJECT_KIND_CASE
      - SUBJECT_KIND_DOCUMENT
      - SUBJECT_KIND_THING
      - SUBJECT_KIND_ACTOR
      - SUBJECT_KIND_USER
      - SUBJECT_KIND_ORG_UNIT
      - SUBJECT_KIND_GROUP
    default: SUBJECT_KIND_UNSPECIFIED
    description: |-
      SubjectKind enumerates the canonical business subjects. Every SubjectRef has exactly one kind.

       - SUBJECT_KIND_UNSPECIFIED: SUBJECT_KIND_UNSPECIFIED is the zero value; rejected where a kind is required
      and means "any kind" in filters.
       - SUBJECT_KIND_CASE: SUBJECT_KIND_CASE is an administrative case file (affaire / dossier métier).
       - SUBJECT_KIND_DOCUMENT: SUBJECT_KIND_DOCUMENT is a GED document (DocumentService).
       - SUBJECT_KIND_THING: SUBJECT_KIND_THING is a business or territorial object (parcelle, bâtiment...).
       - SUBJECT_KIND_ACTOR: SUBJECT_KIND_ACTOR is an external person or organization (ActorService);
      never an authenticated operator.
       - SUBJECT_KIND_USER: SUBJECT_KIND_USER is an internal user (app_user), recorded from its token.
       - SUBJECT_KIND_ORG_UNIT: SUBJECT_KIND_ORG_UNIT is an internal organizational unit (OrgUnitService).
       - SUBJECT_KIND_GROUP: SUBJECT_KIND_GROUP is a security group of internal users (AccessService).
  v1SubjectRef:
    type: object
    properties:
      id:
        type: string
        description: id is the server-assigned UUID shared by the domain entity and its governance record.
      kind:
        $ref: '#/definitions/v1SubjectKind'
        description: kind is the immutable subject kind.
      displayLabel:
        type: string
        description: |-
          display_label is the human label (1-500 characters), kept in sync with the
          domain entity's own label, e.g. a document title.
      canonicalUrl:
        type: string
        description: canonical_url is an optional stable external permalink or URI (at most 2048 characters).
      createdAt:
        type: string
        format: date-time
        description: created_at is the server creation time.
        readOnly: true
      businessRef:
        type: string
        description: |-
          business_ref is the optional human business reference, e.g. 2026-001245;
          empty when none. It is not the identity (id is). Set through
          CreateSubjectRefRequest.business_ref or AssignBusinessRef.
        readOnly: true
      businessRefNamespace:
        type: string
        description: |-
          business_ref_namespace scopes business_ref, e.g. OPC; (namespace,
          business_ref) is unique when the namespace is set. Empty for a free
          (non-unique) reference or no reference.
        readOnly: true
    description: |-
      SubjectRef is the canonical identity of any business subject.
      Every Case, Document, Thing and Actor owns exactly one SubjectRef entry.
    required:
      - displayLabel
  v1SubjectRelationship:
    type: object
    properties:
      id:
        type: string
        description: id is the server-assigned edge UUID.
      source:
        $ref: '#/definitions/v1SubjectRef'
        description: source is the subject the edge starts from.
      target:
        $ref: '#/definitions/v1SubjectRef'
        description: target is the subject the edge points to.
      relationshipType:
        $ref: '#/definitions/v1RelationshipType'
        description: relationship_type is the validated type of the edge.
      roleDetail:
        type: string
        description: |-
          role_detail qualifies the relation in free text (at most 500 characters),
          e.g. "mandataire principal" or "plan de masse v2".
      validFrom:
        type: string
        format: date-time
        description: valid_from is the optional business start of validity.
      validTo:
        type: string
        format: date-time
        description: |-
          valid_to is the business end of validity, set by EndRelationship; absent
          while the edge is open.
      createdAt:
        type: string
        format: date-time
        description: created_at is the server creation time.
        readOnly: true
      createdBy:
        type: string
        description: created_by is the operator who created the edge.
      deletedAt:
        type: string
        format: date-time
        description: deleted_at marks an unlinked (soft-deleted) edge; absent while active.
        readOnly: true
    description: |-
      SubjectRelationship is an actual edge in the business graph: typed, validated, soft-deletable.
      At most one open edge (not unlinked, no valid_to) exists per (source, target, type);
      an ended edge stays as history.
  v1Task:
    type: object
    properties:
      id:
        type: string
        description: id is the task UUID.
      caseId:
        type: string
        description: case_id is the case the task belongs to.
      caseLabel:
        type: string
        description: case_label is the case's display label (with its business reference).
        readOnly: true
      taskType:
        $ref: '#/definitions/v1TaskType'
        description: task_type is the classification of the task.
      title:
        type: string
        description: title is the task title (1-500 characters).
      description:
        type: string
        description: description details the work (at most 4000 characters).
      status:
        $ref: '#/definitions/v1TaskStatus'
        description: status is the lifecycle state.
      origin:
        $ref: '#/definitions/v1TaskOrigin'
        description: origin is what created the task.
      originRef:
        type: string
        description: origin_ref names the creating object (e.g. a circulation id); empty for a manual task.
      assigneeUserId:
        type: string
        description: assignee_user_id is the assigned internal user; empty otherwise.
      assigneeOrgUnitId:
        type: string
        description: assignee_org_unit_id is the assigned org unit; empty otherwise.
      assigneeLabel:
        type: string
        description: assignee_label is the assignee's display name; empty when unassigned.
        readOnly: true
      dueAt:
        type: string
        format: date-time
        description: due_at is the deadline; absent when none.
      overdue:
        type: boolean
        description: overdue reports an open or in-progress task past its deadline.
        readOnly: true
      createdAt:
        type: string
        format: date-time
        description: created_at is the creation time.
        readOnly: true
      createdBy:
        type: string
        description: created_by is the operator who created the task.
      updatedAt:
        type: string
        format: date-time
        description: updated_at is the last change, maintained by the database.
        readOnly: true
      updatedBy:
        type: string
        description: updated_by is the operator of the last change.
      startedAt:
        type: string
        format: date-time
        description: started_at is when the task was (last) started.
        readOnly: true
      startedBy:
        type: string
        description: started_by is the operator who started the task.
      completedAt:
        type: string
        format: date-time
        description: completed_at is set while the task is DONE.
        readOnly: true
      completedBy:
        type: string
        description: completed_by is the operator who completed the task.
      completionNote:
        type: string
        description: completion_note is the note left when completing.
      cancelledAt:
        type: string
        format: date-time
        description: cancelled_at is set while the task is CANCELLED.
        readOnly: true
      cancelledBy:
        type: string
        description: cancelled_by is the operator who cancelled the task.
      cancellationReason:
        type: string
        description: cancellation_reason is the justification of the cancellation.
      assignments:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1TaskAssignment'
        description: assignments is the assignment history, oldest first (GetTask only).
    description: Task is work to do on a case.
  v1TaskAssignment:
    type: object
    properties:
      id:
        type: string
        description: id is the assignment UUID.
      assigneeUserId:
        type: string
        description: assignee_user_id is the assigned internal user; empty when a unit is assigned.
      assigneeOrgUnitId:
        type: string
        description: assignee_org_unit_id is the assigned org unit; empty when a user is assigned.
      assigneeLabel:
        type: string
        description: assignee_label is the assignee's display name.
        readOnly: true
      assignedAt:
        type: string
        format: date-time
        description: assigned_at is when the assignment started.
        readOnly: true
      assignedBy:
        type: string
        description: assigned_by is the operator who assigned the task.
      reason:
        type: string
        description: reason is the justification given for the (re)assignment.
      endedAt:
        type: string
        format: date-time
        description: ended_at is when the assignment ended; absent for the current one.
        readOnly: true
    description: TaskAssignment is one (re)assignment of a task, kept as history.
  v1TaskOrigin:
    type: string
    enum:
      - TASK_ORIGIN_UNSPECIFIED
      - TASK_ORIGIN_MANUAL
      - TASK_ORIGIN_CIRCULATION
      - TASK_ORIGIN_WORKFLOW
      - TASK_ORIGIN_AI
    default: TASK_ORIGIN_UNSPECIFIED
    description: |-
      TaskOrigin is what created a task.

       - TASK_ORIGIN_UNSPECIFIED: TASK_ORIGIN_UNSPECIFIED is the zero value; never stored.
       - TASK_ORIGIN_MANUAL: TASK_ORIGIN_MANUAL is a task created by an operator.
       - TASK_ORIGIN_CIRCULATION: TASK_ORIGIN_CIRCULATION is a task created by a circulation (GLD-013).
       - TASK_ORIGIN_WORKFLOW: TASK_ORIGIN_WORKFLOW is a task created by a workflow (GLD-031).
       - TASK_ORIGIN_AI: TASK_ORIGIN_AI is a task proposed by the AI component and validated (GLD-030).
  v1TaskStatus:
    type: string
    enum:
      - TASK_STATUS_UNSPECIFIED
      - TASK_STATUS_OPEN
      - TASK_STATUS_IN_PROGRESS
      - TASK_STATUS_DONE
      - TASK_STATUS_CANCELLED
    default: TASK_STATUS_UNSPECIFIED
    description: |-
      TaskStatus is the lifecycle state of a task.

       - TASK_STATUS_UNSPECIFIED: TASK_STATUS_UNSPECIFIED is the zero value; never stored, "any status" in filters.
       - TASK_STATUS_OPEN: TASK_STATUS_OPEN is a task to do.
       - TASK_STATUS_IN_PROGRESS: TASK_STATUS_IN_PROGRESS is a task being worked on.
       - TASK_STATUS_DONE: TASK_STATUS_DONE is a completed task.
       - TASK_STATUS_CANCELLED: TASK_STATUS_CANCELLED is a task that will not be done (with a reason).
  v1TaskType:
    type: object
    properties:
      id:
        type: string
        description: id is the catalogue row UUID.
      code:
        type: string
        description: code is the unique stable key.
      label:
        type: string
        description: label is the human label.
      description:
        type: string
        description: description documents the business meaning.
      isActive:
        type: boolean
        description: is_active reports whether the type is offered for new tasks.
    description: TaskType is a controlled classification of tasks (e.g. SITE_VISIT).
  v1Thing:
    type: object
    properties:
      subjectRef:
        $ref: '#/definitions/v1SubjectRef'
        description: subject_ref is the embedded canonical identity (kind = THING); its id is the thing id.
      thingType:
        $ref: '#/definitions/v1ThingType'
        description: thing_type is the classification chosen at creation.
      name:
        type: string
        description: name is the thing's name (1-300 characters), mirrored into the subject label.
      description:
        type: string
        description: description is free text (at most 4000 characters).
      externalRef:
        type: string
        description: external_ref is the identifier in a source system (at most 200 characters).
      geometryGeojson:
        type: string
        description: |-
          geometry_geojson is the geometry as a GeoJSON geometry object in EPSG:2056
          (LV95) coordinates; empty when the thing is not georeferenced.
      areaM2:
        type: number
        format: double
        description: area_m2 is the computed area of a polygonal geometry; 0 otherwise.
        readOnly: true
      anchorE:
        type: number
        format: double
        description: anchor_e is the LV95 east coordinate of a point on the geometry (for maps); 0 without geometry.
        readOnly: true
      anchorN:
        type: number
        format: double
        description: anchor_n is the LV95 north coordinate of that point; 0 without geometry.
        readOnly: true
      parcel:
        $ref: '#/definitions/v1ParcelDetails'
        description: parcel is set for a PARCEL-specialized type.
      building:
        $ref: '#/definitions/v1BuildingDetails'
        description: building is set for a BUILDING-specialized type.
      metadata:
        type: object
        description: metadata holds secondary data about the thing.
      createdAt:
        type: string
        format: date-time
        description: created_at is the server creation time.
        readOnly: true
      createdBy:
        type: string
        description: created_by is the operator who created the thing.
      updatedAt:
        type: string
        format: date-time
        description: updated_at is the last modification time, maintained by the database.
        readOnly: true
      recordMetadata:
        $ref: '#/definitions/v1RecordMetadata'
        description: record_metadata is the governance record (confidentiality, lock, owner...).
    description: Thing is a business object, 1:1 with SubjectRef (id == subject id).
  v1ThingSpecialization:
    type: string
    enum:
      - THING_SPECIALIZATION_UNSPECIFIED
      - THING_SPECIALIZATION_PARCEL
      - THING_SPECIALIZATION_BUILDING
    default: THING_SPECIALIZATION_UNSPECIFIED
    description: |-
      ThingSpecialization selects the detail block of a thing type.

       - THING_SPECIALIZATION_UNSPECIFIED: THING_SPECIALIZATION_UNSPECIFIED is a generic type without detail block
      (street, tree, ...).
       - THING_SPECIALIZATION_PARCEL: THING_SPECIALIZATION_PARCEL carries ParcelDetails; the geometry is polygonal.
       - THING_SPECIALIZATION_BUILDING: THING_SPECIALIZATION_BUILDING carries BuildingDetails; the geometry is a point or polygonal.
  v1ThingType:
    type: object
    properties:
      id:
        type: string
        description: id is the catalogue row UUID.
      code:
        type: string
        description: code is the unique stable key (1-100 characters).
      label:
        type: string
        description: label is the human label (at most 200 characters).
      description:
        type: string
        description: description documents the business meaning (at most 2000 characters).
      specialization:
        $ref: '#/definitions/v1ThingSpecialization'
        description: specialization selects the detail block and constrains the geometry type.
      isActive:
        type: boolean
        description: is_active reports whether new things of this type may be created.
    description: ThingType is a controlled classification of things (PARCEL, BUILDING, STREET, ...).
    required:
      - code
  v1TimelineDocumentLink:
    type: object
    properties:
      id:
        type: string
        description: id is the link UUID.
      documentId:
        type: string
        description: document_id is the linked document (a DOCUMENT subject).
      documentLabel:
        type: string
        description: document_label is the document's display label.
        readOnly: true
      documentVersionId:
        type: string
        description: |-
          document_version_id is the version pinned when the entry was validated or
          locked; empty while the entry is a draft or when the document had no version.
        readOnly: true
      documentVersionNo:
        type: integer
        format: int32
        description: document_version_no is the pinned version number; 0 when none is pinned.
        readOnly: true
      createdAt:
        type: string
        format: date-time
        description: created_at is when the document was linked.
        readOnly: true
      createdBy:
        type: string
        description: created_by is the operator who linked the document.
    description: |-
      TimelineDocumentLink is a document cited by a timeline entry. The link
      targets the logical document; the version current at validation is pinned.
  v1TimelineEntry:
    type: object
    properties:
      id:
        type: string
        description: id is the entry UUID.
      caseId:
        type: string
        description: case_id is the case the entry belongs to.
      entryType:
        $ref: '#/definitions/v1TimelineEntryType'
        description: entry_type is the business nature of the entry.
      status:
        $ref: '#/definitions/v1TimelineEntryStatus'
        description: status is the lifecycle state.
      title:
        type: string
        description: title is an optional headline (at most 500 characters).
      body:
        type: string
        description: body is the content (1-20000 characters).
      visibility:
        $ref: '#/definitions/v1TimelineVisibility'
        description: visibility is the intended audience (not enforced before GLD-017).
      occurredAt:
        type: string
        format: date-time
        description: occurred_at is the business date of the event; the timeline is ordered on it.
      correctsEntryId:
        type: string
        description: corrects_entry_id is the immutable entry this one corrects; empty otherwise.
      correctedByEntryId:
        type: string
        description: |-
          corrected_by_entry_id is the live (not withdrawn) entry correcting this
          one; empty when it is not corrected.
        readOnly: true
      documents:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1TimelineDocumentLink'
        description: documents are the live document links, oldest first.
      createdAt:
        type: string
        format: date-time
        description: created_at is the recording time.
        readOnly: true
      createdBy:
        type: string
        description: created_by is the operator (or "system") who recorded the entry.
      updatedAt:
        type: string
        format: date-time
        description: updated_at is the last draft change; absent when never changed.
        readOnly: true
      updatedBy:
        type: string
        description: updated_by is the operator of the last draft change.
      validatedAt:
        type: string
        format: date-time
        description: validated_at is set when the entry was validated.
        readOnly: true
      validatedBy:
        type: string
        description: validated_by is the operator who validated the entry.
      lockedAt:
        type: string
        format: date-time
        description: locked_at is set when the entry was locked.
        readOnly: true
      lockedBy:
        type: string
        description: locked_by is the operator who locked the entry.
      withdrawnAt:
        type: string
        format: date-time
        description: withdrawn_at is set when the draft was withdrawn.
        readOnly: true
      withdrawnBy:
        type: string
        description: withdrawn_by is the operator who withdrew the draft.
      withdrawalReason:
        type: string
        description: withdrawal_reason is the justification given when withdrawing.
      metadata:
        type: object
        description: |-
          metadata holds secondary structured data; for a SYSTEM entry, the event
          behind it (e.g. {"event":"CASE_STATUS_CHANGED","from":"OPEN","to":"CLOSED"})
          so clients can render it in their language.
        readOnly: true
    description: TimelineEntry is one element of a case timeline.
  v1TimelineEntryStatus:
    type: string
    enum:
      - TIMELINE_ENTRY_STATUS_UNSPECIFIED
      - TIMELINE_ENTRY_STATUS_DRAFT
      - TIMELINE_ENTRY_STATUS_VALIDATED
      - TIMELINE_ENTRY_STATUS_LOCKED
      - TIMELINE_ENTRY_STATUS_WITHDRAWN
    default: TIMELINE_ENTRY_STATUS_UNSPECIFIED
    description: |-
      TimelineEntryStatus is the lifecycle state of a timeline entry. Only a DRAFT
      changes; every other state is immutable.

       - TIMELINE_ENTRY_STATUS_UNSPECIFIED: TIMELINE_ENTRY_STATUS_UNSPECIFIED is the zero value; never stored.
       - TIMELINE_ENTRY_STATUS_DRAFT: TIMELINE_ENTRY_STATUS_DRAFT is an editable entry.
       - TIMELINE_ENTRY_STATUS_VALIDATED: TIMELINE_ENTRY_STATUS_VALIDATED is an entry endorsed by an operator.
       - TIMELINE_ENTRY_STATUS_LOCKED: TIMELINE_ENTRY_STATUS_LOCKED is an entry frozen as is, without endorsement.
       - TIMELINE_ENTRY_STATUS_WITHDRAWN: TIMELINE_ENTRY_STATUS_WITHDRAWN is a draft set aside; kept, hidden by default.
  v1TimelineEntryType:
    type: string
    enum:
      - TIMELINE_ENTRY_TYPE_UNSPECIFIED
      - TIMELINE_ENTRY_TYPE_COMMENT
      - TIMELINE_ENTRY_TYPE_OPINION
      - TIMELINE_ENTRY_TYPE_DECISION
      - TIMELINE_ENTRY_TYPE_REQUEST
      - TIMELINE_ENTRY_TYPE_RESPONSE
      - TIMELINE_ENTRY_TYPE_VALIDATION
      - TIMELINE_ENTRY_TYPE_SYSTEM
      - TIMELINE_ENTRY_TYPE_AI_PROPOSAL
    default: TIMELINE_ENTRY_TYPE_UNSPECIFIED
    description: |-
      TimelineEntryType is the business nature of a timeline entry (v2 §26).

       - TIMELINE_ENTRY_TYPE_UNSPECIFIED: TIMELINE_ENTRY_TYPE_UNSPECIFIED is the zero value; never stored, "any type" in filters.
       - TIMELINE_ENTRY_TYPE_COMMENT: TIMELINE_ENTRY_TYPE_COMMENT is a free follow-up note.
       - TIMELINE_ENTRY_TYPE_OPINION: TIMELINE_ENTRY_TYPE_OPINION is an opinion (préavis) given on the case.
       - TIMELINE_ENTRY_TYPE_DECISION: TIMELINE_ENTRY_TYPE_DECISION is a business decision.
       - TIMELINE_ENTRY_TYPE_REQUEST: TIMELINE_ENTRY_TYPE_REQUEST is a request sent or received (e.g. missing documents).
       - TIMELINE_ENTRY_TYPE_RESPONSE: TIMELINE_ENTRY_TYPE_RESPONSE is a response to a request.
       - TIMELINE_ENTRY_TYPE_VALIDATION: TIMELINE_ENTRY_TYPE_VALIDATION records a business validation act.
       - TIMELINE_ENTRY_TYPE_SYSTEM: TIMELINE_ENTRY_TYPE_SYSTEM is a fact written by the server (e.g. a case
      status change); never created through the API, always locked.
       - TIMELINE_ENTRY_TYPE_AI_PROPOSAL: TIMELINE_ENTRY_TYPE_AI_PROPOSAL is a proposal awaiting human validation;
      reserved for the AI component (GLD-030) and rejected until then.
  v1TimelineVisibility:
    type: string
    enum:
      - TIMELINE_VISIBILITY_UNSPECIFIED
      - TIMELINE_VISIBILITY_CASE_PARTICIPANTS
      - TIMELINE_VISIBILITY_INTERNAL
      - TIMELINE_VISIBILITY_RESTRICTED
    default: TIMELINE_VISIBILITY_UNSPECIFIED
    description: |-
      TimelineVisibility is the intended audience of an entry. It is stored and
      displayed but not enforced until the authorization engine (GLD-017).

       - TIMELINE_VISIBILITY_UNSPECIFIED: TIMELINE_VISIBILITY_UNSPECIFIED is the zero value; CASE_PARTICIPANTS on create.
       - TIMELINE_VISIBILITY_CASE_PARTICIPANTS: TIMELINE_VISIBILITY_CASE_PARTICIPANTS is visible to everyone taking part in the case.
       - TIMELINE_VISIBILITY_INTERNAL: TIMELINE_VISIBILITY_INTERNAL is visible to the administration only.
       - TIMELINE_VISIBILITY_RESTRICTED: TIMELINE_VISIBILITY_RESTRICTED is visible to a restricted circle only.
  v1TransitionCaseResponse:
    type: object
    properties:
      case:
        $ref: '#/definitions/v1Case'
        description: case is the case in its new status.
      transitionEvent:
        $ref: '#/definitions/v1AuditEvent'
        description: transition_event is the CASE_STATUS_CHANGED audit event (before/after status).
    description: TransitionCaseResponse returns the case in its new status.
  v1UnlinkSubjectsResponse:
    type: object
    properties:
      relationshipId:
        type: string
        description: relationship_id is the unlinked edge.
      auditEvent:
        $ref: '#/definitions/v1AuditEvent'
        description: audit_event is the RELATIONSHIP_UNLINKED audit event.
    description: UnlinkSubjectsResponse confirms an unlink.
  v1UnlinkTimelineDocumentResponse:
    type: object
    properties:
      entry:
        $ref: '#/definitions/v1TimelineEntry'
        description: entry is the draft with its remaining documents.
      unlinkEvent:
        $ref: '#/definitions/v1AuditEvent'
        description: unlink_event is the TIMELINE_DOCUMENT_UNLINKED audit event.
    description: UnlinkTimelineDocumentResponse returns the entry without the link.
  v1UpdateActorResponse:
    type: object
    properties:
      actor:
        $ref: '#/definitions/v1Actor'
        description: actor is the updated actor.
      updateEvent:
        $ref: '#/definitions/v1AuditEvent'
        description: update_event is the ACTOR_UPDATED audit event.
    description: UpdateActorResponse returns the updated actor.
  v1UpdateCaseResponse:
    type: object
    properties:
      case:
        $ref: '#/definitions/v1Case'
        description: case is the updated case.
      updateEvent:
        $ref: '#/definitions/v1AuditEvent'
        description: update_event is the CASE_UPDATED audit event.
    description: UpdateCaseResponse returns the updated case.
  v1UpdateCaseTypeResponse:
    type: object
    properties:
      caseType:
        $ref: '#/definitions/v1CaseType'
        description: case_type is the updated entry.
      change:
        $ref: '#/definitions/v1ReferenceChange'
        description: change is the REFERENCE_UPDATED entry of the reference change log.
    description: UpdateCaseTypeResponse returns the updated case type and its log entry.
  v1UpdateDocumentMetadataResponse:
    type: object
    properties:
      document:
        $ref: '#/definitions/v1Document'
        description: document is the updated document.
      updateEvent:
        $ref: '#/definitions/v1AuditEvent'
        description: update_event is the DOCUMENT_METADATA_UPDATED audit event.
    description: UpdateDocumentMetadataResponse returns the updated document.
  v1UpdateDocumentTypeResponse:
    type: object
    properties:
      documentType:
        $ref: '#/definitions/v1DocumentType'
        description: document_type is the updated entry.
      change:
        $ref: '#/definitions/v1ReferenceChange'
        description: change is the REFERENCE_UPDATED entry of the reference change log.
    description: UpdateDocumentTypeResponse returns the updated document type and its log entry.
  v1UpdateGroupResponse:
    type: object
    properties:
      group:
        $ref: '#/definitions/v1SecurityGroup'
        description: group is the updated group.
      auditEvent:
        $ref: '#/definitions/v1AuditEvent'
        description: audit_event is the GROUP_UPDATED event.
    description: UpdateGroupResponse returns the group and its audit event.
  v1UpdateOrgUnitResponse:
    type: object
    properties:
      orgUnit:
        $ref: '#/definitions/v1OrgUnit'
        description: org_unit is the updated unit.
      updateEvent:
        $ref: '#/definitions/v1AuditEvent'
        description: update_event is the ORG_UNIT_UPDATED audit event.
    description: UpdateOrgUnitResponse returns the updated unit.
  v1UpdateOrgUnitTypeResponse:
    type: object
    properties:
      orgUnitType:
        $ref: '#/definitions/v1OrgUnitType'
        description: org_unit_type is the updated entry.
      change:
        $ref: '#/definitions/v1ReferenceChange'
        description: change is the REFERENCE_UPDATED entry of the reference change log.
    description: UpdateOrgUnitTypeResponse returns the updated type and its log entry.
  v1UpdateOrganizationCategoryResponse:
    type: object
    properties:
      organizationCategory:
        $ref: '#/definitions/v1OrganizationCategory'
        description: organization_category is the updated entry.
      change:
        $ref: '#/definitions/v1ReferenceChange'
        description: change is the REFERENCE_UPDATED entry of the reference change log.
    description: UpdateOrganizationCategoryResponse returns the updated organization category and its log entry.
  v1UpdateRelationshipTypeResponse:
    type: object
    properties:
      relationshipType:
        $ref: '#/definitions/v1RelationshipType'
        description: relationship_type is the updated entry.
      change:
        $ref: '#/definitions/v1ReferenceChange'
        description: change is the REFERENCE_UPDATED entry of the reference change log.
    description: UpdateRelationshipTypeResponse returns the updated relationship type and its log entry.
  v1UpdateTaskResponse:
    type: object
    properties:
      task:
        $ref: '#/definitions/v1Task'
        description: task is the updated task.
      updateEvent:
        $ref: '#/definitions/v1AuditEvent'
        description: update_event is the TASK_UPDATED audit event.
    description: UpdateTaskResponse returns the updated task.
  v1UpdateTaskTypeResponse:
    type: object
    properties:
      taskType:
        $ref: '#/definitions/v1TaskType'
        description: task_type is the updated entry.
      change:
        $ref: '#/definitions/v1ReferenceChange'
        description: change is the REFERENCE_UPDATED entry of the reference change log.
    description: UpdateTaskTypeResponse returns the updated type and its log entry.
  v1UpdateThingResponse:
    type: object
    properties:
      thing:
        $ref: '#/definitions/v1Thing'
        description: thing is the updated thing.
      updateEvent:
        $ref: '#/definitions/v1AuditEvent'
        description: update_event is the THING_UPDATED audit event.
    description: UpdateThingResponse returns the updated thing.
  v1UpdateThingTypeResponse:
    type: object
    properties:
      thingType:
        $ref: '#/definitions/v1ThingType'
        description: thing_type is the updated entry.
      change:
        $ref: '#/definitions/v1ReferenceChange'
        description: change is the REFERENCE_UPDATED entry of the reference change log.
    description: UpdateThingTypeResponse returns the updated thing type and its log entry.
  v1UpdateTimelineEntryResponse:
    type: object
    properties:
      entry:
        $ref: '#/definitions/v1TimelineEntry'
        description: entry is the updated draft.
      updateEvent:
        $ref: '#/definitions/v1AuditEvent'
        description: update_event is the TIMELINE_ENTRY_UPDATED audit event.
    description: UpdateTimelineEntryResponse returns the updated draft.
  v1User:
    type: object
    properties:
      id:
        type: string
        description: id is the operator id stored in governance and audit fields.
        readOnly: true
      subjectId:
        type: string
        description: subject_id is the user's USER subject.
        readOnly: true
      displayName:
        type: string
        description: display_name is the human name from the token; empty when it carried none.
        readOnly: true
      email:
        type: string
        description: email is the e-mail address from the token; empty when it carried none.
        readOnly: true
      isAdmin:
        type: boolean
        description: |-
          is_admin reports whether the user currently holds the ADMIN application
          role (the goeland:admin scope); the token never decides it.
        readOnly: true
      firstSeenAt:
        type: string
        format: date-time
        description: first_seen_at is when the user was first recorded.
        readOnly: true
      lastSeenAt:
        type: string
        format: date-time
        description: last_seen_at is when the user was last recorded.
        readOnly: true
      roles:
        type: array
        items:
          type: string
        description: roles are the codes of the application roles the user currently holds, sorted.
        readOnly: true
    description: |-
      User is an internal, authenticated user (an employee), recorded from its
      verified token; never an external ACTOR. Governance and audit fields that
      hold an operator id (created_by, actor_user_id, ...) refer to User.id.
  v1UserRole:
    type: object
    properties:
      id:
        type: string
        description: id identifies the assignment.
      userId:
        type: string
        description: user_id is the internal user (User.id).
      roleCode:
        type: string
        description: role_code is the assigned role.
      grantedAt:
        type: string
        format: date-time
        description: granted_at is when the role was granted.
      grantedBy:
        type: string
        description: |-
          granted_by is the operator who granted it, or "system:bootstrap" /
          "system:migration".
      grantReason:
        type: string
        description: grant_reason explains the grant.
      revokedAt:
        type: string
        format: date-time
        description: revoked_at is when the role was revoked; unset while it is held.
      revokedBy:
        type: string
        description: revoked_by is the operator who revoked it; empty while it is held.
      revokeReason:
        type: string
        description: revoke_reason explains the revocation.
    description: |-
      UserRole is one assignment of a role to a user; a revoked assignment is kept
      as history.
  v1ValidateTimelineEntryResponse:
    type: object
    properties:
      entry:
        $ref: '#/definitions/v1TimelineEntry'
        description: entry is the validated entry, with its document versions pinned.
      validateEvent:
        $ref: '#/definitions/v1AuditEvent'
        description: validate_event is the TIMELINE_ENTRY_VALIDATED audit event.
    description: ValidateTimelineEntryResponse returns the validated entry.
  v1VerifyDocumentIntegrityResponse:
    type: object
    properties:
      verified:
        type: boolean
        description: |-
          verified is true only when expected_sha256 and the registered hash are both
          non-empty and equal (case-insensitive).
      actualSha256:
        type: string
        description: actual_sha256 is the hash of the current version's content; empty without content.
      verifiedAt:
        type: string
        format: date-time
        description: verified_at is the content's last probative verification time; currently never set.
      storageRefChecked:
        type: string
        description: |-
          storage_ref_checked is the storage reference whose bytes were hashed;
          always empty because no bytes are read yet.
    description: VerifyDocumentIntegrityResponse reports the non-probative hash comparison.
  v1WithdrawTimelineEntryResponse:
    type: object
    properties:
      entry:
        $ref: '#/definitions/v1TimelineEntry'
        description: entry is the withdrawn entry.
      withdrawEvent:
        $ref: '#/definitions/v1AuditEvent'
        description: withdraw_event is the TIMELINE_ENTRY_WITHDRAWN audit event.
    description: WithdrawTimelineEntryResponse returns the withdrawn entry.
