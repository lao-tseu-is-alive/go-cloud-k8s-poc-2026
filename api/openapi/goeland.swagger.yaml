        - name: pageSize
          description: page_size is the page length; 0 means the default (25), at most 200.
          in: query
          required: false
          type: integer
          format: int32
        - name: pageToken
          description: page_token is the next_page_token of the previous page; empty for the first page.
          in: query
          required: false
          type: string
      tags:
        - CoreService
  /api/subjects:lookup:
