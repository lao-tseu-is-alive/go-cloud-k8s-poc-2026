version: v2
plugins:
  # Generators are pinned (GLD-008): the Go ones run as go.mod tools at the
  # versions of the modules the code uses, the remote one by version, so
  # `make generated-check` can require the committed output to be reproducible.
  # 1. Generate Go code (protobuf messages + enums)
  - local: ["go", "tool", "protoc-gen-go"]
    out: gen
    opt: paths=source_relative

  # 2. Generate ConnectRPC code (Go service interfaces + clients, used with Vanguard)
  - local: ["go", "tool", "protoc-gen-connect-go"]
    out: gen
    opt:
      - paths=source_relative

  # 3. Generate OpenAPI v2 (Swagger) from the google.api.http annotations.
  # Vanguard serves those same REST bindings, so this documents the real REST surface.
  - remote: buf.build/grpc-ecosystem/openapiv2:v2.31.0
    out: api/openapi
    opt:
      - json_names_for_fields=true # camelCase JSON field names
      - output_format=yaml
      - allow_merge=true
      - merge_file_name=goeland
      - simple_operation_ids=true

  # 4. Generate TypeScript with proto3-JSON types for the SPA contract check only
  # (GLD-072): src/api/typesContract.ts compares the hand-written src/api/types.ts
  # with the *Json types; nothing imports them at runtime. Keep the version equal
  # to @bufbuild/protobuf in goeland-front/package.json (checked by Vitest).
  - remote: buf.build/bufbuild/es:v2.16.0
    out: cmd/goeland-server/goeland-front/src/api/gen
    include_imports: true
    opt:
      - target=ts
      - json_types=true
      - import_extension=none

managed:
  enabled: true
  disable:
    - file_option: go_package_prefix
      module: buf.build/googleapis/googleapis
    - file_option: go_package_prefix
      module: buf.build/bufbuild/protovalidate
  override:
    - file_option: go_package_prefix
      value: github.com/lao-tseu-is-alive/go-cloud-k8s-poc-2026/gen
