# Disposable PostGIS for the smoke deployment: data lives in an emptyDir and is
# lost with the pod. Its passwords come from the goeland-secrets Secret, created
# by scripts/k8s_smoke_test.sh (never committed). Two roles (GLD-046): goeland
# owns the schema and runs the migrations (the goeland init container);
# goeland_app, created by the init script below, is the server's runtime role,
# granted only row privileges by `goeland-server migrate`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgis-init
  namespace: goeland-poc
  labels:
    app.kubernetes.io/name: postgis
    app.kubernetes.io/part-of: goeland-poc
data:
  10-goeland-app-role.sh: |
    #!/bin/sh
    # Runs once at database initialization: the runtime login role, no other privilege.
    set -eu
    psql -v ON_ERROR_STOP=1 -v pw="$APP_DB_PASSWORD" --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<'EOSQL'
    CREATE ROLE goeland_app LOGIN PASSWORD :'pw';
    EOSQL
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgis
  namespace: goeland-poc
  labels:
    app.kubernetes.io/name: postgis
    app.kubernetes.io/part-of: goeland-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgis
        app.kubernetes.io/part-of: goeland-poc
    spec:
      # PostgreSQL never calls the Kubernetes API: no service account token in the pod.
      automountServiceAccountToken: false
      containers:
        - name: postgis
          image: postgis/postgis:17-3.5@sha256:01a6a70e41e6c4467c8f55f6063555ed72db2d6662cd0d571040d42eadaeb6f6
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: goeland
            - name: POSTGRES_USER
              value: goeland
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: goeland-secrets
                  key: DB_PASSWORD
            - name: APP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: goeland-secrets
                  key: DB_APP_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "goeland", "-d", "goeland"]
            periodSeconds: 5
          resources:
            # ephemeral-storage covers the emptyDir data volume of this smoke-test database.
            requests: { cpu: 100m, memory: 128Mi, ephemeral-storage: 256Mi }
            limits: { cpu: "1", memory: 512Mi, ephemeral-storage: 2Gi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        - name: init
          configMap:
            name: postgis-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgis
  namespace: goeland-poc
  labels:
    app.kubernetes.io/name: postgis
    app.kubernetes.io/part-of: goeland-poc
spec:
  selector:
    app.kubernetes.io/name: postgis
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
