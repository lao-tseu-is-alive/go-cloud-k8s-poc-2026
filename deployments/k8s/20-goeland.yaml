# The Goéland server for the smoke deployment, following
# docs/PRODUCTION_READINESS.md: non-secret settings in a ConfigMap, secrets in
# the goeland-secrets Secret (created by scripts/k8s_smoke_test.sh), probes on
# /health and /readiness, one replica because blob storage is node-local.
# Migrations run in an init container as the schema owner (goeland); the server
# runs as goeland_app, limited to rows, and only checks the schema (GLD-046).
# Dev auth mode: a smoke test only, never production.
apiVersion: v1
kind: ConfigMap
metadata:
  name: goeland-config
  namespace: goeland-poc
  labels:
    app.kubernetes.io/name: goeland
    app.kubernetes.io/part-of: goeland-poc
data:
  GOELAND_LISTEN_ADDRESS: "0.0.0.0:8080"
  # Prometheus metrics on their own port, not exposed by the Service (GLD-010).
  GOELAND_METRICS_ADDRESS: "0.0.0.0:9464"
  GOELAND_AUTH_MODE: "dev"
  GOELAND_DEV_USER_ID: "1"
  GOELAND_DEV_USER_EMAIL: "smoke@goeland.test"
  GOELAND_DEV_USER_NAME: "Smoke Test"
  GOELAND_DEV_USER_ADMIN: "true"
  DB_HOST: "postgis"
  DB_PORT: "5432"
  DB_NAME: "goeland"
  DB_USER: "goeland"
  DB_SSL_MODE: "disable"
  GOELAND_DB_MAX_CONNECTIONS: "10"
  # The server never migrates; the migrate init container grants this role (GLD-046).
  GOELAND_DB_MIGRATE: "verify"
  GOELAND_DB_APP_ROLE: "goeland_app"
  GOELAND_DOCUMENT_PATH: "/data/documents"
  # Eliminations only simulated: set "true" only after the archives validated the
  # schedule and the simulations (docs/RETENTION.md §5c). Destroying is irreversible.
  GOELAND_DISPOSAL_ENABLED: "false"
  LOG_LEVEL: "info"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: goeland
  namespace: goeland-poc
  labels:
    app.kubernetes.io/name: goeland
    app.kubernetes.io/part-of: goeland-poc
spec:
  replicas: 1
  strategy:
    type: Recreate # node-local blob storage: never two writers
  selector:
    matchLabels:
      app.kubernetes.io/name: goeland
  template:
    metadata:
      labels:
        app.kubernetes.io/name: goeland
        app.kubernetes.io/part-of: goeland-poc
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1221
        runAsGroup: 1221
        fsGroup: 1221
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 20
      initContainers:
        # Applies the migrations as the schema owner, grants goeland_app, exits.
        - name: migrate
          image: ghcr.io/lao-tseu-is-alive/go-cloud-k8s-poc-2026:0.21.1
          imagePullPolicy: IfNotPresent
          command: ["./goeland-server", "migrate"]
          envFrom:
            - configMapRef:
                name: goeland-config
            - secretRef:
                name: goeland-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 500m, memory: 128Mi }
      containers:
        - name: goeland
          image: ghcr.io/lao-tseu-is-alive/go-cloud-k8s-poc-2026:0.21.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9464
              name: metrics
          envFrom:
            - configMapRef:
                name: goeland-config
            - secretRef:
                name: goeland-secrets
          env:
            # The runtime role, not the schema owner of the ConfigMap and Secret.
            - name: DB_USER
              value: goeland_app
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: goeland-secrets
                  key: DB_APP_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # The schema check runs before the listener binds.
          readinessProbe:
            httpGet: { path: /readiness, port: http }
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            # ephemeral-storage covers the emptyDir document volume (uploads, case exports).
            requests: { cpu: 50m, memory: 64Mi, ephemeral-storage: 128Mi }
            limits: { cpu: 500m, memory: 256Mi, ephemeral-storage: 1Gi }
          volumeMounts:
            - name: documents
              mountPath: /data/documents
      volumes:
        - name: documents
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: goeland
  namespace: goeland-poc
  labels:
    app.kubernetes.io/name: goeland
    app.kubernetes.io/part-of: goeland-poc
spec:
  selector:
    app.kubernetes.io/name: goeland
  ports:
    - name: http
      port: 80
      targetPort: http
