// Goéland POC - Document component (modern GED slice).
//
// Proto-first definition for DocumentService + supporting messages.
// This component implements a first-class, probative, relational document entity
// that can live standalone or be embedded in affaires (via CoreService relationships).
//
// Modern GED features added beyond the basic model:
//   - Document / DocumentVersion / ContentBlob (spec v2 §15-22): the document is the
//     logical business object, a version a dated state of it, the blob the binary
//     content identified by its SHA-256. Identical content is stored once; creating a
//     document for content already held by a live document reuses that document.
//   - Cryptographic integrity metadata (server-computed SHA-256). NOTE:
//     VerifyDocumentIntegrity currently performs a non-probative stored-hash
//     comparison only (it does not read storage bytes); real streamed hashing is GLD-021.
//   - External reference without duplication (external_system + external_id + external_url)
//     for interop with Alfresco / SharePoint / legacy Goéland.
//   - Records management preparation (per-version is_record / is_final, lock via record_metadata).
//   - Full-text search ready (dedicated SearchDocuments RPC over a generated tsvector).
//   - Classification (document_type + metadata).
//   - Non-destructive, auditable, confidential by default via Core + record_metadata.
//
// Binary bytes never travel through this contract: POST /api/documents/upload stores
// them, computes the digest server-side and returns a content_blob_id that
// CreateDocument / AddDocumentVersion reference.
//
// Minimal scenario: create DOCUMENT, link to CASE (CASE_HAS_DOCUMENT),
// link to THING (DOCUMENT_REPRESENTS_THING), then finalize/lock.

syntax = "proto3";

package goeland.v1;

import "buf/validate/validate.proto";
import "goeland/v1/core.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/lao-tseu-is-alive/go-cloud-k8s-poc-2026/gen/goeland/v1;goelandv1";

// =============================================
// DOCUMENT SPECIFIC ENUMS / MESSAGES
// =============================================

// DocumentStatus is the lifecycle state of a document.
enum DocumentStatus {
  // DOCUMENT_STATUS_UNSPECIFIED is the zero value; never stored.
  DOCUMENT_STATUS_UNSPECIFIED = 0;
  // DOCUMENT_STATUS_DRAFT is the initial, editable state.
  DOCUMENT_STATUS_DRAFT = 1;
  // DOCUMENT_STATUS_FINAL marks a finalized document (is_final = true).
  DOCUMENT_STATUS_FINAL = 2;
  // DOCUMENT_STATUS_SUPERSEDED marks a document replaced by a newer version.
  DOCUMENT_STATUS_SUPERSEDED = 3;
  // DOCUMENT_STATUS_ARCHIVED marks a document handed over to archiving.
  DOCUMENT_STATUS_ARCHIVED = 4;
}

// DocumentType is a controlled classification (behavior + category).
// Types are seeded reference data; a document's type is fixed at creation.
message DocumentType {
  // id is the catalogue row UUID.
  string id = 1 [(buf.validate.field).string.uuid = true];
  // code is the unique stable key (1-100 characters), e.g. PLAN,
  // INCOMING_LETTER or DECISION.
  string code = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 100
  ];
  // label is the human label (at most 200 characters).
  string label = 3 [(buf.validate.field).string.max_len = 200];
  // description documents the business meaning (at most 2000 characters).
  string description = 4 [(buf.validate.field).string.max_len = 2000];
  // category groups types: ENTREE, SORTIE, PLAN, DECISION, JUSTIFICATIF...;
  // empty when uncategorized.
  string category = 5 [(buf.validate.field).string.max_len = 100];
  // is_active reports whether the type is offered for new documents.
  bool is_active = 6;
}

// ContentBlob is binary content identified by its SHA-256; identical bytes are
// stored once and may back several versions (spec v2 §17, §19).
message ContentBlob {
  // id is the blob UUID returned by the upload endpoint.
  string id = 1 [(buf.validate.field).string.uuid = true];
  // sha256 is the lower-case hex digest computed by the server; unique.
  string sha256 = 2;
  // storage_ref is the URI of the bytes (internal://...); empty when the bytes
  // are held by an external system and only the digest is known.
  string storage_ref = 3;
  // mime_type is the media type of the bytes; empty when unknown.
  string mime_type = 4;
  // file_size_bytes is the size of the bytes. Serialized as a JSON string (int64).
  int64 file_size_bytes = 5;
  // created_at is when the content was first stored.
  google.protobuf.Timestamp created_at = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  // created_by is the operator whose upload first stored the content.
  string created_by = 7;
  // verified_at is the last probative re-verification of the bytes; currently never set (GLD-021).
  google.protobuf.Timestamp verified_at = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// DocumentVersion is a dated, append-only state of a document (spec v2 §18). A
// final or record version is immutable; versions are never deleted.
message DocumentVersion {
  // id is the version UUID.
  string id = 1 [(buf.validate.field).string.uuid = true];
  // document_id is the owning document.
  string document_id = 2 [(buf.validate.field).string.uuid = true];
  // version_no numbers the versions of one document from 1, without gaps.
  int32 version_no = 3;
  // content is the binary content; absent for a metadata-only version or an
  // external reference.
  ContentBlob content = 4;
  // page_count is the number of pages; 0 when unknown.
  int32 page_count = 5;
  // is_final reports a validated, business-final version (then immutable).
  bool is_final = 6;
  // is_record declares a record for retention / records management; a record is always final.
  bool is_record = 7;
  // validated_at is when the version became final; absent while mutable.
  google.protobuf.Timestamp validated_at = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  // validated_by is the operator who made the version final.
  string validated_by = 9;
  // metadata holds secondary data about this version.
  google.protobuf.Struct metadata = 10;
  // created_at is the server creation time.
  google.protobuf.Timestamp created_at = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
  // created_by is the operator who added the version.
  string created_by = 12;
}

// Document is the logical business document, 1:1 with SubjectRef (id == subject
// id); its content lives in versions. External references (Alfresco node, legacy,
// SharePoint) stay document-level.
message Document {
  reserved 6, 10, 11, 12, 13, 14, 15, 16, 17, 19;
  reserved "storage_ref", "mime_type", "file_size_bytes", "sha256", "sha256_verified_at", "version", "previous_version_id", "is_final", "is_record", "page_count";

  // subject_ref is the embedded canonical identity (kind = DOCUMENT); its id is the document id.
  SubjectRef subject_ref = 1;
  // document_type is the classification chosen at creation.
  DocumentType document_type = 2;
  // title is the document title (1-500 characters), mirrored into the subject label.
  string title = 3 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 500
  ];
  // description is free text (at most 4000 characters).
  string description = 4 [(buf.validate.field).string.max_len = 4000];
  // official_date is the legal probative date of the document itself, as
  // YYYY-MM-DD; empty when unknown.
  string official_date = 5;
  // external_system names the system of record: alfresco, minio, sharepoint
  // or goeland-legacy; empty when internal.
  string external_system = 7 [(buf.validate.field).string.max_len = 100];
  // external_id is the authoritative id in external_system (prevents duplication).
  string external_id = 8 [(buf.validate.field).string.max_len = 200];
  // external_url is a clickable link to the external document, if available.
  string external_url = 9 [(buf.validate.field).string.max_len = 2048];
  // language is the ISO 639 content language, e.g. "fr" or "de" (at most 10
  // characters); unrelated to the UI locale.
  string language = 18 [(buf.validate.field).string.max_len = 10];
  // status is the lifecycle state; FINAL when the current version is final.
  DocumentStatus status = 20;
  // metadata holds secondary data: classification, keywords, extracted entities...
  google.protobuf.Struct metadata = 21;
  // created_at is the server creation time.
  google.protobuf.Timestamp created_at = 22 [(google.api.field_behavior) = OUTPUT_ONLY];
  // created_by is the operator who created the document.
  string created_by = 23;
  // updated_at is the last modification time, maintained by the database.
  google.protobuf.Timestamp updated_at = 24 [(google.api.field_behavior) = OUTPUT_ONLY];
  // record_metadata is the governance record (confidentiality, lock, owner...).
  RecordMetadata record_metadata = 25;
  // current_version is the explicit current version, with its content.
  DocumentVersion current_version = 26 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// CreateDocumentRequest registers a document (metadata first; the bytes are
// uploaded beforehand and referenced by content_blob_id). When the content is
// already held by a live document, that document is reused instead (see
// CreateDocumentResponse.reused).
message CreateDocumentRequest {
  reserved 5, 9, 10, 11, 12, 13;
  reserved "storage_ref", "mime_type", "file_size_bytes", "sha256", "version", "previous_version_id";

  // document_type_code is the required code of an existing document type.
  string document_type_code = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 100
  ];
  // title is the required title (1-500 characters); surrounding whitespace is trimmed.
  string title = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 500
  ];
  // description is optional free text (at most 4000 characters).
  string description = 3 [(buf.validate.field).string.max_len = 4000];
  // official_date is the optional legal date as YYYY-MM-DD.
  string official_date = 4;
  // external_system names the external system of record, if any.
  string external_system = 6 [(buf.validate.field).string.max_len = 100];
  // external_id identifies the document inside external_system.
  string external_id = 7 [(buf.validate.field).string.max_len = 200];
  // external_url links to the external document; it becomes the subject's canonical URL.
  string external_url = 8 [(buf.validate.field).string.max_len = 2048];
  // is_final creates version 1 already final (document status FINAL).
  bool is_final = 14;
  // is_record declares version 1 a record, which also makes it final.
  bool is_record = 15;
  // language is the ISO 639 content language.
  string language = 16 [(buf.validate.field).string.max_len = 10];
  // page_count is the number of pages of version 1.
  int32 page_count = 17 [(buf.validate.field).int32.gte = 0];
  // metadata holds secondary extension data.
  google.protobuf.Struct metadata = 18;
  // initial_governance optionally sets the owner, confidentiality and records
  // fields; the owner defaults to the operator.
  //
  // NOTE: the acting operator is derived server-side from the authenticated
  // principal (never trusted from the client). A document's AUTHOR is a separate,
  // external ACTOR subject linked via DOCUMENT_AUTHORED_BY_ACTOR — not this operator.
  RecordMetadata initial_governance = 20;
  // link_to_case_id is an optional convenience: link the new (or reused)
  // document to this case with CASE_HAS_DOCUMENT in the same transaction.
  string link_to_case_id = 21;
  // content_blob_id is the content returned by POST /api/documents/upload;
  // empty for a metadata-only document or an external reference. NOT_FOUND
  // when unknown.
  string content_blob_id = 22 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
}

// CreateDocumentResponse returns the created (or reused) document and its side effects.
message CreateDocumentResponse {
  // document is the created document, or the reused one when reused is true.
  Document document = 1;
  // created_event is DOCUMENT_CREATED, or DOCUMENT_REUSED on the existing document.
  AuditEvent created_event = 2;
  // initial_relationship is the CASE_HAS_DOCUMENT edge; set only when
  // link_to_case_id was provided and the link did not already exist.
  optional SubjectRelationship initial_relationship = 3;
  // reused is true when the content was already held by a live document, which
  // was reused (no new document; the request's title and metadata are ignored).
  bool reused = 4;
}

// AddDocumentVersionRequest appends a new current version to a document.
message AddDocumentVersionRequest {
  // document_id is the document; a locked or deleted document is rejected.
  string document_id = 1 [(buf.validate.field).string.uuid = true];
  // content_blob_id is the content from POST /api/documents/upload; empty for a
  // metadata-only version. It may repeat an earlier version's content.
  string content_blob_id = 2 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  // is_final creates the version already final.
  bool is_final = 3;
  // is_record declares the version a record, which also makes it final.
  bool is_record = 4;
  // page_count is the number of pages.
  int32 page_count = 5 [(buf.validate.field).int32.gte = 0];
  // metadata holds secondary data about the version.
  google.protobuf.Struct metadata = 6;
  // reason is the justification recorded on the audit event (at most 2000 characters).
  string reason = 7 [(buf.validate.field).string.max_len = 2000];
}

// AddDocumentVersionResponse returns the document with its new current version.
message AddDocumentVersionResponse {
  // document is the document; its current_version is the new version.
  Document document = 1;
  // version is the new version.
  DocumentVersion version = 2;
  // audit_event is the DOCUMENT_VERSION_ADDED audit event.
  AuditEvent audit_event = 3;
}

// ListDocumentVersionsRequest lists the versions of a document.
message ListDocumentVersionsRequest {
  // document_id is the document; NOT_FOUND when unknown.
  string document_id = 1 [(buf.validate.field).string.uuid = true];
}

// ListDocumentVersionsResponse returns every version, newest first.
message ListDocumentVersionsResponse {
  // versions are the versions with their content, newest first.
  repeated DocumentVersion versions = 1;
}

// GetDocumentRequest reads one document with optional context.
message GetDocumentRequest {
  // id is the document (subject_ref) UUID.
  string id = 1 [(buf.validate.field).string.uuid = true];
  // include_relationships also returns the document's OUTGOING relationships
  // (to things, actors, previous versions). CASE_HAS_DOCUMENT edges point into
  // the document: list them with CoreService.ListRelationships(outgoing=false).
  bool include_relationships = 2;
  // include_audit also returns the 20 most recent audit events.
  bool include_audit = 3;
}

// GetDocumentResponse returns a document and the requested context.
message GetDocumentResponse {
  // document is the document with its governance.
  Document document = 1;
  // relationships are the outgoing edges; empty unless include_relationships was set.
  repeated SubjectRelationship relationships = 2;
  // recent_audit holds the latest audit events, newest first; empty unless include_audit was set.
  repeated AuditEvent recent_audit = 3;
}

// UpdateDocumentMetadataRequest updates only mutable metadata. Blocked if the record is locked.
// Every field replaces the stored value (no partial merge).
message UpdateDocumentMetadataRequest {
  // id is the document UUID.
  string id = 1 [(buf.validate.field).string.uuid = true];
  // title is the new required title (1-500 characters).
  string title = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 500
  ];
  // description replaces the description (at most 4000 characters).
  string description = 3 [(buf.validate.field).string.max_len = 4000];
  // official_date replaces the legal date (YYYY-MM-DD); empty clears it.
  string official_date = 4;
  // language replaces the content language.
  string language = 5 [(buf.validate.field).string.max_len = 10];
  // metadata replaces the whole extension map.
  google.protobuf.Struct metadata = 6;
  // reason is the justification recorded on the audit event (at most 2000 characters).
  string reason = 8 [(buf.validate.field).string.max_len = 2000];
}

// UpdateDocumentMetadataResponse returns the updated document.
message UpdateDocumentMetadataResponse {
  // document is the updated document.
  Document document = 1;
  // update_event is the DOCUMENT_METADATA_UPDATED audit event.
  AuditEvent update_event = 2;
}

// FinalizeDocumentRequest marks a document final and optionally locks its governance record (immutable).
message FinalizeDocumentRequest {
  // id is the document UUID; a locked or deleted document is rejected.
  string id = 1 [(buf.validate.field).string.uuid = true];
  // reason is the justification recorded on the audit event (at most 2000 characters).
  string reason = 3 [(buf.validate.field).string.max_len = 2000];
  // also_lock_governance also sets record_metadata.is_locked, making the document immutable.
  bool also_lock_governance = 4;
}

// FinalizeDocumentResponse returns the finalized document.
message FinalizeDocumentResponse {
  // document is the finalized document.
  Document document = 1;
  // finalize_event is the DOCUMENT_FINALIZED audit event.
  AuditEvent finalize_event = 2;
}

// VerifyDocumentIntegrityRequest compares a caller's hash with the registered one.
message VerifyDocumentIntegrityRequest {
  // id is the document UUID.
  string id = 1 [(buf.validate.field).string.uuid = true];
  // expected_sha256 is the caller's hex digest; empty never verifies.
  string expected_sha256 = 2 [(buf.validate.field).string.pattern = "^$|^[a-fA-F0-9]{64}$"];
}

// VerifyDocumentIntegrityResponse reports the non-probative hash comparison.
message VerifyDocumentIntegrityResponse {
  // verified is true only when expected_sha256 and the registered hash are both
  // non-empty and equal (case-insensitive).
  bool verified = 1;
  // actual_sha256 is the hash of the current version's content; empty without content.
  string actual_sha256 = 2;
  // verified_at is the content's last probative verification time; currently never set.
  google.protobuf.Timestamp verified_at = 3;
  // storage_ref_checked is the storage reference whose bytes were hashed;
  // always empty because no bytes are read yet.
  string storage_ref_checked = 4;
}

// SearchDocumentsRequest performs full-text search + filters (modern GED must-have).
// Results are newest first.
message SearchDocumentsRequest {
  // query is plain text matched accent-insensitively against title and
  // description (at most 500 characters); empty matches every document.
  string query = 1 [(buf.validate.field).string.max_len = 500];
  // document_type_code restricts results to one type; empty means any.
  string document_type_code = 2 [(buf.validate.field).string.max_len = 100];
  // case_id restricts results to documents linked from that case by CASE_HAS_DOCUMENT.
  string case_id = 3;
  // thing_id restricts results to documents with an outgoing link to that thing.
  string thing_id = 4;
  // confidentiality_max is the inclusive upper bound on the confidentiality
  // level; 0 means no cap.
  int32 confidentiality_max = 5 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lte = 5
  ];
  // only_records restricts results to declared records.
  bool only_records = 6;
  // only_final restricts results to finalized documents.
  bool only_final = 7;
  // include_deleted also returns soft-deleted documents.
  bool include_deleted = 8;
  // page_size is the page length; 0 means the default (25), at most 200.
  int32 page_size = 9 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lte = 200
  ];
  // page_token is the next_page_token of the previous page; empty for the first page.
  string page_token = 10 [(buf.validate.field).string.max_len = 1024];
}

// SearchDocumentsResponse is one page of matching documents.
message SearchDocumentsResponse {
  // documents are the documents of this page.
  repeated Document documents = 1;
  // next_page_token fetches the next page; empty on the last page.
  string next_page_token = 2;
  // total_size is the number of matching documents across all pages.
  int32 total_size = 3;
}

// LinkDocumentRequest links a document to another subject (delegates to CoreService.LinkSubjects
// with document-specific validation + audit context).
message LinkDocumentRequest {
  // document_id is the document, used as the source of the edge.
  string document_id = 1 [(buf.validate.field).string.uuid = true];
  // target_subject_id is the subject the edge points to.
  string target_subject_id = 2 [(buf.validate.field).string.uuid = true];
  // relationship_type_code selects a type whose source kind is DOCUMENT, e.g.
  // DOCUMENT_AUTHORED_BY_ACTOR or DOCUMENT_SENT_TO_ACTOR.
  string relationship_type_code = 3 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 100
  ];
  // role_detail optionally qualifies the relation (at most 500 characters).
  string role_detail = 4 [(buf.validate.field).string.max_len = 500];
}

// LinkDocumentResponse returns the created edge.
message LinkDocumentResponse {
  // relationship is the created edge.
  SubjectRelationship relationship = 1;
  // audit_event is the RELATIONSHIP_LINKED audit event.
  AuditEvent audit_event = 2;
}

// DeleteDocumentRequest soft-deletes a document.
message DeleteDocumentRequest {
  // id is the document UUID; an already deleted document is rejected, a
  // locked one is not.
  string id = 1 [(buf.validate.field).string.uuid = true];
  // reason is the justification recorded on the audit event (at most 2000 characters).
  string reason = 3 [(buf.validate.field).string.max_len = 2000];
}

// DeleteDocumentResponse confirms a soft delete.
message DeleteDocumentResponse {
  // deleted_document_id is the soft-deleted document.
  string deleted_document_id = 1;
  // delete_event is the DOCUMENT_DELETED audit event.
  AuditEvent delete_event = 2;
}

// ListDocumentTypesRequest filters the document type catalogue.
message ListDocumentTypesRequest {
  // only_active returns only types offered for new documents.
  bool only_active = 1;
}

// ListDocumentTypesResponse returns the matching catalogue entries.
message ListDocumentTypesResponse {
  // document_types are the matching types.
  repeated DocumentType document_types = 1;
}

// =============================================
// DOCUMENT SERVICE
// =============================================

// DocumentService is the modern-GED document component of the Goéland POC.
//
// Every RPC carries a google.api.http annotation so the Vanguard transcoder also
// exposes it as REST/JSON (and the generated OpenAPI documents that surface).
// REST paths follow the spec (§13.3) with sensible additions for the extra RPCs.
// The Connect/gRPC path /goeland.v1.DocumentService/<Method> remains available too.
service DocumentService {
  // Create / register document metadata. SubjectRef + RecordMetadata are created via Core internally.
  // Requires goeland:write; subject, governance, document, version 1, optional
  // links and the DOCUMENT_CREATED audit event are written in one transaction.
  // Content already held by a live document reuses it (DOCUMENT_REUSED, reused = true).
  rpc CreateDocument(CreateDocumentRequest) returns (CreateDocumentResponse) {
    option (google.api.http) = {
      post: "/api/documents"
      body: "*"
    };
  }

  // Append a new current version to a document (optionally with new content).
  // Requires goeland:write; writes a DOCUMENT_VERSION_ADDED audit event;
  // FAILED_PRECONDITION when the document is locked or deleted.
  rpc AddDocumentVersion(AddDocumentVersionRequest) returns (AddDocumentVersionResponse) {
    option (google.api.http) = {
      post: "/api/documents/{document_id}/versions"
      body: "*"
    };
  }

  // List the versions of a document, newest first. Requires goeland:read.
  rpc ListDocumentVersions(ListDocumentVersionsRequest) returns (ListDocumentVersionsResponse) {
    option (google.api.http) = {get: "/api/documents/{document_id}/versions"};
  }

  // Retrieve a document with context (outgoing relationships, recent history).
  // Requires goeland:read; NOT_FOUND when the document does not exist.
  rpc GetDocument(GetDocumentRequest) returns (GetDocumentResponse) {
    option (google.api.http) = {get: "/api/documents/{id}"};
  }

  // Update mutable metadata only (respects locking).
  // Requires goeland:write; FAILED_PRECONDITION when the document is locked or deleted.
  rpc UpdateDocumentMetadata(UpdateDocumentMetadataRequest) returns (UpdateDocumentMetadataResponse) {
    option (google.api.http) = {
      patch: "/api/documents/{id}"
      body: "*"
    };
  }

  // Business finalization + optional governance lock. Critical for probative documents.
  // Requires goeland:write; FAILED_PRECONDITION when the document is locked or deleted.
  rpc FinalizeDocument(FinalizeDocumentRequest) returns (FinalizeDocumentResponse) {
    option (google.api.http) = {
      post: "/api/documents/{id}/finalize"
      body: "*"
    };
  }

  // Non-mutating, NON-PROBATIVE stored-hash comparison: checks the caller's
  // expected sha256 against the registered hash. It does NOT read storage bytes
  // and writes nothing (hence read-scoped). Real streamed verification is future work.
  rpc VerifyDocumentIntegrity(VerifyDocumentIntegrityRequest) returns (VerifyDocumentIntegrityResponse) {
    option (google.api.http) = {get: "/api/documents/{id}/integrity"};
  }

  // Full-text + filtered search (leverages the generated tsvector + GIN index).
  // Requires goeland:read.
  rpc SearchDocuments(SearchDocumentsRequest) returns (SearchDocumentsResponse) {
    option (google.api.http) = {get: "/api/documents/search"};
  }

  // Convenience wrapper around Core.LinkSubjects for document-centric use.
  // Requires goeland:write; same errors as CoreService.LinkSubjects.
  rpc LinkDocument(LinkDocumentRequest) returns (LinkDocumentResponse) {
    option (google.api.http) = {
      post: "/api/documents/{document_id}/links"
      body: "*"
    };
  }

  // Soft-delete a document (non-destructive) and write an audit event.
  // Requires goeland:write.
  rpc DeleteDocument(DeleteDocumentRequest) returns (DeleteDocumentResponse) {
    option (google.api.http) = {delete: "/api/documents/{id}"};
  }

  // List the controlled document types (classification catalogue).
  // Requires goeland:read.
  rpc ListDocumentTypes(ListDocumentTypesRequest) returns (ListDocumentTypesResponse) {
    option (google.api.http) = {get: "/api/document-types"};
  }
}
