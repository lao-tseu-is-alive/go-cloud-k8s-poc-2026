// Goéland POC - Retention of closed cases (spec v2 §35-36, roadmap GLD-032 step A).
//
// Proto-first definition for RetentionService + supporting messages. A
// retention policy says how long a closed case is kept and its final
// disposition; a case type names its default policy (CaseType.
// default_retention_policy_code). Closing a case computes its retention in the
// same transaction, as a snapshot of the policy; reopening ends it. A legal
// hold blocks any disposal while it lasts. The case is the unit: its documents
// follow it. Due cases are then handled through disposition bordereaux
// (step B): approved per case, executed by the records manager.
//
// The policy catalogue is administered with goeland:admin and logged in the
// reference change log; holds and the due list belong to the records manager
// (application role RECORDS_MANAGER, scope goeland:records). Retention changes
// are audited on the CASE subject.

syntax = "proto3";

package goeland.v1;

import "buf/validate/validate.proto";
import "goeland/v1/core.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/lao-tseu-is-alive/go-cloud-k8s-poc-2026/gen/goeland/v1;goelandv1";

// =============================================
// POLICIES
// =============================================

// FinalDisposition is what happens to a case when its retention expires.
enum FinalDisposition {
  // FINAL_DISPOSITION_UNSPECIFIED is the zero value; never stored.
  FINAL_DISPOSITION_UNSPECIFIED = 0;
  // FINAL_DISPOSITION_ARCHIVE transfers the case to the archives (versement).
  FINAL_DISPOSITION_ARCHIVE = 1;
  // FINAL_DISPOSITION_DESTROY eliminates the case after an approved bordereau.
  FINAL_DISPOSITION_DESTROY = 2;
  // FINAL_DISPOSITION_REVIEW leaves the choice to the records manager, case by case.
  FINAL_DISPOSITION_REVIEW = 3;
}

// RetentionPolicy is an entry of the retention schedule.
message RetentionPolicy {
  // id is the catalogue row UUID.
  string id = 1 [(buf.validate.field).string.uuid = true];
  // code is the unique stable key, e.g. EXAMPLE_ARCHIVE_10.
  string code = 2 [(google.api.field_behavior) = REQUIRED];
  // label is the human label.
  string label = 3;
  // description documents the policy.
  string description = 4;
  // legal_basis cites the rule the policy applies (law, schedule entry).
  string legal_basis = 5;
  // duration_years is how long a case is kept after its closing (0-200).
  int32 duration_years = 6;
  // final_disposition is what happens when the retention expires.
  FinalDisposition final_disposition = 7;
  // is_active reports whether the policy may be given to a case type.
  bool is_active = 8;
}

// ListRetentionPoliciesRequest filters the retention schedule.
message ListRetentionPoliciesRequest {
  // only_active returns only the policies that may be given to a case type.
  bool only_active = 1;
}

// ListRetentionPoliciesResponse returns the matching policies, by label (code as tie-break).
message ListRetentionPoliciesResponse {
  // retention_policies are the matching policies.
  repeated RetentionPolicy retention_policies = 1;
}

// CreateRetentionPolicyRequest adds a policy (administrators only).
message CreateRetentionPolicyRequest {
  // code is the immutable key: upper-case letters, digits and underscores
  // (2-100), starting with a letter; ALREADY_EXISTS when taken.
  string code = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.pattern = "^[A-Z][A-Z0-9_]{1,99}$"
  ];
  // label is the required human label (1-200 characters).
  string label = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 200
  ];
  // description documents the policy (at most 2000 characters).
  string description = 3 [(buf.validate.field).string.max_len = 2000];
  // legal_basis cites the rule the policy applies (at most 2000 characters).
  string legal_basis = 4 [(buf.validate.field).string.max_len = 2000];
  // duration_years is how long a case is kept after its closing (0-200).
  int32 duration_years = 5 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }];
  // final_disposition is what happens when the retention expires.
  FinalDisposition final_disposition = 6 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // reason is the justification recorded in the reference change log (at most 2000 characters).
  string reason = 7 [(buf.validate.field).string.max_len = 2000];
}

// CreateRetentionPolicyResponse returns the new policy and its log entry.
message CreateRetentionPolicyResponse {
  // retention_policy is the created entry, active.
  RetentionPolicy retention_policy = 1;
  // change is the REFERENCE_CREATED entry of the reference change log.
  ReferenceChange change = 2;
}

// UpdateRetentionPolicyRequest changes a policy (administrators only); absent
// fields are kept. A change applies to cases closed afterwards: running
// retentions keep the snapshot taken at closing.
message UpdateRetentionPolicyRequest {
  // code selects the entry to update (its code never changes).
  string code = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 100
  ];
  // label replaces the label when present (1-200 characters).
  optional string label = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  // description replaces the description when present (at most 2000 characters).
  optional string description = 3 [(buf.validate.field).string.max_len = 2000];
  // legal_basis replaces the legal basis when present (at most 2000 characters).
  optional string legal_basis = 4 [(buf.validate.field).string.max_len = 2000];
  // duration_years replaces the duration when present (0-200).
  optional int32 duration_years = 5 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }];
  // final_disposition replaces the disposition when present.
  optional FinalDisposition final_disposition = 6 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // is_active activates or deactivates the entry when present; an inactive
  // policy can no longer be given to a case type.
  optional bool is_active = 7;
  // reason is the justification recorded in the reference change log (at most 2000 characters).
  string reason = 8 [(buf.validate.field).string.max_len = 2000];
}

// UpdateRetentionPolicyResponse returns the updated policy and its log entry.
message UpdateRetentionPolicyResponse {
  // retention_policy is the updated entry.
  RetentionPolicy retention_policy = 1;
  // change is the REFERENCE_UPDATED entry of the reference change log.
  ReferenceChange change = 2;
}

// =============================================
// RETENTION OF A CASE
// =============================================

// SubjectRetention is the retention of a closed case: a snapshot of its policy
// taken at closing, ended when the case is reopened.
message SubjectRetention {
  // id identifies the retention row.
  string id = 1;
  // subject_id is the case.
  string subject_id = 2;
  // policy_code is the policy applied.
  string policy_code = 3;
  // policy_label is the policy's current label.
  string policy_label = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // duration_years is the duration applied (the policy's at closing).
  int32 duration_years = 5;
  // final_disposition is the disposition applied (the policy's at closing).
  FinalDisposition final_disposition = 6;
  // starts_on is the closing day (YYYY-MM-DD, Europe/Zurich).
  string starts_on = 7;
  // until_on is the day the retention ends (YYYY-MM-DD, starts_on plus the
  // duration): the case is due for its final disposition from that day.
  string until_on = 8;
  // created_at is when the retention was computed.
  google.protobuf.Timestamp created_at = 9;
  // created_by is the operator who closed the case (or applied the policy).
  string created_by = 10;
  // ended_at is when the retention ended (case reopened); absent while it runs.
  google.protobuf.Timestamp ended_at = 11;
  // ended_by is the operator who ended it.
  string ended_by = 12;
  // end_reason explains the end.
  string end_reason = 13;
  // disposition_status is the outcome of the retention: ARCHIVED (transferred
  // and frozen) or DISPOSED; unspecified while the case waits.
  DispositionStatus disposition_status = 14;
  // disposed_at is when the outcome was executed.
  google.protobuf.Timestamp disposed_at = 15;
  // bordereau_id is the bordereau that executed it.
  string bordereau_id = 16;
}

// DispositionStatus is the executed outcome of a retention.
enum DispositionStatus {
  // DISPOSITION_STATUS_UNSPECIFIED: not executed yet.
  DISPOSITION_STATUS_UNSPECIFIED = 0;
  // DISPOSITION_STATUS_ARCHIVED: transferred to the archives and frozen.
  DISPOSITION_STATUS_ARCHIVED = 1;
  // DISPOSITION_STATUS_DISPOSED: eliminated, only a notice and the proof are kept.
  DISPOSITION_STATUS_DISPOSED = 2;
}

// RetentionHold is a legal hold on a case: no disposal while it is active.
message RetentionHold {
  // id identifies the hold.
  string id = 1;
  // subject_id is the case.
  string subject_id = 2;
  // reason explains the hold (litigation, inquiry, ...).
  string reason = 3;
  // placed_at is when the hold was placed.
  google.protobuf.Timestamp placed_at = 4;
  // placed_by is the records manager who placed it.
  string placed_by = 5;
  // released_at is when the hold was released; absent while it is active.
  google.protobuf.Timestamp released_at = 6;
  // released_by is the records manager who released it.
  string released_by = 7;
  // release_reason explains the release.
  string release_reason = 8;
}

// GetCaseRetentionRequest reads the retention of a case.
message GetCaseRetentionRequest {
  // case_id is the case.
  string case_id = 1 [(buf.validate.field).string.uuid = true];
}

// GetCaseRetentionResponse describes the retention of a case.
message GetCaseRetentionResponse {
  // current is the running retention; absent while the case is open or when
  // its type has no policy.
  SubjectRetention current = 1;
  // hold is the active legal hold, if any.
  RetentionHold hold = 2;
  // retentions lists every retention of the case, running or ended, newest first.
  repeated SubjectRetention retentions = 3;
  // holds lists every hold of the case, newest first.
  repeated RetentionHold holds = 4;
  // default_policy is the policy of the case's type, applied at its next closing; absent when none.
  RetentionPolicy default_policy = 5;
}

// PlaceRetentionHoldRequest places a legal hold on a case (records manager).
message PlaceRetentionHoldRequest {
  // case_id is the case.
  string case_id = 1 [(buf.validate.field).string.uuid = true];
  // reason explains the hold (1-2000 characters); it is audited.
  string reason = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 2000
  ];
}

// PlaceRetentionHoldResponse returns the hold and its audit event.
message PlaceRetentionHoldResponse {
  // hold is the new active hold.
  RetentionHold hold = 1;
  // audit_event is the RETENTION_HOLD_PLACED event on the case.
  AuditEvent audit_event = 2;
}

// ReleaseRetentionHoldRequest releases the active legal hold of a case (records manager).
message ReleaseRetentionHoldRequest {
  // case_id is the case.
  string case_id = 1 [(buf.validate.field).string.uuid = true];
  // reason explains the release (1-2000 characters); it is audited.
  string reason = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 2000
  ];
}

// ReleaseRetentionHoldResponse returns the released hold and its audit event.
message ReleaseRetentionHoldResponse {
  // hold is the released hold.
  RetentionHold hold = 1;
  // audit_event is the RETENTION_HOLD_RELEASED event on the case.
  AuditEvent audit_event = 2;
}

// =============================================
// DUE LIST
// =============================================

// DueRetention is a running retention in the due list, with its case.
message DueRetention {
  // retention is the running retention.
  SubjectRetention retention = 1;
  // case_label is the case's label; empty when the caller may not read the case.
  string case_label = 2;
  // business_ref is the case's business reference.
  string business_ref = 3;
  // case_type_code is the case's type.
  string case_type_code = 4;
  // on_hold reports an active legal hold.
  bool on_hold = 5;
}

// ListDueRetentionsRequest pages the running retentions ending on or before a
// day (records manager or administrator).
message ListDueRetentionsRequest {
  // due_on is the day (YYYY-MM-DD); empty means today (Europe/Zurich).
  string due_on = 1 [(buf.validate.field).string.pattern = "^$|^[0-9]{4}-[0-9]{2}-[0-9]{2}$"];
  // final_disposition restricts the list to one disposition; unspecified means all.
  FinalDisposition final_disposition = 2 [(buf.validate.field).enum.defined_only = true];
  // include_held also lists the cases on legal hold.
  bool include_held = 3;
  // page_size is the page length; 0 means the default (25), at most 200.
  int32 page_size = 4 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }];
  // page_token is the next_page_token of the previous page; empty for the first page.
  string page_token = 5 [(buf.validate.field).string.max_len = 1024];
}

// ListDueRetentionsResponse returns a page of due retentions, oldest deadline first.
message ListDueRetentionsResponse {
  // retentions are the due retentions of the page.
  repeated DueRetention retentions = 1;
  // next_page_token fetches the next page; empty on the last page.
  string next_page_token = 2;
  // total_size counts every matching retention.
  int32 total_size = 3;
}

// ApplyCaseTypeRetentionRequest gives the case type's default policy to its
// closed cases that have no running retention (administrators only), e.g.
// after a policy was given to the type or for imported cases.
message ApplyCaseTypeRetentionRequest {
  // case_type_code is the case type; it must name a default policy.
  string case_type_code = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 100
  ];
  // reason is the justification recorded on every case (1-2000 characters).
  string reason = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 2000
  ];
}

// ApplyCaseTypeRetentionResponse counts the cases given a retention. A call
// handles at most 1000 cases (each one audited); call again while remaining > 0.
message ApplyCaseTypeRetentionResponse {
  // applied counts the closed cases that received a retention.
  int32 applied = 1;
  // remaining counts the closed cases of the type still without retention.
  int32 remaining = 2;
}

// =============================================
// DISPOSITION BORDEREAUX (step B)
// =============================================

// BordereauStatus is the state of a disposition bordereau.
enum BordereauStatus {
  // BORDEREAU_STATUS_UNSPECIFIED is the zero value; never stored.
  BORDEREAU_STATUS_UNSPECIFIED = 0;
  // BORDEREAU_STATUS_OPEN waits for the approvals, then for its execution.
  BORDEREAU_STATUS_OPEN = 1;
  // BORDEREAU_STATUS_EXECUTED handled its approved cases; its proof is kept.
  BORDEREAU_STATUS_EXECUTED = 2;
  // BORDEREAU_STATUS_CANCELLED was abandoned before its execution.
  BORDEREAU_STATUS_CANCELLED = 3;
}

// DispositionDecision is the approval of one case of a bordereau.
enum DispositionDecision {
  // DISPOSITION_DECISION_UNSPECIFIED is the zero value; never stored.
  DISPOSITION_DECISION_UNSPECIFIED = 0;
  // DISPOSITION_DECISION_PENDING waits for its approver.
  DISPOSITION_DECISION_PENDING = 1;
  // DISPOSITION_DECISION_APPROVED: the case will be handled at execution.
  DISPOSITION_DECISION_APPROVED = 2;
  // DISPOSITION_DECISION_REJECTED: the case is left out of the execution.
  DISPOSITION_DECISION_REJECTED = 3;
}

// DispositionItem is one case of a bordereau with its approval.
message DispositionItem {
  // id identifies the item.
  string id = 1;
  // bordereau_id is its bordereau.
  string bordereau_id = 2;
  // case_id is the case.
  string case_id = 3;
  // case_label is the case's label; empty when the caller may not read the case.
  string case_label = 4;
  // business_ref is the case's business reference.
  string business_ref = 5;
  // until_on is the end of the case's retention (YYYY-MM-DD).
  string until_on = 6;
  // policy_code is the policy applied to the case.
  string policy_code = 7;
  // approver_subject_id is who approves: the owning unit (MANAGE on it) or the case itself.
  string approver_subject_id = 8;
  // approver_label is the approver subject's label.
  string approver_label = 9;
  // decision is the approval state.
  DispositionDecision decision = 10;
  // decided_at is when the approver decided.
  google.protobuf.Timestamp decided_at = 11;
  // decided_by is the approver.
  string decided_by = 12;
  // decision_reason explains the decision.
  string decision_reason = 13;
  // export_id is the transfer package of an executed ARCHIVE item.
  string export_id = 14;
  // export_status is the state of that package (QUEUED, RUNNING, DONE, FAILED, EXPIRED).
  string export_status = 15;
  // export_sha256 is the package's SHA-256 once built.
  string export_sha256 = 16;
}

// DispositionBordereau gathers due cases of one final disposition for approval and execution.
message DispositionBordereau {
  // id identifies the bordereau.
  string id = 1;
  // final_disposition is ARCHIVE or DESTROY.
  FinalDisposition final_disposition = 2;
  // status is the bordereau state.
  BordereauStatus status = 3;
  // reason explains the bordereau.
  string reason = 4;
  // prepared_by is the records manager who prepared it (never an approver).
  string prepared_by = 5;
  // prepared_at is when it was prepared.
  google.protobuf.Timestamp prepared_at = 6;
  // closed_at is when it was executed or cancelled.
  google.protobuf.Timestamp closed_at = 7;
  // closed_by is who executed or cancelled it.
  string closed_by = 8;
  // close_reason explains a cancellation.
  string close_reason = 9;
  // proof_sha256 is the SHA-256 of the proof manifest, set at execution.
  string proof_sha256 = 10;
  // items are its cases (GetDispositionBordereau only).
  repeated DispositionItem items = 11;
  // item_count counts its cases.
  int32 item_count = 12;
  // pending_count counts its cases waiting for a decision.
  int32 pending_count = 13;
  // approved_count counts its approved cases.
  int32 approved_count = 14;
  // proof_manifest is the proof manifest (JSON) of an executed bordereau,
  // exactly the bytes whose SHA-256 is proof_sha256: anyone can recompute it.
  string proof_manifest = 15;
}

// CreateDispositionBordereauRequest prepares a bordereau (records manager).
message CreateDispositionBordereauRequest {
  // final_disposition is ARCHIVE or DESTROY; a case of a REVIEW policy fits either.
  FinalDisposition final_disposition = 1 [(buf.validate.field).enum = {
    in: [
      1,
      2
    ]
  }];
  // reason explains the bordereau (1-2000 characters).
  string reason = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 2000
  ];
  // case_ids are the due cases (1-500), each with a running retention ended,
  // no legal hold and no other open bordereau.
  repeated string case_ids = 3 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 500
    unique: true
    items: {
      string: {uuid: true}
    }
  }];
}

// CreateDispositionBordereauResponse returns the prepared bordereau, open, with its items.
message CreateDispositionBordereauResponse {
  // bordereau is the bordereau.
  DispositionBordereau bordereau = 1;
}

// GetDispositionBordereauResponse returns the bordereau with its items.
message GetDispositionBordereauResponse {
  // bordereau is the bordereau.
  DispositionBordereau bordereau = 1;
}

// ExecuteDispositionBordereauResponse returns the executed bordereau with its items and proof.
message ExecuteDispositionBordereauResponse {
  // bordereau is the bordereau.
  DispositionBordereau bordereau = 1;
}

// CancelDispositionBordereauResponse returns the cancelled bordereau.
message CancelDispositionBordereauResponse {
  // bordereau is the bordereau.
  DispositionBordereau bordereau = 1;
}

// GetDispositionBordereauRequest reads a bordereau (records manager).
message GetDispositionBordereauRequest {
  // id is the bordereau.
  string id = 1 [(buf.validate.field).string.uuid = true];
}

// ListDispositionBordereauxRequest pages the bordereaux, newest first (records manager).
message ListDispositionBordereauxRequest {
  // status restricts the list to one state; unspecified means all.
  BordereauStatus status = 1 [(buf.validate.field).enum.defined_only = true];
  // page_size is the page length; 0 means the default (25), at most 200.
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }];
  // page_token is the next_page_token of the previous page; empty for the first page.
  string page_token = 3 [(buf.validate.field).string.max_len = 1024];
}

// ListDispositionBordereauxResponse returns a page of bordereaux (without items).
message ListDispositionBordereauxResponse {
  // bordereaux are the bordereaux of the page.
  repeated DispositionBordereau bordereaux = 1;
  // next_page_token fetches the next page; empty on the last page.
  string next_page_token = 2;
  // total_size counts every matching bordereau.
  int32 total_size = 3;
}

// ListMyDispositionApprovalsRequest lists the cases waiting for the caller's approval.
message ListMyDispositionApprovalsRequest {}

// ListMyDispositionApprovalsResponse returns the items the caller may decide, oldest bordereau first.
message ListMyDispositionApprovalsResponse {
  // items are the pending items whose approver subject the caller manages.
  repeated DispositionItem items = 1;
  // dispositions gives, per item id, its bordereau's final disposition.
  map<string, FinalDisposition> dispositions = 2;
}

// DecideDispositionItemRequest approves or rejects one case of a bordereau.
message DecideDispositionItemRequest {
  // id is the item.
  string id = 1 [(buf.validate.field).string.uuid = true];
  // approve approves the case; false rejects it.
  bool approve = 2;
  // reason explains the decision (1-2000 characters); it is audited.
  string reason = 3 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 2000
  ];
}

// DecideDispositionItemResponse returns the decided item.
message DecideDispositionItemResponse {
  // item is the decided item.
  DispositionItem item = 1;
}

// ExecuteDispositionBordereauRequest executes a bordereau whose cases are all decided (records manager).
message ExecuteDispositionBordereauRequest {
  // id is the bordereau.
  string id = 1 [(buf.validate.field).string.uuid = true];
}

// RebuildTransferPackageRequest queues again the transfer package of a
// transferred case whose package failed or expired (records manager).
message RebuildTransferPackageRequest {
  // id is the bordereau item of the transferred case.
  string id = 1 [(buf.validate.field).string.uuid = true];
}

// RebuildTransferPackageResponse returns the item with its new package.
message RebuildTransferPackageResponse {
  // item is the item, now linked to the queued package.
  DispositionItem item = 1;
}

// SimulateEliminationRequest runs the execution of an elimination bordereau
// and rolls it back: nothing is written nor destroyed (records manager).
message SimulateEliminationRequest {
  // id is the bordereau, of final disposition DESTROY, whose cases are all decided.
  string id = 1 [(buf.validate.field).string.uuid = true];
}

// EliminationPreview is what the elimination of one approved case would do.
message EliminationPreview {
  // case_id is the approved case.
  string case_id = 1;
  // documents_eliminated counts the documents only this case holds: they would be blanked and deleted.
  int32 documents_eliminated = 2;
  // documents_kept counts the documents still linked to a thing or to a case that stays: they stay untouched.
  int32 documents_kept = 3;
  // files_destroyed counts the files no other document version references: their bytes would be destroyed.
  int32 files_destroyed = 4;
  // exports_purged counts the ordinary exports of the case that would be removed.
  int32 exports_purged = 5;
}

// SimulateEliminationResponse returns what the execution would do, case by case.
message SimulateEliminationResponse {
  // cases are the approved cases of the bordereau.
  repeated EliminationPreview cases = 1;
}

// CancelDispositionBordereauRequest abandons an open bordereau (records manager).
message CancelDispositionBordereauRequest {
  // id is the bordereau.
  string id = 1 [(buf.validate.field).string.uuid = true];
  // reason explains the cancellation (1-2000 characters).
  string reason = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 2000
  ];
}

// =============================================
// SERVICE
// =============================================

// RetentionService manages the retention schedule and the retention of closed cases.
service RetentionService {
  // List the retention policies. Requires goeland:read.
  rpc ListRetentionPolicies(ListRetentionPoliciesRequest) returns (ListRetentionPoliciesResponse) {
    option (google.api.http) = {get: "/api/retention-policies"};
  }

  // Add a retention policy. Requires goeland:admin; logs REFERENCE_CREATED.
  rpc CreateRetentionPolicy(CreateRetentionPolicyRequest) returns (CreateRetentionPolicyResponse) {
    option (google.api.http) = {
      post: "/api/retention-policies"
      body: "*"
    };
  }

  // Change a retention policy. Requires goeland:admin; logs REFERENCE_UPDATED.
  rpc UpdateRetentionPolicy(UpdateRetentionPolicyRequest) returns (UpdateRetentionPolicyResponse) {
    option (google.api.http) = {
      patch: "/api/retention-policies/{code}"
      body: "*"
    };
  }

  // Read the retention of a case. Requires goeland:read and READ on the case.
  rpc GetCaseRetention(GetCaseRetentionRequest) returns (GetCaseRetentionResponse) {
    option (google.api.http) = {get: "/api/cases/{case_id}/retention"};
  }

  // Place a legal hold on a case. Requires goeland:records.
  rpc PlaceRetentionHold(PlaceRetentionHoldRequest) returns (PlaceRetentionHoldResponse) {
    option (google.api.http) = {
      post: "/api/cases/{case_id}/retention-hold"
      body: "*"
    };
  }

  // Release the legal hold of a case. Requires goeland:records.
  rpc ReleaseRetentionHold(ReleaseRetentionHoldRequest) returns (ReleaseRetentionHoldResponse) {
    option (google.api.http) = {
      post: "/api/cases/{case_id}/retention-hold/release"
      body: "*"
    };
  }

  // List the running retentions ending on or before a day. Requires goeland:records or goeland:admin.
  rpc ListDueRetentions(ListDueRetentionsRequest) returns (ListDueRetentionsResponse) {
    option (google.api.http) = {get: "/api/retentions/due"};
  }

  // Give a case type's policy to its closed cases without retention. Requires goeland:admin.
  rpc ApplyCaseTypeRetention(ApplyCaseTypeRetentionRequest) returns (ApplyCaseTypeRetentionResponse) {
    option (google.api.http) = {
      post: "/api/case-types/{case_type_code}/apply-retention"
      body: "*"
    };
  }

  // Prepare a disposition bordereau. Requires goeland:records.
  rpc CreateDispositionBordereau(CreateDispositionBordereauRequest) returns (CreateDispositionBordereauResponse) {
    option (google.api.http) = {
      post: "/api/disposition-bordereaux"
      body: "*"
    };
  }

  // List the bordereaux. Requires goeland:records.
  rpc ListDispositionBordereaux(ListDispositionBordereauxRequest) returns (ListDispositionBordereauxResponse) {
    option (google.api.http) = {get: "/api/disposition-bordereaux"};
  }

  // Read a bordereau with its cases. Requires goeland:records.
  rpc GetDispositionBordereau(GetDispositionBordereauRequest) returns (GetDispositionBordereauResponse) {
    option (google.api.http) = {get: "/api/disposition-bordereaux/{id}"};
  }

  // List the cases waiting for the caller's approval. Requires goeland:read.
  rpc ListMyDispositionApprovals(ListMyDispositionApprovalsRequest) returns (ListMyDispositionApprovalsResponse) {
    option (google.api.http) = {get: "/api/disposition-items/mine"};
  }

  // Approve or reject a case of a bordereau. Requires goeland:write and MANAGE
  // on the approver subject; the preparer never decides.
  rpc DecideDispositionItem(DecideDispositionItemRequest) returns (DecideDispositionItemResponse) {
    option (google.api.http) = {
      post: "/api/disposition-items/{id}/decide"
      body: "*"
    };
  }

  // Execute a bordereau whose cases are all decided. Requires goeland:records.
  rpc ExecuteDispositionBordereau(ExecuteDispositionBordereauRequest) returns (ExecuteDispositionBordereauResponse) {
    option (google.api.http) = {
      post: "/api/disposition-bordereaux/{id}/execute"
      body: "*"
    };
  }

  // Queue again the failed or expired transfer package of a transferred case. Requires goeland:records.
  rpc RebuildTransferPackage(RebuildTransferPackageRequest) returns (RebuildTransferPackageResponse) {
    option (google.api.http) = {
      post: "/api/disposition-items/{id}/rebuild-transfer"
      body: "*"
    };
  }

  // Simulate the execution of an elimination bordereau: run it, report what it
  // would do, roll it back. Requires goeland:records.
  rpc SimulateElimination(SimulateEliminationRequest) returns (SimulateEliminationResponse) {
    option (google.api.http) = {
      post: "/api/disposition-bordereaux/{id}/simulate"
      body: "*"
    };
  }

  // Abandon an open bordereau. Requires goeland:records.
  rpc CancelDispositionBordereau(CancelDispositionBordereauRequest) returns (CancelDispositionBordereauResponse) {
    option (google.api.http) = {
      post: "/api/disposition-bordereaux/{id}/cancel"
      body: "*"
    };
  }
}
