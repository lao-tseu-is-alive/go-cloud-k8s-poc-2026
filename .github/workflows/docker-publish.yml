name: Docker-publish

on:
  push:
    # Triggers only on semantic version tags
    tags: [ 'v[0-9]+.[0-9]+.[0-9]+' ]

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-scan-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write # Mandatory for uploading SARIF results

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The tag must equal "v" + pkg/version/version.go Version, otherwise the
      # image would report a version different from its tag.
      - name: Verify tag matches source version
        run: bash scripts/check_release_tag.sh "${GITHUB_REF_NAME}"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Single source of truth: the version required in go.mod (currently 1.27.3).
          go-version-file: go.mod

      - name: Set up Bun
        # v2.2.0 - pinned to commit SHA to prevent supply chain attacks,
        # see: https://docs.github.com/en/actions/reference/security/secure-use#using-third-party-actions
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1'

      - name: Setup Buf
        # v1.6.0 - pinned to commit SHA; the downloaded buf binary is verified
        # against its published sha256 (lock-file equivalent, Sonar S8545).
        uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7
        with:
          version: 1.70.0
          checksum: e2bbcdd324da09c16a15963dc2dae0525c955c05dc118223cf732f4f7509c5e6
          setup_only: true

      # Same gate as local runs and ci.yml (docs/DOCUMENTATION.md, "Control chain"):
      # frontend type-check/lint/build, format, lint, race tests, documentation,
      # version/changelog/roadmap traceability. Nothing is pushed unless it passes.
      - name: Release gate
        run: make release-check

      - name: Setup Docker buildx
        # v4.4.1 - pinned to commit SHA to prevent supply chain attacks,
        # see: https://docs.github.com/en/actions/reference/security/secure-use#using-third-party-actions
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Log into registry ${{ env.REGISTRY }}
        # v4.6.0 - pinned to commit SHA to prevent supply chain attacks,
        # see: https://docs.github.com/en/actions/reference/security/secure-use#using-third-party-actions
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Revision and build stamp baked into the binary (pkg/version), as the
      # local scripts/01_build_image_locally.sh does; /goAppInfo reports them.
      - name: Compute build metadata
        id: buildinfo
        run: |
          echo "revision=${GITHUB_REF_NAME}-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "stamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # 1. Build the image locally first for scanning
      - name: Build local image
        # v7.4.0 - pinned to commit SHA to prevent supply chain attacks,
        # see: https://docs.github.com/en/actions/reference/security/secure-use#using-third-party-actions
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          load: true # This loads the image into the local docker daemon instead of pushing it
          tags: goeland-server:test
          build-args: |
            APP_REVISION=${{ steps.buildinfo.outputs.revision }}
            BUILD_STAMP=${{ steps.buildinfo.outputs.stamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. Install Trivy CLI explicitly (recommended for controlling the exact version)
      # This replaces fragile patterns like checking out aquasecurity/trivy + running contrib/install.sh
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1 (release tag of 2026-06-03, after the 2026 incident)
        with:
          trivy-version: '0.69.3' # Safe version (see https://github.com/aquasecurity/trivy/discussions/10425). Avoid v0.69.1 and the malicious 0.69.4

      # 3. Run Trivy vulnerability scanner on the built image
      - name: Run Trivy vulnerability scanner
        # pinned to commit SHA to prevent supply chain attacks
        uses: aquasecurity/trivy-action@cf5c088a69634cd13ccddc735d7926162c31f9a6
        with:
          image-ref: 'goeland-server:test'
          severity: 'MEDIUM,CRITICAL,HIGH'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'
          trivy-version: '0.69.3' # Match the CLI version for consistency

      # 4. Upload results to the Security tab
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

      # 4b. Gate: fail the job on fixable HIGH/CRITICAL so a vulnerable image is
      # never pushed. Runs after the SARIF upload (which reports MEDIUM too) so
      # findings still reach the Security tab even when this gate fails; reuses
      # Trivy's DB cached by the scan above (skip-db-update) so it is fast.
      # pinned to commit SHA to prevent supply chain attacks
      - name: Fail on HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@cf5c088a69634cd13ccddc735d7926162c31f9a6
        with:
          image-ref: 'goeland-server:test'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          format: 'table'
          exit-code: '1'
          skip-db-update: true
          trivy-version: '0.69.3'

      # 5. Final Push - Only if previous steps (including scan) succeeded
      - name: Extract Docker metadata
        id: meta
        # v6.2.0 - pinned to commit SHA to prevent supply chain attacks,
        # see: https://docs.github.com/en/actions/reference/security/secure-use#using-third-party-actions
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push Docker image
        # v7.4.0 - pinned to commit SHA to prevent supply chain attacks,
        # see: https://docs.github.com/en/actions/reference/security/secure-use#using-third-party-actions
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APP_REVISION=${{ steps.buildinfo.outputs.revision }}
            BUILD_STAMP=${{ steps.buildinfo.outputs.stamp }}
          labels: ${{ steps.meta.outputs.labels }}
          # SBOM and build provenance attestations attached to the pushed image
          # (GLD-059); `docker buildx imagetools inspect <image> --format '{{ json .SBOM }}'` reads them.
          sbom: true
          provenance: mode=max
          # Use build cache to speed up subsequent runs
          cache-from: type=gha
          cache-to: type=gha,mode=max